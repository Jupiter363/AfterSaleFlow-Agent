# 文件作用：项目代码或配置文件，支撑售后争议系统的构建、运行、测试或部署。
# 说明：本注释用于帮助读者先了解配置用途，再修改具体配置项。

name: ${COMPOSE_PROJECT_NAME:-order-fulfillment-dispute-system}

x-common: &common
  restart: unless-stopped
  networks:
    - dispute-network

x-java-build: &java-build
  context: ./java-api-service

x-java-environment: &java-environment
  APP_ENV: ${APP_ENV:-local}
  POSTGRES_HOST: postgresql
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${JAVA_DB_USER:-dispute_app}
  POSTGRES_PASSWORD: ${JAVA_DB_PASSWORD}
  JAVA_DB_NAME: ${JAVA_DB_NAME:-dispute_system}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  ELASTICSEARCH_URL: http://elasticsearch:9200
  TEMPORAL_ADDRESS: temporal-server:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-case-dispute-task-queue}
  TEMPORAL_SEARCH_ATTRIBUTES_ENABLED: ${TEMPORAL_SEARCH_ATTRIBUTES_ENABLED:-false}
  TEMPORAL_PAYLOAD_CODEC_MODE: ${TEMPORAL_PAYLOAD_CODEC_MODE:-DISABLED}
  TEMPORAL_PAYLOAD_CODEC_ACTIVE_KEY_ID: ${TEMPORAL_PAYLOAD_CODEC_ACTIVE_KEY_ID:-}
  TEMPORAL_PAYLOAD_CODEC_ACTIVE_KEY_BASE64: ${TEMPORAL_PAYLOAD_CODEC_ACTIVE_KEY_BASE64:-}
  OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
  OTEL_TRACES_SAMPLING_PROBABILITY: ${OTEL_TRACES_SAMPLING_PROBABILITY:-1.0}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
  OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:-10s}
  EVIDENCE_WINDOW: ${EVIDENCE_WINDOW:-PT2H}
  HEARING_WINDOW: ${HEARING_WINDOW:-PT3H}
  HEARING_PARTY_STAGE_WINDOW: ${HEARING_PARTY_STAGE_WINDOW:-PT20M}
  SSE_HEARTBEAT: ${SSE_HEARTBEAT:-PT15S}
  SEED_DEMO_DISPUTES: ${SEED_DEMO_DISPUTES:-false}
  APPROVAL_REFUND_THRESHOLD: ${APPROVAL_REFUND_THRESHOLD:-500.00}
  APPROVAL_RESHIP_THRESHOLD: ${APPROVAL_RESHIP_THRESHOLD:-300.00}
  APPROVAL_PACKET_EXPIRY_HOURS: ${APPROVAL_PACKET_EXPIRY_HOURS:-168}
  APPROVAL_REVIEW_DUE_BUSINESS_DAYS: ${APPROVAL_REVIEW_DUE_BUSINESS_DAYS:-1}
  PYTHON_AGENT_SERVICE_URL: http://python-agent-service:8000
  APP_AGENT_TIMEOUT_MS: ${APP_AGENT_TIMEOUT_MS:-300000}
  APP_TENANT_SURROGATE: ${APP_TENANT_SURROGATE:-legacy-default}
  APP_ORCHESTRATION_COMMAND_V1_ENABLED: ${APP_ORCHESTRATION_COMMAND_V1_ENABLED:-false}
  APP_ORCHESTRATION_NEW_EPOCH_MODE: ${APP_ORCHESTRATION_NEW_EPOCH_MODE:-LEGACY}
  APP_ORCHESTRATION_NON_LEGACY_EPOCH_ALLOCATION_ENABLED: ${APP_ORCHESTRATION_NON_LEGACY_EPOCH_ALLOCATION_ENABLED:-false}
  APP_ORCHESTRATION_TEMPORAL_WRITER_ENABLED: ${APP_ORCHESTRATION_TEMPORAL_WRITER_ENABLED:-false}
  APP_ORCHESTRATION_INTAKE_EPOCH_SELECTION_MODE: ${APP_ORCHESTRATION_INTAKE_EPOCH_SELECTION_MODE:-LEGACY}
  APP_ORCHESTRATION_INTAKE_SHADOW_COHORT_BASIS_POINTS: ${APP_ORCHESTRATION_INTAKE_SHADOW_COHORT_BASIS_POINTS:-0}
  APP_ORCHESTRATION_INTAKE_COHORT_POLICY_VERSION: ${APP_ORCHESTRATION_INTAKE_COHORT_POLICY_VERSION:-}
  APP_ORCHESTRATION_INTAKE_SIGNED_SYNTHETIC_SHADOW_ENABLED: ${APP_ORCHESTRATION_INTAKE_SIGNED_SYNTHETIC_SHADOW_ENABLED:-false}
  APP_ORCHESTRATION_INTAKE_SYNTHETIC_ADMISSION_TRUST_ENABLED: ${APP_ORCHESTRATION_INTAKE_SYNTHETIC_ADMISSION_TRUST_ENABLED:-false}
  APP_ORCHESTRATION_INTAKE_SYNTHETIC_ADMISSION_TRUST_PUBLIC_KEY_DIRECTORY: /run/secrets/intake-synthetic/admission-public-keys
  APP_ORCHESTRATION_INTAKE_SYNTHETIC_EXCHANGE_BUCKET: ${MINIO_BUCKET_INTAKE_SYNTHETIC_PRIVATE:-intake-synthetic-private}
  APP_ORCHESTRATION_INTAKE_SYNTHETIC_EXCHANGE_PREFIX: ${APP_ORCHESTRATION_INTAKE_SYNTHETIC_EXCHANGE_PREFIX:-signed-synthetic/intake}
  APP_ORCHESTRATION_COMMAND_OUTBOX_BATCH_SIZE: ${APP_ORCHESTRATION_COMMAND_OUTBOX_BATCH_SIZE:-32}
  APP_ORCHESTRATION_COMMAND_OUTBOX_LEASE_DURATION: ${APP_ORCHESTRATION_COMMAND_OUTBOX_LEASE_DURATION:-PT1M}
  APP_ORCHESTRATION_COMMAND_OUTBOX_BASE_BACKOFF: ${APP_ORCHESTRATION_COMMAND_OUTBOX_BASE_BACKOFF:-PT1S}
  APP_ORCHESTRATION_COMMAND_OUTBOX_MAX_BACKOFF: ${APP_ORCHESTRATION_COMMAND_OUTBOX_MAX_BACKOFF:-PT5M}
  APP_ORCHESTRATION_COMMAND_OUTBOX_POLL_INTERVAL: ${APP_ORCHESTRATION_COMMAND_OUTBOX_POLL_INTERVAL:-PT5S}
  APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_ENABLED: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_ENABLED:-false}
  APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_BATCH_SIZE: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_BATCH_SIZE:-32}
  APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_CONCURRENCY: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_CONCURRENCY:-32}
  APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_LEASE_DURATION: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_LEASE_DURATION:-PT2M}
  APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_COMPLETION_TIMEOUT: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_COMPLETION_TIMEOUT:-PT90S}
  APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_BASE_BACKOFF: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_BASE_BACKOFF:-PT1S}
  APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_MAX_BACKOFF: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_MAX_BACKOFF:-PT5M}
  APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_POLL_INTERVAL: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_POLL_INTERVAL:-PT5S}
  APP_ORCHESTRATION_DOMAIN_EVENT_RECOVERY_CLAIM_DURATION: ${APP_ORCHESTRATION_DOMAIN_EVENT_RECOVERY_CLAIM_DURATION:-PT5M}
  APP_ORCHESTRATION_PROJECTION_RECONCILIATION_CLAIM_DURATION: ${APP_ORCHESTRATION_PROJECTION_RECONCILIATION_CLAIM_DURATION:-PT5M}
  OCR_SERVICE_URL: http://ocr-parser-service:8010
  JAVA_SERVICE_SECRET: ${JAVA_SERVICE_SECRET}
  PYTHON_AGENT_SERVICE_SECRET: ${PYTHON_AGENT_SERVICE_SECRET}
  OCR_SERVICE_SECRET: ${OCR_SERVICE_SECRET}
  FEATURE_HUMAN_REVIEW_REQUIRED: "true"
  FEATURE_TOOL_EXECUTOR_SIMULATION: "true"
  ENABLE_AUDIT_LOG: "true"
  ENABLE_SENSITIVE_LOG_MASKING: "true"

x-java-core-depends-on: &java-core-depends-on
  postgresql:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio-init:
    condition: service_healthy
  elasticsearch-init:
    condition: service_healthy
  temporal-server:
    condition: service_healthy

x-java-api-depends-on: &java-api-depends-on
  <<: *java-core-depends-on
  python-agent-service:
    condition: service_healthy
  ocr-parser-service:
    condition: service_healthy

x-java-agent-depends-on: &java-agent-depends-on
  <<: *java-core-depends-on
  python-agent-service:
    condition: service_healthy

services:
  postgresql:
    <<: *common
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16-alpine}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:-dispute_system}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_DB_NAME: ${JAVA_DB_NAME:-dispute_system}
      JAVA_DB_USER: ${JAVA_DB_USER:-dispute_app}
      JAVA_DB_PASSWORD: ${JAVA_DB_PASSWORD}
      TEMPORAL_DB_NAME: ${TEMPORAL_DB_NAME:-temporal}
      TEMPORAL_DB_USER: ${TEMPORAL_DB_USER:-temporal_app}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD}
      LANGFUSE_DB_NAME: ${LANGFUSE_DB_NAME:-langfuse}
      LANGFUSE_DB_USER: ${LANGFUSE_DB_USER:-langfuse_app}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      LITELLM_DB_NAME: ${LITELLM_DB_NAME:-litellm}
      LITELLM_DB_USER: ${LITELLM_DB_USER:-litellm_app}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD}
      GRAPH_DB_NAME: ${GRAPH_DB_NAME:-dispute_graph}
      GRAPH_DB_SCHEMA: ${GRAPH_DB_SCHEMA:-graph_runtime}
      GRAPH_OWNER_USER: ${GRAPH_OWNER_USER:-graph_owner}
      GRAPH_MIGRATOR_USER: ${GRAPH_MIGRATOR_USER:-graph_migrator}
      GRAPH_MIGRATOR_PASSWORD: ${GRAPH_MIGRATOR_PASSWORD}
      GRAPH_RUNTIME_USER: ${GRAPH_RUNTIME_USER:-graph_runtime}
      GRAPH_RUNTIME_PASSWORD: ${GRAPH_RUNTIME_PASSWORD}
      GRAPH_RETENTION_USER: ${GRAPH_RETENTION_USER:-graph_retention}
      GRAPH_RETENTION_PASSWORD: ${GRAPH_RETENTION_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./deploy/postgresql/init-multiple-databases.sh:/docker-entrypoint-initdb.d/10-init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    <<: *common
    image: ${REDIS_IMAGE:-public.ecr.aws/docker/library/redis:7.2-alpine}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    <<: *common
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.13.4}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${ELASTICSEARCH_HOST_PORT:-19200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  elasticsearch-init:
    <<: *common
    image: ${ELASTICSEARCH_INIT_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.13.4}
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./deploy/elasticsearch/init-indices.sh:/opt/init-indices.sh:ro
    entrypoint: ["/bin/sh", "/opt/init-indices.sh"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    <<: *common
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z}
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    <<: *common
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2024-06-12T14-34-03Z}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./deploy/minio/init-buckets.sh:/opt/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/opt/init-buckets.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_EVIDENCE_ORIGINAL: ${MINIO_BUCKET_EVIDENCE_ORIGINAL:-evidence-original}
      MINIO_BUCKET_EVIDENCE_DESENSITIZED: ${MINIO_BUCKET_EVIDENCE_DESENSITIZED:-evidence-desensitized}
      MINIO_BUCKET_INTAKE_SYNTHETIC_PRIVATE: ${MINIO_BUCKET_INTAKE_SYNTHETIC_PRIVATE:-intake-synthetic-private}
      MINIO_BUCKET_OCR_TEMP: ${MINIO_BUCKET_OCR_TEMP:-ocr-temp}
      MINIO_BUCKET_POLICY_FILES: ${MINIO_BUCKET_POLICY_FILES:-policy-files}
      MINIO_BUCKET_REVIEW_EXPORTS: ${MINIO_BUCKET_REVIEW_EXPORTS:-review-exports}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal-server:
    <<: *common
    image: ${TEMPORAL_IMAGE:-temporalio/auto-setup:1.25.2}
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgresql
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal_app}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
      DBNAME: ${TEMPORAL_DB_NAME:-temporal}
      VISIBILITY_DBNAME: temporal_visibility
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./deploy/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "127.0.0.1:${TEMPORAL_HOST_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal-server:7233 cluster health | grep SERVING"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  langfuse:
    <<: *common
    image: ${LANGFUSE_IMAGE:-ghcr.io/langfuse/langfuse:2.95.11}
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse_app}:${LANGFUSE_DB_PASSWORD}@postgresql:5432/${LANGFUSE_DB_NAME:-langfuse}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:13000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      LANGFUSE_INIT_ORG_ID: aftersale-flow
      LANGFUSE_INIT_ORG_NAME: AfterSaleFlow
      LANGFUSE_INIT_PROJECT_ID: dispute-agent
      LANGFUSE_INIT_PROJECT_NAME: Dispute Agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-13000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://' + process.env.HOSTNAME + ':3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  litellm-proxy:
    <<: *common
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-v1.63.14-stable}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DEFAULT_LLM_API_BASE: ${DEFAULT_LLM_API_BASE:-https://ws-veazvl2fycrurdmv.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://${LITELLM_DB_USER:-litellm_app}:${LITELLM_DB_PASSWORD}@postgresql:5432/${LITELLM_DB_NAME:-litellm}
    ports:
      - "127.0.0.1:${LITELLM_PORT:-14000}:4000"
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  graph-migrate:
    <<: *common
    profiles: ["graph-shadow"]
    restart: "no"
    build:
      context: ./python-agent-service
    command: ["python", "-m", "app.graph_runtime.migrations"]
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      GRAPH_MIGRATION_DATABASE_DSN: postgresql://${GRAPH_MIGRATOR_USER:-graph_migrator}:${GRAPH_MIGRATOR_PASSWORD}@postgresql:5432/${GRAPH_DB_NAME:-dispute_graph}
      GRAPH_MIGRATION_EXPECTED_USER: ${GRAPH_MIGRATOR_USER:-graph_migrator}
      GRAPH_OWNER_USER: ${GRAPH_OWNER_USER:-graph_owner}
      GRAPH_RUNTIME_USER: ${GRAPH_RUNTIME_USER:-graph_runtime}
      GRAPH_RETENTION_USER: ${GRAPH_RETENTION_USER:-graph_retention}
      GRAPH_DB_SCHEMA: ${GRAPH_DB_SCHEMA:-graph_runtime}
      GRAPH_DB_ENVIRONMENT_GENERATION: ${GRAPH_DB_ENVIRONMENT_GENERATION}

  graph-restore-validation:
    <<: *common
    profiles: ["graph-shadow"]
    restart: "no"
    build:
      context: ./python-agent-service
    command: ["python", "-m", "app.graph_runtime.restore_validation"]
    depends_on:
      graph-migrate:
        condition: service_completed_successfully
    environment:
      GRAPH_MIGRATION_DATABASE_DSN: postgresql://${GRAPH_MIGRATOR_USER:-graph_migrator}:${GRAPH_MIGRATOR_PASSWORD}@postgresql:5432/${GRAPH_DB_NAME:-dispute_graph}
      GRAPH_MIGRATION_EXPECTED_USER: ${GRAPH_MIGRATOR_USER:-graph_migrator}
      GRAPH_OWNER_USER: ${GRAPH_OWNER_USER:-graph_owner}
      GRAPH_DB_SCHEMA: ${GRAPH_DB_SCHEMA:-graph_runtime}
      GRAPH_DB_ENVIRONMENT_GENERATION: ${GRAPH_DB_ENVIRONMENT_GENERATION}
      GRAPH_DB_RESTORE_VERIFICATION_HASH: ${GRAPH_DB_RESTORE_VERIFICATION_HASH}

  python-agent-service:
    <<: *common
    build:
      context: ./python-agent-service
    environment:
      APP_ENV: ${APP_ENV:-local}
      LITELLM_BASE_URL: http://litellm-proxy:4000
      LITELLM_MODEL: ${LITELLM_DEFAULT_MODEL:-qwen3.7-plus}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_ENABLED: "true"
      PROMPT_VERSION: hearing-v1
      JAVA_API_SERVICE_URL: ${JAVA_API_SERVICE_URL:-http://java-api-service:8080}
      JAVA_SERVICE_SECRET: ${JAVA_SERVICE_SECRET}
      PYTHON_AGENT_SERVICE_SECRET: ${PYTHON_AGENT_SERVICE_SECRET}
      ENABLE_SENSITIVE_LOG_MASKING: ${ENABLE_SENSITIVE_LOG_MASKING:-true}
      GRAPH_GATEWAY_MODE: ${GRAPH_GATEWAY_MODE:-DISABLED}
      GRAPH_DATABASE_DSN: postgresql://${GRAPH_RUNTIME_USER:-graph_runtime}:${GRAPH_RUNTIME_PASSWORD}@postgresql:5432/${GRAPH_DB_NAME:-dispute_graph}
      GRAPH_DATABASE_NAME: ${GRAPH_DB_NAME:-dispute_graph}
      GRAPH_DATABASE_USER: ${GRAPH_RUNTIME_USER:-graph_runtime}
      GRAPH_DATABASE_SCHEMA: ${GRAPH_DB_SCHEMA:-graph_runtime}
      GRAPH_JWKS_URL: ${GRAPH_JWKS_URL:-http://java-api-service:8080/.well-known/graph-jwks.json}
      GRAPH_EXPECTED_SPIFFE_ID: ${GRAPH_EXPECTED_SPIFFE_ID:-spiffe://after-sale-flow/java-api-service}
      GRAPH_EXPECTED_ENVIRONMENT_GENERATION: ${GRAPH_DB_ENVIRONMENT_GENERATION}
      GRAPH_EXPECTED_RESTORE_VERIFICATION_HASH: ${GRAPH_DB_RESTORE_VERIFICATION_HASH}
      GRAPH_SHADOW_BINDINGS: ${GRAPH_SHADOW_BINDINGS:-[]}
      GRAPH_SHADOW_THREADS: ${GRAPH_SHADOW_THREADS:-[]}
    ports:
      - "127.0.0.1:${PYTHON_AGENT_PORT:-18000}:8000"
    depends_on:
      litellm-proxy:
        condition: service_healthy
      langfuse:
        condition: service_healthy
      graph-restore-validation:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  ocr-parser-service:
    <<: *common
    build:
      context: ./ocr-parser-service
    environment:
      APP_ENV: ${APP_ENV:-local}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_EVIDENCE_ORIGINAL: ${MINIO_BUCKET_EVIDENCE_ORIGINAL:-evidence-original}
      MINIO_BUCKET_EVIDENCE_DESENSITIZED: ${MINIO_BUCKET_EVIDENCE_DESENSITIZED:-evidence-desensitized}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JAVA_API_SERVICE_URL: ${JAVA_API_SERVICE_URL:-http://java-api-service:8080}
      OCR_SERVICE_SECRET: ${OCR_SERVICE_SECRET}
      OCR_TEMP_DIR: /var/lib/ocr-parser
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_SENSITIVE_LOG_MASKING: ${ENABLE_SENSITIVE_LOG_MASKING:-true}
    ports:
      - "127.0.0.1:${OCR_SERVICE_PORT:-18010}:8010"
    volumes:
      - ocr_parser_data:/var/lib/ocr-parser
      - ocr_paddle_models:/home/app/.paddlex
    depends_on:
      minio-init:
        condition: service_healthy
      elasticsearch-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  java-api-service:
    <<: *common
    image: ${JAVA_RUNTIME_IMAGE:-after-sale-flow/java-runtime:local}
    build: *java-build
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: ${JAVA_API_SPRING_PROFILES_ACTIVE:-local,api}
      APP_TEMPORAL_WORKER_ENABLED: "false"
      APP_ORCHESTRATION_COMMAND_OUTBOX_ENABLED: ${APP_ORCHESTRATION_COMMAND_OUTBOX_ENABLED:-false}
      APP_ORCHESTRATION_MIG001_DRIVER_ENABLED: ${APP_ORCHESTRATION_MIG001_DRIVER_ENABLED:-false}
      APP_ORCHESTRATION_INTAKE_SYNTHETIC_EXCHANGE_ENABLED: ${APP_ORCHESTRATION_INTAKE_SYNTHETIC_EXCHANGE_ENABLED:-false}
      APP_GRAPH_JWKS_ENABLED: ${APP_GRAPH_JWKS_ENABLED:-false}
      APP_GRAPH_JWKS_KEY_DIRECTORY: /run/secrets/graph-public-keys
    volumes:
      - ${GRAPH_PUBLIC_KEYS_HOST_DIRECTORY:-./.runtime/graph-public-keys}:/run/secrets/graph-public-keys:ro
      - ${INTAKE_SYNTHETIC_ADMISSION_PUBLIC_KEYS_HOST_DIRECTORY:-./.runtime/intake-synthetic/admission-public-keys}:/run/secrets/intake-synthetic/admission-public-keys:ro
    ports:
      - "127.0.0.1:${JAVA_API_PORT:-8080}:8080"
    depends_on: *java-api-depends-on
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health | grep UP"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  java-control-worker:
    <<: *common
    image: ${JAVA_RUNTIME_IMAGE:-after-sale-flow/java-runtime:local}
    build: *java-build
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: local,control-worker
      APP_TEMPORAL_WORKER_ENABLED: "true"
      TEMPORAL_WORKER_ROLE: CONTROL
      TEMPORAL_WORKER_DEPLOYMENT_NAME: ${TEMPORAL_CONTROL_DEPLOYMENT_NAME:-after-sale-control}
      TEMPORAL_WORKER_BUILD_ID: ${TEMPORAL_CONTROL_BUILD_ID:-local-dev}
      TEMPORAL_WORKER_VERSIONING_MODE: ${TEMPORAL_WORKER_VERSIONING_MODE:-NONE}
      APP_ORCHESTRATION_COMMAND_OUTBOX_ENABLED: "false"
      APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_ENABLED: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_ENABLED:-false}
      APP_ORCHESTRATION_DOMAIN_EVENT_RECOVERY_ENABLED: ${APP_ORCHESTRATION_DOMAIN_EVENT_RECOVERY_ENABLED:-false}
      APP_ORCHESTRATION_PROJECTION_RECONCILIATION_ENABLED: ${APP_ORCHESTRATION_PROJECTION_RECONCILIATION_ENABLED:-false}
    volumes:
      - ${INTAKE_SYNTHETIC_ADMISSION_PUBLIC_KEYS_HOST_DIRECTORY:-./.runtime/intake-synthetic/admission-public-keys}:/run/secrets/intake-synthetic/admission-public-keys:ro
    depends_on: *java-core-depends-on
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  java-agent-worker:
    <<: *common
    image: ${JAVA_RUNTIME_IMAGE:-after-sale-flow/java-runtime:local}
    build: *java-build
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: local,agent-worker
      APP_TEMPORAL_WORKER_ENABLED: "true"
      TEMPORAL_WORKER_ROLE: AGENT
      TEMPORAL_WORKER_DEPLOYMENT_NAME: ${TEMPORAL_AGENT_DEPLOYMENT_NAME:-after-sale-agent}
      TEMPORAL_WORKER_BUILD_ID: ${TEMPORAL_AGENT_BUILD_ID:-local-dev}
      TEMPORAL_WORKER_VERSIONING_MODE: ${TEMPORAL_WORKER_VERSIONING_MODE:-NONE}
      APP_ORCHESTRATION_COMMAND_OUTBOX_ENABLED: "false"
      APP_AGENT_RUN_V2_GRAPH_CLIENT_MODE: ${APP_AGENT_RUN_V2_GRAPH_CLIENT_MODE:-DISABLED}
      APP_AGENT_RUN_V2_GRAPH_CLIENT_BASE_URI: ${APP_AGENT_RUN_V2_GRAPH_CLIENT_BASE_URI:-https://python-agent-service:8000}
      APP_AGENT_RUN_V2_GRAPH_CLIENT_ALLOW_PLAINTEXT_TRANSPORT: ${APP_AGENT_RUN_V2_GRAPH_CLIENT_ALLOW_PLAINTEXT_TRANSPORT:-false}
      APP_AGENT_RUN_V2_GRAPH_SIGNING_KEY_DIRECTORY: /run/secrets/graph-signing-keys
      APP_AGENT_RUN_V2_GRAPH_SIGNING_ACTIVE_KEY_ID: ${APP_AGENT_RUN_V2_GRAPH_SIGNING_ACTIVE_KEY_ID:-}
      APP_AGENT_RUN_V2_GRAPH_TLS_KEY_STORE_PATH: /run/secrets/graph-mtls/client.p12
      APP_AGENT_RUN_V2_GRAPH_TLS_KEY_STORE_PASSWORD: ${APP_AGENT_RUN_V2_GRAPH_TLS_KEY_STORE_PASSWORD:-}
      APP_AGENT_RUN_V2_GRAPH_TLS_TRUST_STORE_PATH: /run/secrets/graph-mtls/trust.p12
      APP_AGENT_RUN_V2_GRAPH_TLS_TRUST_STORE_PASSWORD: ${APP_AGENT_RUN_V2_GRAPH_TLS_TRUST_STORE_PASSWORD:-}
      APP_AGENT_RUN_V2_GRAPH_BINDING_GRAPH_KEY: ${APP_AGENT_RUN_V2_GRAPH_BINDING_GRAPH_KEY:-}
      APP_AGENT_RUN_V2_GRAPH_BINDING_GRAPH_VERSION: ${APP_AGENT_RUN_V2_GRAPH_BINDING_GRAPH_VERSION:-}
      APP_AGENT_RUN_V2_GRAPH_BINDING_CHECKPOINT_SCHEMA_VERSION: ${APP_AGENT_RUN_V2_GRAPH_BINDING_CHECKPOINT_SCHEMA_VERSION:-}
      APP_AGENT_RUN_V2_GRAPH_BINDING_AGENT_PROFILE_ID: ${APP_AGENT_RUN_V2_GRAPH_BINDING_AGENT_PROFILE_ID:-}
      APP_AGENT_RUN_V2_GRAPH_BINDING_PROMPT_PROFILE_ID: ${APP_AGENT_RUN_V2_GRAPH_BINDING_PROMPT_PROFILE_ID:-}
      APP_AGENT_RUN_V2_GRAPH_BINDING_MODEL_PROFILE_ID: ${APP_AGENT_RUN_V2_GRAPH_BINDING_MODEL_PROFILE_ID:-}
      APP_AGENT_RUN_V2_GRAPH_BINDING_OUTPUT_SCHEMA_VERSION: ${APP_AGENT_RUN_V2_GRAPH_BINDING_OUTPUT_SCHEMA_VERSION:-}
      APP_AGENT_RUN_V2_GRAPH_BINDING_POLICY_VERSION: ${APP_AGENT_RUN_V2_GRAPH_BINDING_POLICY_VERSION:-}
      APP_AGENT_RUN_V2_GRAPH_BINDING_GUARDRAIL_VERSION: ${APP_AGENT_RUN_V2_GRAPH_BINDING_GUARDRAIL_VERSION:-}
      APP_AGENT_RUN_V2_GRAPH_BINDING_AUDIENCE: ${APP_AGENT_RUN_V2_GRAPH_BINDING_AUDIENCE:-SYSTEM}
      APP_AGENT_RUN_V2_GRAPH_BINDING_REGISTRY_HASH: ${APP_AGENT_RUN_V2_GRAPH_BINDING_REGISTRY_HASH:-}
      APP_AGENT_RUN_V2_GRAPH_BINDING_TOOL_POLICY_VERSION: ${APP_AGENT_RUN_V2_GRAPH_BINDING_TOOL_POLICY_VERSION:-}
      APP_ORCHESTRATION_INTAKE_SYNTHETIC_RUNTIME_MATERIAL_ENABLED: ${APP_ORCHESTRATION_INTAKE_SYNTHETIC_RUNTIME_MATERIAL_ENABLED:-false}
      APP_ORCHESTRATION_INTAKE_SYNTHETIC_RUNTIME_MATERIAL_BUCKET: ${MINIO_BUCKET_INTAKE_SYNTHETIC_PRIVATE:-intake-synthetic-private}
      APP_ORCHESTRATION_INTAKE_SYNTHETIC_RUNTIME_MATERIAL_PREFIX: ${APP_ORCHESTRATION_INTAKE_SYNTHETIC_RUNTIME_MATERIAL_PREFIX:-signed-synthetic/intake/runtime-material}
      APP_ORCHESTRATION_INTAKE_SYNTHETIC_RUNTIME_MATERIAL_MANIFEST_REFERENCE_INDEX_PATH: /run/secrets/intake-synthetic/runtime-material-index.json
    volumes:
      - ${GRAPH_SIGNING_KEYS_HOST_DIRECTORY:-./.runtime/graph-signing-keys}:/run/secrets/graph-signing-keys:ro
      - ${GRAPH_MTLS_HOST_DIRECTORY:-./.runtime/graph-mtls}:/run/secrets/graph-mtls:ro
      - ${INTAKE_SYNTHETIC_ADMISSION_PUBLIC_KEYS_HOST_DIRECTORY:-./.runtime/intake-synthetic/admission-public-keys}:/run/secrets/intake-synthetic/admission-public-keys:ro
      - ${INTAKE_SYNTHETIC_RUNTIME_MATERIAL_INDEX_HOST_PATH:-./.runtime/intake-synthetic/runtime-material-index.json}:/run/secrets/intake-synthetic/runtime-material-index.json:ro
    depends_on: *java-agent-depends-on
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    <<: *common
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s

  nginx:
    <<: *common
    image: ${NGINX_IMAGE:-public.ecr.aws/docker/library/nginx:1.27-alpine}
    ports:
      - "127.0.0.1:${NGINX_PORT:-18080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      java-api-service:
        condition: service_healthy
      python-agent-service:
        condition: service_healthy
      ocr-parser-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep ok"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  dispute-network:
    driver: bridge

volumes:
  postgresql_data:
  redis_data:
  elasticsearch_data:
  minio_data:
  ocr_parser_data:
  ocr_paddle_models:
