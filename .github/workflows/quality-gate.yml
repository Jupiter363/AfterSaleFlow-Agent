name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Secret scan / secret scanning
        run: |
          secret_pattern='sk-(''phase[0-9]+|live|prod)|BEGIN PRIVATE'" KEY"'|(DEEPSEEK|DASHSCOPE)_API_KEY=''sk-'
          matches="$(
            git grep -nE "$secret_pattern" -- . || true
          )"
          unexpected="$(
            printf '%s\n' "$matches" \
              | sed -E 's/^([^:]+):[0-9]+:/\1:/' \
              | grep -vFx 'tests/static/test_phase8_entry_evidence.py:        b"-----BEGIN PRIVATE'" KEY"'-----",' \
              | grep -vFx 'java-api-service/src/test/java/com/example/dispute/workflow/agentrun/MountedPemGraphEnvelopeKeySetTest.java:                "-----BEGIN PRIVATE'" KEY"'-----\nnot-base64\n-----END PRIVATE KEY-----\n",' \
              || true
          )"
          if [[ -n "$unexpected" ]]; then
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Install static test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r infra-tests/phase8/runtime/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps --require-hashes \
            -r .github/requirements-static.lock

      - name: Audit static quality-gate manifests
        run: python -m pytest -q tests/static/test_quality_gate_static_manifests.py

      - name: Static current repository contracts
        shell: bash
        run: |
          manifest=.github/static-current-contracts.txt
          historical_manifest=.github/static-historical-replay-only.txt
          mapfile -t selectors < <(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$manifest")
          mapfile -t historical_nodes < <(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$historical_manifest")
          (( ${#selectors[@]} > 0 )) || { echo "empty static selector manifest: $manifest" >&2; exit 1; }
          declare -A selected_files=()
          for selector in "${selectors[@]}"; do
            [[ "$selector" =~ ^tests/static/test_[A-Za-z0-9_]+\.py$ ]] || {
              echo "unsafe static selector in $manifest: $selector" >&2
              exit 1
            }
            [[ -f "$selector" ]] || { echo "missing static selector in $manifest: $selector" >&2; exit 1; }
            selected_files["$selector"]=1
          done
          deselect_args=()
          for historical_node in "${historical_nodes[@]}"; do
            [[ "$historical_node" =~ ^tests/static/test_[A-Za-z0-9_]+\.py::test_[A-Za-z0-9_]+(\[[^][]+\])?$ ]] || {
              echo "unsafe historical node in $historical_manifest: $historical_node" >&2
              exit 1
            }
            historical_file="${historical_node%%::*}"
            [[ -f "$historical_file" ]] || {
              echo "missing historical node file in $historical_manifest: $historical_file" >&2
              exit 1
            }
            [[ -n "${selected_files[$historical_file]:-}" ]] || {
              echo "historical node file is not a current selector: $historical_file" >&2
              exit 1
            }
            deselect_args+=("--deselect=$historical_node")
          done
          python -m pytest -q "${deselect_args[@]}" "${selectors[@]}"

      - name: Static frozen evidence verifiers
        shell: bash
        run: |
          manifest=.github/static-frozen-evidence-verifiers.txt
          mapfile -t selectors < <(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$manifest")
          (( ${#selectors[@]} > 0 )) || { echo "empty static selector manifest: $manifest" >&2; exit 1; }
          for selector in "${selectors[@]}"; do
            [[ "$selector" =~ ^tests/static/test_[A-Za-z0-9_]+\.py$ ]] || {
              echo "unsafe static selector in $manifest: $selector" >&2
              exit 1
            }
            [[ -f "$selector" ]] || { echo "missing static selector in $manifest: $selector" >&2; exit 1; }
          done
          python -m pytest -q "${selectors[@]}"

      - name: Java tests
        working-directory: java-api-service
        run: bash ./mvnw -s .mvn/settings.xml -B -ntp test

      - name: Python Agent tests
        working-directory: python-agent-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: OCR Parser tests
        working-directory: ocr-parser-service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Frontend browser layout regression
        working-directory: frontend
        run: pnpm test:browser

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Docker compose config
        run: docker compose config --quiet

  phase-1-postgresql-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Phase 1 PostgreSQL integration tests
        working-directory: java-api-service
        run: >
          bash ./mvnw -s .mvn/settings.xml -B -ntp -Pintegration-test
          -Dit.test=MigrationIntegrationTest,TemporalControlPlaneMigrationIntegrationTest,WorkflowPersistenceRepositoryIntegrationTest,CaseCommandServiceIntegrationTest,CaseCommandOutboxStoreIntegrationTest,CommandOutboxKillWindowIntegrationTest,CaseProcessLedgerActivitiesIntegrationTest,ActivityCompletionLossIntegrationTest,ProcessProjectionFencingIntegrationTest,ProcessProjectionReconcilerIntegrationTest,RoomEpochScanClaimStoreIntegrationTest,RoomEpochAllocatorIntegrationTest,RoomEpochBootstrapStoreIntegrationTest,IntakeRoomServiceIntegrationTest,EvidenceRoomIntegrationTest,DisputeImportServiceIntegrationTest
          verify

      - name: Upload Phase 1 Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-postgresql-failsafe-reports
          path: java-api-service/target/failsafe-reports/
          if-no-files-found: error
          retention-days: 14

  compose-smoke:
    runs-on: ubuntu-latest
    needs:
      - static-and-unit
      - phase-1-postgresql-integration
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate ephemeral Compose credentials
        run: bash ./scripts/generate-secrets.sh
      - name: Pull Compose images with bounded backoff
        env:
          COMPOSE_PARALLEL_LIMIT: "1"
          DASHSCOPE_API_KEY: ci-placeholder-not-a-real-key
          DEFAULT_LLM_API_BASE: http://127.0.0.1:9
        run: |
          set -euo pipefail
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            if docker compose pull --ignore-buildable --policy missing; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Compose image pull failed after ${max_attempts} attempts"
              exit 1
            fi
            delay=$((15 * 2 ** (attempt - 1)))
            echo "::warning::Compose image pull attempt ${attempt} failed; retrying in ${delay}s"
            sleep "$delay"
          done
      - name: Build and start Compose stack
        env:
          DASHSCOPE_API_KEY: ci-placeholder-not-a-real-key
          DEFAULT_LLM_API_BASE: http://127.0.0.1:9
        run: docker compose up -d --build --pull never --wait --wait-timeout 360
      - name: Temporal worker restart recovery
        working-directory: java-api-service
        run: >
          bash ./mvnw -s .mvn/settings.xml -B -ntp -Pintegration-test
          -Dit.test=TemporalWorkerRestartIntegrationTest
          -Dtemporal.restart-test.enabled=true
          -Dtemporal.restart-test.address=127.0.0.1:7233
          verify
      - name: Upload Temporal restart Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-worker-restart-failsafe-reports
          path: java-api-service/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Smoke test
        env:
          DASHSCOPE_API_KEY: ci-placeholder-not-a-real-key
          DEFAULT_LLM_API_BASE: http://127.0.0.1:9
        run: bash ./scripts/smoke-test.sh
      - name: API, E2E, and load smoke tests
        run: python -m pytest tests/api tests/e2e tests/load -q
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
