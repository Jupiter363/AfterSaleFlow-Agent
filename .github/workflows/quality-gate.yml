name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Secret scan / secret scanning
        run: |
          secret_pattern='sk-(''phase[0-9]+|live|prod)|BEGIN PRIVATE'" KEY"'|(DEEPSEEK|DASHSCOPE)_API_KEY=''sk-'
          matches="$(
            git grep -nE "$secret_pattern" -- . || true
          )"
          unexpected="$(
            printf '%s\n' "$matches" \
              | sed -E 's/^([^:]+):[0-9]+:/\1:/' \
              | grep -vFx 'apps/domain-service/src/test/java/com/example/dispute/workflow/agentrun/MountedPemGraphEnvelopeKeySetTest.java:                "-----BEGIN PRIVATE'" KEY"'-----\nnot-base64\n-----END PRIVATE KEY-----\n",' \
              || true
          )"
          if [[ -n "$unexpected" ]]; then
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Install static test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r tests/infrastructure/runtime/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps --require-hashes \
            -r .github/requirements-static.lock

      - name: Static production contracts
        run: python -m pytest -q tests/static

      - name: Java tests
        working-directory: apps/domain-service
        run: bash ./mvnw -s .mvn/settings.xml -B -ntp test

      - name: Python Agent tests
        working-directory: apps/agent-runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: OCR Parser tests
        working-directory: apps/ocr-parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -q

      - name: Frontend tests and build
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Frontend browser layout regression
        working-directory: apps/web
        run: pnpm test:browser

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Docker compose config
        run: docker compose config --quiet

  postgresql-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: PostgreSQL integration tests
        working-directory: apps/domain-service
        run: >
          bash ./mvnw -s .mvn/settings.xml -B -ntp -Pintegration-test
          -Dit.test=MigrationIntegrationTest,TemporalControlPlaneMigrationIntegrationTest,WorkflowPersistenceRepositoryIntegrationTest,CaseCommandServiceIntegrationTest,CaseCommandOutboxStoreIntegrationTest,CommandOutboxKillWindowIntegrationTest,CaseProcessLedgerActivitiesIntegrationTest,ActivityCompletionLossIntegrationTest,ProcessProjectionFencingIntegrationTest,ProcessProjectionReconcilerIntegrationTest,RoomEpochScanClaimStoreIntegrationTest,RoomEpochAllocatorIntegrationTest,RoomEpochBootstrapStoreIntegrationTest,IntakeRoomServiceIntegrationTest,EvidenceRoomIntegrationTest,DisputeImportServiceIntegrationTest
          verify

      - name: Upload PostgreSQL Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-failsafe-reports
          path: apps/domain-service/target/failsafe-reports/
          if-no-files-found: error
          retention-days: 14

  compose-smoke:
    runs-on: ubuntu-latest
    needs:
      - static-and-unit
      - postgresql-integration
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install acceptance test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r tests/infrastructure/runtime/requirements.lock
      - name: Generate ephemeral Compose credentials
        run: bash ./tools/generate/generate-secrets.sh
      - name: Pull Compose images with bounded backoff
        env:
          COMPOSE_PARALLEL_LIMIT: "1"
          DASHSCOPE_API_KEY: ci-placeholder-not-a-real-key
          DEFAULT_LLM_API_BASE: http://127.0.0.1:9
        run: |
          set -euo pipefail
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            if docker compose pull --ignore-buildable --policy missing; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Compose image pull failed after ${max_attempts} attempts"
              exit 1
            fi
            delay=$((15 * 2 ** (attempt - 1)))
            echo "::warning::Compose image pull attempt ${attempt} failed; retrying in ${delay}s"
            sleep "$delay"
          done
      - name: Build and start Compose stack
        env:
          DASHSCOPE_API_KEY: ci-placeholder-not-a-real-key
          DEFAULT_LLM_API_BASE: http://127.0.0.1:9
          SEED_DEMO_DISPUTES: "true"
        run: docker compose up -d --build --pull never --wait --wait-timeout 360
      - name: Temporal worker restart recovery
        working-directory: apps/domain-service
        run: >
          bash ./mvnw -s .mvn/settings.xml -B -ntp -Pintegration-test
          -Dit.test=TemporalWorkerRestartIntegrationTest
          -Dtemporal.restart-test.enabled=true
          -Dtemporal.restart-test.address=127.0.0.1:7233
          verify
      - name: Upload Temporal restart Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-worker-restart-failsafe-reports
          path: apps/domain-service/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Smoke test
        env:
          DASHSCOPE_API_KEY: ci-placeholder-not-a-real-key
          DEFAULT_LLM_API_BASE: http://127.0.0.1:9
        run: bash ./tools/verify/smoke-test.sh
      - name: API, E2E, and load smoke tests
        env:
          ACCEPTANCE_BASE_URL: http://127.0.0.1:18080
        run: python -m pytest tests/integration/api tests/e2e tests/performance -q
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
