      - phase8_observe_runtime
      - phase8_wave_a_static
      - phase8_wave_a_java
      - phase8_wave_b_static_and_models
      - phase8_wave_b_java_unit
      - phase8_wave_b_postgresql_integration
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-status: ${{ steps.upload.outcome }}
      digest-status: ${{ steps.digest.outcome }}
      execution-status: ${{ steps.aggregate.outcome }}
      witness-sha256: ${{ steps.digest.outputs.witness-sha256 }}
    steps:
      - id: preflight
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.phase8_build_runtime.result }}
          BUILD_EXECUTION: ${{ needs.phase8_build_runtime.outputs.execution-status }}
          BUILD_ARTIFACT_STATUS: ${{ needs.phase8_build_runtime.outputs.artifact-status }}
          BUILD_ARTIFACT_ID: ${{ needs.phase8_build_runtime.outputs.artifact-id }}
          BUILD_ARTIFACT_DIGEST: ${{ needs.phase8_build_runtime.outputs.artifact-digest }}
          BUILD_ARCHIVE_SHA256: ${{ needs.phase8_build_runtime.outputs.archive-sha256 }}
          OBSERVE_RESULT: ${{ needs.phase8_observe_runtime.result }}
          OBSERVE_EXECUTION: ${{ needs.phase8_observe_runtime.outputs.execution-status }}
          OBSERVE_ARTIFACT_STATUS: ${{ needs.phase8_observe_runtime.outputs.artifact-status }}
          OBSERVE_ARTIFACT_ID: ${{ needs.phase8_observe_runtime.outputs.artifact-id }}
          OBSERVE_ARTIFACT_DIGEST: ${{ needs.phase8_observe_runtime.outputs.artifact-digest }}
          WAVE_A_STATIC_RESULT: ${{ needs.phase8_wave_a_static.result }}
          WAVE_A_STATIC_EXECUTION: ${{ needs.phase8_wave_a_static.outputs.execution-status }}
          WAVE_A_STATIC_ARTIFACT_STATUS: ${{ needs.phase8_wave_a_static.outputs.artifact-status }}
          WAVE_A_STATIC_ARTIFACT_ID: ${{ needs.phase8_wave_a_static.outputs.artifact-id }}
          WAVE_A_STATIC_ARTIFACT_DIGEST: ${{ needs.phase8_wave_a_static.outputs.artifact-digest }}
          WAVE_A_JAVA_RESULT: ${{ needs.phase8_wave_a_java.result }}
          WAVE_A_JAVA_EXECUTION: ${{ needs.phase8_wave_a_java.outputs.execution-status }}
          WAVE_A_JAVA_ARTIFACT_STATUS: ${{ needs.phase8_wave_a_java.outputs.artifact-status }}
          WAVE_A_JAVA_ARTIFACT_ID: ${{ needs.phase8_wave_a_java.outputs.artifact-id }}
          WAVE_A_JAVA_ARTIFACT_DIGEST: ${{ needs.phase8_wave_a_java.outputs.artifact-digest }}
          WAVE_B_STATIC_RESULT: ${{ needs.phase8_wave_b_static_and_models.result }}
          WAVE_B_STATIC_EXECUTION: ${{ needs.phase8_wave_b_static_and_models.outputs.execution-status }}
          WAVE_B_STATIC_ARTIFACT_STATUS: ${{ needs.phase8_wave_b_static_and_models.outputs.artifact-status }}
          WAVE_B_STATIC_ARTIFACT_ID: ${{ needs.phase8_wave_b_static_and_models.outputs.artifact-id }}
          WAVE_B_STATIC_ARTIFACT_DIGEST: ${{ needs.phase8_wave_b_static_and_models.outputs.artifact-digest }}
          WAVE_B_JAVA_RESULT: ${{ needs.phase8_wave_b_java_unit.result }}
          WAVE_B_JAVA_EXECUTION: ${{ needs.phase8_wave_b_java_unit.outputs.execution-status }}
          WAVE_B_JAVA_ARTIFACT_STATUS: ${{ needs.phase8_wave_b_java_unit.outputs.artifact-status }}
          WAVE_B_JAVA_ARTIFACT_ID: ${{ needs.phase8_wave_b_java_unit.outputs.artifact-id }}
          WAVE_B_JAVA_ARTIFACT_DIGEST: ${{ needs.phase8_wave_b_java_unit.outputs.artifact-digest }}
