              --output-dir "/tmp/phase8-command-output"
          )

      - id: upload
        if: ${{ always() && steps.execute.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase8-raw-002-wave_b_static_and_models-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/phase8-command-output
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  phase8_wave_b_java_unit:
    needs: phase8_wave_b_static_and_models
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CI: "1"
