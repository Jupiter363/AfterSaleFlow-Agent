          )
          test "${#producer_oci_archives[@]}" = "1"
          test "${#producer_docker_archives[@]}" = "1"
          test "${#observer_oci_archives[@]}" = "1"
          test "${#observer_docker_archives[@]}" = "1"
          (
            cd "${GITHUB_WORKSPACE}/trusted-code"
            python -m scripts.phase8.candidate.github_command_runner execute-command \
              --command-id "wave_b_static_and_models" \
              --candidate-sha "$candidate_sha" \
              --trusted-code-sha "10e69724038a5bea9cdd99f8fc2be5485860d7c9" \
              --trusted-workflow-sha "$trusted_workflow_sha" \
              --trusted-workflow-ref "$trusted_workflow_ref" \
              --trusted-workflow-repository "Jupiter363/AfterSaleFlow-Agent" \
              --trusted-workflow-file-path ".github/workflows/phase8-engineering-witness.yml" \
              --image-archive "${producer_oci_archives[0]}" \
              --execution-image-archive "${producer_docker_archives[0]}" \
              --observer-image-archive "${observer_oci_archives[0]}" \
              --observer-execution-image-archive "${observer_docker_archives[0]}" \
              --runtime-build-receipt "$producer/runtime-build-receipt.json" \
              --build-observation-receipt "$observer/build-observation-receipt.json" \
