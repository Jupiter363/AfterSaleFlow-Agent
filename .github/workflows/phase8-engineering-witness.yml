            "$WAVE_A_JAVA_RESULT" "$WAVE_B_STATIC_RESULT" "$WAVE_B_JAVA_RESULT"
            "$POSTGRES_RESULT"
          )
          executions=(
            "$BUILD_EXECUTION" "$OBSERVE_EXECUTION" "$WAVE_A_STATIC_EXECUTION"
            "$WAVE_A_JAVA_EXECUTION" "$WAVE_B_STATIC_EXECUTION" "$WAVE_B_JAVA_EXECUTION"
            "$POSTGRES_EXECUTION"
          )
          artifact_statuses=(
            "$BUILD_ARTIFACT_STATUS" "$OBSERVE_ARTIFACT_STATUS" "$WAVE_A_STATIC_ARTIFACT_STATUS"
            "$WAVE_A_JAVA_ARTIFACT_STATUS" "$WAVE_B_STATIC_ARTIFACT_STATUS"
            "$WAVE_B_JAVA_ARTIFACT_STATUS" "$POSTGRES_ARTIFACT_STATUS"
          )
          artifact_ids=(
            "$BUILD_ARTIFACT_ID" "$OBSERVE_ARTIFACT_ID" "$WAVE_A_STATIC_ARTIFACT_ID"
            "$WAVE_A_JAVA_ARTIFACT_ID" "$WAVE_B_STATIC_ARTIFACT_ID"
            "$WAVE_B_JAVA_ARTIFACT_ID" "$POSTGRES_ARTIFACT_ID"
          )
          artifact_digests=(
            "$BUILD_ARTIFACT_DIGEST" "$OBSERVE_ARTIFACT_DIGEST" "$WAVE_A_STATIC_ARTIFACT_DIGEST"
            "$WAVE_A_JAVA_ARTIFACT_DIGEST" "$WAVE_B_STATIC_ARTIFACT_DIGEST"
            "$WAVE_B_JAVA_ARTIFACT_DIGEST" "$POSTGRES_ARTIFACT_DIGEST"
          )
          for value in "${results[@]}" "${executions[@]}" "${artifact_statuses[@]}"; do
            test "$value" = "success"
          done
          for value in "${artifact_ids[@]}"; do
            [[ "$value" =~ ^[1-9][0-9]*$ ]]
          done
          for value in "${artifact_digests[@]}"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
          done
          [[ "$BUILD_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "${#artifact_ids[@]}" = "7"
          test "$(printf '%s\n' "${artifact_ids[@]}" | sort -u | wc -l)" = "7"

      - id: candidate-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - id: trusted-code-checkout
        shell: bash
        env:
          TRUSTED_CODE_SHA: 10e69724038a5bea9cdd99f8fc2be5485860d7c9
        run: |
          set -euo pipefail
          candidate="${GITHUB_WORKSPACE}/candidate"
          trusted="${GITHUB_WORKSPACE}/trusted-code"
          test ! -e "$trusted"
          test ! -L "$trusted"
          test "$(git -C "$candidate" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$candidate" cat-file -e "${TRUSTED_CODE_SHA}^{commit}"
          git -C "$candidate" merge-base --is-ancestor "$TRUSTED_CODE_SHA" "$GITHUB_SHA"
          git -C "$candidate" worktree add --detach "$trusted" "$TRUSTED_CODE_SHA"
          test -f "$trusted/.git"
          test "$(git -C "$trusted" rev-parse HEAD)" = "$TRUSTED_CODE_SHA"
          candidate_common="$(git -C "$candidate" rev-parse --path-format=absolute --git-common-dir)"
          trusted_common="$(git -C "$trusted" rev-parse --path-format=absolute --git-common-dir)"
          test -d "$candidate_common"
          test ! -L "$candidate_common"
          test "$candidate_common" = "$trusted_common"

