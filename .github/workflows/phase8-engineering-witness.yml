          path: ${{ runner.temp }}/phase8-raw/commands/002-wave_b_static_and_models
          merge-multiple: true
          skip-decompress: false
          digest-mismatch: error

      - id: download-wave-b-java-unit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.phase8_wave_b_java_unit.outputs.artifact-id }}
          path: ${{ runner.temp }}/phase8-raw/commands/003-wave_b_java_unit
          merge-multiple: true
          skip-decompress: false
          digest-mismatch: error

      - id: download-wave-b-postgresql-integration
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.phase8_wave_b_postgresql_integration.outputs.artifact-id }}
          path: ${{ runner.temp }}/phase8-raw/commands/004-wave_b_postgresql_integration
          merge-multiple: true
          skip-decompress: false
          digest-mismatch: error

      - id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="${{ github.sha }}"
          read -r observed_candidate trusted_workflow_sha extra_parent < <(
            git -C "${GITHUB_WORKSPACE}/candidate" rev-list --parents -n 1 "$candidate_sha"
          )
          test "$observed_candidate" = "$candidate_sha"
          test -n "$trusted_workflow_sha"
          test -z "${extra_parent:-}"
          trusted_workflow_ref="Jupiter363/AfterSaleFlow-Agent/.github/workflows/phase8-engineering-witness.yml@${trusted_workflow_sha}"
          (
            cd "${GITHUB_WORKSPACE}/trusted-code"
            python -m scripts.phase8.candidate.github_witness \
              --candidate-dir "${GITHUB_WORKSPACE}/candidate" \
              --candidate-sha "$candidate_sha" \
              --raw-artifacts-dir "${RUNNER_TEMP}/phase8-raw" \
              --output-dir "/tmp/phase8-witness" \
              --attempt-id "github-${{ github.run_id }}-${{ github.run_attempt }}" \
              --trusted-code-sha "10e69724038a5bea9cdd99f8fc2be5485860d7c9" \
              --trusted-workflow-sha "$trusted_workflow_sha" \
              --trusted-workflow-ref "$trusted_workflow_ref" \
              --trusted-workflow-repository "Jupiter363/AfterSaleFlow-Agent" \
              --trusted-workflow-file-path ".github/workflows/phase8-engineering-witness.yml"
          )

      - id: digest
        if: ${{ steps.aggregate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          subject="/tmp/phase8-witness/phase8-engineering-witness.tar"
          test -f "$subject"
          test ! -L "$subject"
          test "$(stat -c '%h' "$subject")" = "1"
          read -r witness_sha256 _ < <(sha256sum "$subject")
          [[ "$witness_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'witness-sha256=%s\n' "$witness_sha256" >> "$GITHUB_OUTPUT"

