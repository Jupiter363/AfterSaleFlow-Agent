        if: ${{ always() && steps.aggregate.outcome == 'success' && steps.digest.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase8-engineering-witness-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/phase8-witness/phase8-engineering-witness.tar
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  attest:
    needs: aggregate
    if: ${{ always() && needs.aggregate.result == 'success' && needs.aggregate.outputs.execution-status == 'success' && needs.aggregate.outputs.digest-status == 'success' && needs.aggregate.outputs.artifact-status == 'success' }}
