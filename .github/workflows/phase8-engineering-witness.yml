    steps:
      - id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.aggregate.outputs.artifact-id }}
          path: ${{ runner.temp }}/phase8-attest
          merge-multiple: true
          skip-decompress: false
          digest-mismatch: error

      - id: verify
        shell: bash
        env:
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.aggregate.outputs.artifact-digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.aggregate.outputs.artifact-id }}
          EXPECTED_WITNESS_SHA256: ${{ needs.aggregate.outputs.witness-sha256 }}
        run: |
          set -euo pipefail
          subject="${RUNNER_TEMP}/phase8-attest/phase8-engineering-witness.tar"
          mapfile -d '' entries < <(
            find "${RUNNER_TEMP}/phase8-attest" -mindepth 1 -maxdepth 1 -print0
          )
          test "${#entries[@]}" = "1"
          test "${entries[0]}" = "$subject"
          test -f "$subject"
          test ! -L "$subject"
          test "$(stat -c '%h' "$subject")" = "1"
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_WITNESS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          read -r actual _ < <(sha256sum "$subject")
          test "$actual" = "$EXPECTED_WITNESS_SHA256"

      - id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: ${{ runner.temp }}/phase8-attest/phase8-engineering-witness.tar

  gate:
    needs:
      - phase8_build_runtime
      - phase8_observe_runtime
      - phase8_wave_a_static
      - phase8_wave_a_java
      - phase8_wave_b_static_and_models
      - phase8_wave_b_java_unit
      - phase8_wave_b_postgresql_integration
      - aggregate
      - attest
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: enforce
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.phase8_build_runtime.result }}
          BUILD_EXECUTION: ${{ needs.phase8_build_runtime.outputs.execution-status }}
          BUILD_ARTIFACT_STATUS: ${{ needs.phase8_build_runtime.outputs.artifact-status }}
          BUILD_ARTIFACT_ID: ${{ needs.phase8_build_runtime.outputs.artifact-id }}
          BUILD_ARTIFACT_DIGEST: ${{ needs.phase8_build_runtime.outputs.artifact-digest }}
          BUILD_ARCHIVE_SHA256: ${{ needs.phase8_build_runtime.outputs.archive-sha256 }}
          OBSERVE_RESULT: ${{ needs.phase8_observe_runtime.result }}
          OBSERVE_EXECUTION: ${{ needs.phase8_observe_runtime.outputs.execution-status }}
          OBSERVE_ARTIFACT_STATUS: ${{ needs.phase8_observe_runtime.outputs.artifact-status }}
          OBSERVE_ARTIFACT_ID: ${{ needs.phase8_observe_runtime.outputs.artifact-id }}
          OBSERVE_ARTIFACT_DIGEST: ${{ needs.phase8_observe_runtime.outputs.artifact-digest }}
          WAVE_A_STATIC_RESULT: ${{ needs.phase8_wave_a_static.result }}
          WAVE_A_STATIC_EXECUTION: ${{ needs.phase8_wave_a_static.outputs.execution-status }}
          WAVE_A_STATIC_ARTIFACT_STATUS: ${{ needs.phase8_wave_a_static.outputs.artifact-status }}
          WAVE_A_STATIC_ARTIFACT_ID: ${{ needs.phase8_wave_a_static.outputs.artifact-id }}
          WAVE_A_STATIC_ARTIFACT_DIGEST: ${{ needs.phase8_wave_a_static.outputs.artifact-digest }}
          WAVE_A_JAVA_RESULT: ${{ needs.phase8_wave_a_java.result }}
          WAVE_A_JAVA_EXECUTION: ${{ needs.phase8_wave_a_java.outputs.execution-status }}
          WAVE_A_JAVA_ARTIFACT_STATUS: ${{ needs.phase8_wave_a_java.outputs.artifact-status }}
          WAVE_A_JAVA_ARTIFACT_ID: ${{ needs.phase8_wave_a_java.outputs.artifact-id }}
          WAVE_A_JAVA_ARTIFACT_DIGEST: ${{ needs.phase8_wave_a_java.outputs.artifact-digest }}
          WAVE_B_STATIC_RESULT: ${{ needs.phase8_wave_b_static_and_models.result }}
          WAVE_B_STATIC_EXECUTION: ${{ needs.phase8_wave_b_static_and_models.outputs.execution-status }}
          WAVE_B_STATIC_ARTIFACT_STATUS: ${{ needs.phase8_wave_b_static_and_models.outputs.artifact-status }}
          WAVE_B_STATIC_ARTIFACT_ID: ${{ needs.phase8_wave_b_static_and_models.outputs.artifact-id }}
          WAVE_B_STATIC_ARTIFACT_DIGEST: ${{ needs.phase8_wave_b_static_and_models.outputs.artifact-digest }}
          WAVE_B_JAVA_RESULT: ${{ needs.phase8_wave_b_java_unit.result }}
          WAVE_B_JAVA_EXECUTION: ${{ needs.phase8_wave_b_java_unit.outputs.execution-status }}
          WAVE_B_JAVA_ARTIFACT_STATUS: ${{ needs.phase8_wave_b_java_unit.outputs.artifact-status }}
          WAVE_B_JAVA_ARTIFACT_ID: ${{ needs.phase8_wave_b_java_unit.outputs.artifact-id }}
          WAVE_B_JAVA_ARTIFACT_DIGEST: ${{ needs.phase8_wave_b_java_unit.outputs.artifact-digest }}
          POSTGRES_RESULT: ${{ needs.phase8_wave_b_postgresql_integration.result }}
          POSTGRES_EXECUTION: ${{ needs.phase8_wave_b_postgresql_integration.outputs.execution-status }}
          POSTGRES_ARTIFACT_STATUS: ${{ needs.phase8_wave_b_postgresql_integration.outputs.artifact-status }}
          POSTGRES_ARTIFACT_ID: ${{ needs.phase8_wave_b_postgresql_integration.outputs.artifact-id }}
          POSTGRES_ARTIFACT_DIGEST: ${{ needs.phase8_wave_b_postgresql_integration.outputs.artifact-digest }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
          AGGREGATE_EXECUTION: ${{ needs.aggregate.outputs.execution-status }}
          AGGREGATE_DIGEST_STATUS: ${{ needs.aggregate.outputs.digest-status }}
          AGGREGATE_ARTIFACT_STATUS: ${{ needs.aggregate.outputs.artifact-status }}
          AGGREGATE_ARTIFACT_ID: ${{ needs.aggregate.outputs.artifact-id }}
          AGGREGATE_ARTIFACT_DIGEST: ${{ needs.aggregate.outputs.artifact-digest }}
          WITNESS_SHA256: ${{ needs.aggregate.outputs.witness-sha256 }}
          ATTEST_RESULT: ${{ needs.attest.result }}
          ATTEST_DOWNLOAD_STATUS: ${{ needs.attest.outputs.download-status }}
          ATTEST_VERIFICATION_STATUS: ${{ needs.attest.outputs.verification-status }}
          ATTESTATION_STATUS: ${{ needs.attest.outputs.attestation-status }}
        run: |
          set -euo pipefail
          statuses=(
            "$BUILD_RESULT" "$BUILD_EXECUTION" "$BUILD_ARTIFACT_STATUS"
            "$OBSERVE_RESULT" "$OBSERVE_EXECUTION" "$OBSERVE_ARTIFACT_STATUS"
            "$WAVE_A_STATIC_RESULT" "$WAVE_A_STATIC_EXECUTION" "$WAVE_A_STATIC_ARTIFACT_STATUS"
            "$WAVE_A_JAVA_RESULT" "$WAVE_A_JAVA_EXECUTION" "$WAVE_A_JAVA_ARTIFACT_STATUS"
            "$WAVE_B_STATIC_RESULT" "$WAVE_B_STATIC_EXECUTION" "$WAVE_B_STATIC_ARTIFACT_STATUS"
            "$WAVE_B_JAVA_RESULT" "$WAVE_B_JAVA_EXECUTION" "$WAVE_B_JAVA_ARTIFACT_STATUS"
            "$POSTGRES_RESULT" "$POSTGRES_EXECUTION" "$POSTGRES_ARTIFACT_STATUS"
            "$AGGREGATE_RESULT" "$AGGREGATE_EXECUTION" "$AGGREGATE_DIGEST_STATUS"
            "$AGGREGATE_ARTIFACT_STATUS" "$ATTEST_RESULT" "$ATTEST_DOWNLOAD_STATUS"
            "$ATTEST_VERIFICATION_STATUS" "$ATTESTATION_STATUS"
          )
          artifact_ids=(
            "$BUILD_ARTIFACT_ID" "$OBSERVE_ARTIFACT_ID" "$WAVE_A_STATIC_ARTIFACT_ID"
            "$WAVE_A_JAVA_ARTIFACT_ID" "$WAVE_B_STATIC_ARTIFACT_ID"
            "$WAVE_B_JAVA_ARTIFACT_ID" "$POSTGRES_ARTIFACT_ID" "$AGGREGATE_ARTIFACT_ID"
          )
          digests=(
            "$BUILD_ARTIFACT_DIGEST" "$OBSERVE_ARTIFACT_DIGEST" "$WAVE_A_STATIC_ARTIFACT_DIGEST"
            "$WAVE_A_JAVA_ARTIFACT_DIGEST" "$WAVE_B_STATIC_ARTIFACT_DIGEST"
            "$WAVE_B_JAVA_ARTIFACT_DIGEST" "$POSTGRES_ARTIFACT_DIGEST"
            "$AGGREGATE_ARTIFACT_DIGEST" "$BUILD_ARCHIVE_SHA256" "$WITNESS_SHA256"
          )
          for value in "${statuses[@]}"; do
            test "$value" = "success"
          done
          for value in "${artifact_ids[@]}"; do
            [[ "$value" =~ ^[1-9][0-9]*$ ]]
          done
          for value in "${digests[@]}"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
          done
          test "${#artifact_ids[@]}" = "8"
          test "$(printf '%s\n' "${artifact_ids[@]}" | sort -u | wc -l)" = "8"
