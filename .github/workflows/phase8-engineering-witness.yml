      - id: download-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.phase8_build_runtime.outputs.artifact-id }}
          path: ${{ runner.temp }}/phase8-static-input/shared-runtime/producer
          merge-multiple: true
          skip-decompress: false
          digest-mismatch: error

      - id: download-observe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.phase8_observe_runtime.outputs.artifact-id }}
          path: ${{ runner.temp }}/phase8-static-input/shared-runtime/observer
          merge-multiple: true
          skip-decompress: false
          digest-mismatch: error

      - id: execute
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="${{ github.sha }}"
          read -r observed_candidate trusted_workflow_sha extra_parent < <(
