name: Phase 8 engineering witness

"on":
  workflow_call: {}

permissions: {}

jobs:
  phase8_build_runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
    outputs:
      archive-sha256: ${{ steps.inspect.outputs.archive-sha256 }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-status: ${{ steps.upload.outcome }}
      execution-status: ${{ steps.execute.outcome }}
    steps:
      - id: candidate-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - id: trusted-code-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 10e69724038a5bea9cdd99f8fc2be5485860d7c9
          path: trusted-code
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - id: execute
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="${{ github.sha }}"
          read -r observed_candidate trusted_workflow_sha extra_parent < <(
            git -C "${GITHUB_WORKSPACE}/candidate" rev-list --parents -n 1 "$candidate_sha"
          )
          test "$observed_candidate" = "$candidate_sha"
          test -n "$trusted_workflow_sha"
          test -z "${extra_parent:-}"
          trusted_workflow_ref="Jupiter363/AfterSaleFlow-Agent/.github/workflows/phase8-engineering-witness.yml@${trusted_workflow_sha}"
          (
            cd "${GITHUB_WORKSPACE}/trusted-code"
            python -m scripts.phase8.candidate.github_command_runner build-runtime \
              --candidate-sha "$candidate_sha" \
              --trusted-code-sha "10e69724038a5bea9cdd99f8fc2be5485860d7c9" \
              --trusted-workflow-sha "$trusted_workflow_sha" \
              --trusted-workflow-ref "$trusted_workflow_ref" \
              --trusted-workflow-repository "Jupiter363/AfterSaleFlow-Agent" \
              --trusted-workflow-file-path ".github/workflows/phase8-engineering-witness.yml" \
              --output-dir "/tmp/phase8-build"
          )

      - id: inspect
        if: ${{ steps.execute.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' archives < <(
            find "/tmp/phase8-build/oci" -mindepth 1 -maxdepth 1 \
              -type f -name 'sha256-*.tar' -print0
          )
          test "${#archives[@]}" = "1"
          archive="${archives[0]}"
          test -f "$archive"
          test ! -L "$archive"
          test "$(stat -c '%h' "$archive")" = "1"
          filename="$(basename "$archive")"
          [[ "$filename" =~ ^sha256-([0-9a-f]{64})\.tar$ ]]
          archive_sha256="${BASH_REMATCH[1]}"
          read -r actual _ < <(sha256sum "$archive")
          test "$actual" = "$archive_sha256"
          printf 'archive-sha256=%s\n' "$archive_sha256" >> "$GITHUB_OUTPUT"

      - id: upload
        if: ${{ always() && steps.execute.outcome == 'success' && steps.inspect.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase8-runtime-image-${{ github.run_id }}-${{ github.run_attempt }}-sha256-${{ steps.inspect.outputs.archive-sha256 }}
          path: /tmp/phase8-build
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  phase8_observe_runtime:
    needs: phase8_build_runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CI: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-status: ${{ steps.upload.outcome }}
      execution-status: ${{ steps.execute.outcome }}
    steps:
      - id: candidate-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - id: trusted-code-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 10e69724038a5bea9cdd99f8fc2be5485860d7c9
          path: trusted-code
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - id: download-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.phase8_build_runtime.outputs.artifact-id }}
          path: ${{ runner.temp }}/phase8-observe-input
          merge-multiple: true
          skip-decompress: false
          digest-mismatch: error

      - id: execute
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="${{ github.sha }}"
          read -r observed_candidate trusted_workflow_sha extra_parent < <(
            git -C "${GITHUB_WORKSPACE}/candidate" rev-list --parents -n 1 "$candidate_sha"
          )
          test "$observed_candidate" = "$candidate_sha"
          test -n "$trusted_workflow_sha"
          test -z "${extra_parent:-}"
          trusted_workflow_ref="Jupiter363/AfterSaleFlow-Agent/.github/workflows/phase8-engineering-witness.yml@${trusted_workflow_sha}"
          mapfile -d '' producer_oci_archives < <(
            find "${RUNNER_TEMP}/phase8-observe-input/oci" -mindepth 1 -maxdepth 1 \
              -type f -name 'sha256-*.tar' -print0
          )
          mapfile -d '' producer_docker_archives < <(
            find "${RUNNER_TEMP}/phase8-observe-input/docker" -mindepth 1 -maxdepth 1 \
              -type f -name 'sha256-*.tar' -print0
          )
          test "${#producer_oci_archives[@]}" = "1"
          test "${#producer_docker_archives[@]}" = "1"
          (
            cd "${GITHUB_WORKSPACE}/trusted-code"
            python -m scripts.phase8.candidate.github_command_runner observe-runtime \
              --candidate-sha "$candidate_sha" \
              --trusted-code-sha "10e69724038a5bea9cdd99f8fc2be5485860d7c9" \
              --trusted-workflow-sha "$trusted_workflow_sha" \
              --trusted-workflow-ref "$trusted_workflow_ref" \
              --trusted-workflow-repository "Jupiter363/AfterSaleFlow-Agent" \
              --trusted-workflow-file-path ".github/workflows/phase8-engineering-witness.yml" \
              --image-archive "${producer_oci_archives[0]}" \
              --execution-image-archive "${producer_docker_archives[0]}" \
              --producer-receipt "${RUNNER_TEMP}/phase8-observe-input/runtime-build-receipt.json" \
              --output-dir "/tmp/phase8-observe"
          )

      - id: upload
        if: ${{ always() && steps.execute.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase8-runtime-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/phase8-observe
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  phase8_wave_a_static:
    needs:
      - phase8_build_runtime
      - phase8_observe_runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-status: ${{ steps.upload.outcome }}
      execution-status: ${{ steps.execute.outcome }}
    steps:
      - id: candidate-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - id: trusted-code-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 10e69724038a5bea9cdd99f8fc2be5485860d7c9
          path: trusted-code
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - id: download-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.phase8_build_runtime.outputs.artifact-id }}
          path: ${{ runner.temp }}/phase8-static-input/shared-runtime/producer
          merge-multiple: true
          skip-decompress: false
          digest-mismatch: error

      - id: download-observe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.phase8_observe_runtime.outputs.artifact-id }}
          path: ${{ runner.temp }}/phase8-static-input/shared-runtime/observer
          merge-multiple: true
          skip-decompress: false
          digest-mismatch: error

      - id: execute
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="${{ github.sha }}"
          read -r observed_candidate trusted_workflow_sha extra_parent < <(
            git -C "${GITHUB_WORKSPACE}/candidate" rev-list --parents -n 1 "$candidate_sha"
          )
          test "$observed_candidate" = "$candidate_sha"
          test -n "$trusted_workflow_sha"
          test -z "${extra_parent:-}"
          trusted_workflow_ref="Jupiter363/AfterSaleFlow-Agent/.github/workflows/phase8-engineering-witness.yml@${trusted_workflow_sha}"
          producer="${RUNNER_TEMP}/phase8-static-input/shared-runtime/producer"
          observer="${RUNNER_TEMP}/phase8-static-input/shared-runtime/observer"
          mapfile -d '' producer_oci_archives < <(
            find "$producer/oci" -mindepth 1 -maxdepth 1 -type f -name 'sha256-*.tar' -print0
          )
          mapfile -d '' producer_docker_archives < <(
            find "$producer/docker" -mindepth 1 -maxdepth 1 -type f -name 'sha256-*.tar' -print0
          )
          mapfile -d '' observer_oci_archives < <(
            find "$observer/oci" -mindepth 1 -maxdepth 1 -type f -name 'sha256-*.tar' -print0
          )
          mapfile -d '' observer_docker_archives < <(
            find "$observer/docker" -mindepth 1 -maxdepth 1 -type f -name 'sha256-*.tar' -print0
          )
          test "${#producer_oci_archives[@]}" = "1"
          test "${#producer_docker_archives[@]}" = "1"
          test "${#observer_oci_archives[@]}" = "1"
          test "${#observer_docker_archives[@]}" = "1"
          (
            cd "${GITHUB_WORKSPACE}/trusted-code"
            python -m scripts.phase8.candidate.github_command_runner execute-command \
              --command-id "wave_a_static" \
              --candidate-sha "$candidate_sha" \
              --trusted-code-sha "10e69724038a5bea9cdd99f8fc2be5485860d7c9" \
              --trusted-workflow-sha "$trusted_workflow_sha" \
              --trusted-workflow-ref "$trusted_workflow_ref" \
              --trusted-workflow-repository "Jupiter363/AfterSaleFlow-Agent" \
              --trusted-workflow-file-path ".github/workflows/phase8-engineering-witness.yml" \
              --image-archive "${producer_oci_archives[0]}" \
              --execution-image-archive "${producer_docker_archives[0]}" \
              --observer-image-archive "${observer_oci_archives[0]}" \
              --observer-execution-image-archive "${observer_docker_archives[0]}" \
              --runtime-build-receipt "$producer/runtime-build-receipt.json" \
              --build-observation-receipt "$observer/build-observation-receipt.json" \
              --wheelhouse-root "$producer/wheelhouse" \
              --output-dir "/tmp/phase8-command-output"
          )

      - id: upload
        if: ${{ always() && steps.execute.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase8-raw-000-wave_a_static-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/phase8-command-output
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  phase8_wave_a_java:
    needs: phase8_wave_a_static
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CI: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONNOUSERSITE: "1"
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-status: ${{ steps.upload.outcome }}
      execution-status: ${{ steps.execute.outcome }}
    steps:
      - id: candidate-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0

      - id: trusted-code-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 10e69724038a5bea9cdd99f8fc2be5485860d7c9
          path: trusted-code
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - id: enable-rootless-userns
        shell: bash
        run: |
          set -euo pipefail
          userns="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          unconfined="$(sysctl -n kernel.apparmor_restrict_unprivileged_unconfined)"
          [[ "$userns" =~ ^[01]$ ]]
          [[ "$unconfined" =~ ^[01]$ ]]
          printf 'userns=%s\n' "$userns" >> "$GITHUB_OUTPUT"
          printf 'unconfined=%s\n' "$unconfined" >> "$GITHUB_OUTPUT"
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_unconfined)" = "0"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "0"

      - id: execute
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="${{ github.sha }}"
          read -r observed_candidate trusted_workflow_sha extra_parent < <(
            git -C "${GITHUB_WORKSPACE}/candidate" rev-list --parents -n 1 "$candidate_sha"
          )
          test "$observed_candidate" = "$candidate_sha"
          test -n "$trusted_workflow_sha"
          test -z "${extra_parent:-}"
          trusted_workflow_ref="Jupiter363/AfterSaleFlow-Agent/.github/workflows/phase8-engineering-witness.yml@${trusted_workflow_sha}"
          (
            cd "${GITHUB_WORKSPACE}/trusted-code"
            python -m scripts.phase8.candidate.github_command_runner execute-command \
              --command-id "wave_a_java" \
              --candidate-sha "$candidate_sha" \
              --trusted-code-sha "10e69724038a5bea9cdd99f8fc2be5485860d7c9" \
              --trusted-workflow-sha "$trusted_workflow_sha" \
              --trusted-workflow-ref "$trusted_workflow_ref" \
              --trusted-workflow-repository "Jupiter363/AfterSaleFlow-Agent" \
              --trusted-workflow-file-path ".github/workflows/phase8-engineering-witness.yml" \
              --output-dir "/tmp/phase8-command-output"
          )

      - id: restore-rootless-userns
        if: ${{ always() && steps.enable-rootless-userns.outputs.userns != '' && steps.enable-rootless-userns.outputs.unconfined != '' }}
        shell: bash
        env:
          ORIGINAL_USERNS: ${{ steps.enable-rootless-userns.outputs.userns }}
          ORIGINAL_UNCONFINED: ${{ steps.enable-rootless-userns.outputs.unconfined }}
        run: |
          set -euo pipefail
          [[ "$ORIGINAL_USERNS" =~ ^[01]$ ]]
          [[ "$ORIGINAL_UNCONFINED" =~ ^[01]$ ]]
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns="$ORIGINAL_USERNS"
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_unconfined="$ORIGINAL_UNCONFINED"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "$ORIGINAL_USERNS"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_unconfined)" = "$ORIGINAL_UNCONFINED"

      - id: upload
        if: ${{ always() && steps.execute.outcome == 'success' && steps.restore-rootless-userns.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase8-raw-001-wave_a_java-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/phase8-command-output
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  phase8_wave_b_static_and_models:
