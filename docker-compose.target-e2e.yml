name: ${TARGET_E2E_PROJECT_NAME:?provision a host-locked target E2E run first}

x-runtime-labels: &runtime-labels
  target-e2e.after-sale-flow.dev/run-id: ${TARGET_E2E_RUN_ID:?}
  target-e2e.after-sale-flow.dev/build-id: ${TARGET_E2E_BUILD_ID:?}
  target-e2e.after-sale-flow.dev/source-commit: ${TARGET_E2E_SOURCE_COMMIT:?}
  target-e2e.after-sale-flow.dev/project: ${TARGET_E2E_PROJECT_NAME:?}
  target-e2e.after-sale-flow.dev/lock-nonce: ${TARGET_E2E_LOCK_NONCE:?}
  target-e2e.after-sale-flow.dev/image-lock-hash: ${TARGET_E2E_IMAGE_LOCK_HASH:?}
  target-e2e.after-sale-flow.dev/target-lane-runnable: "false"
  target-e2e.after-sale-flow.dev/application-contracts: blocking

x-resource-labels: &resource-labels
  target-e2e.after-sale-flow.dev/run-id: ${TARGET_E2E_RUN_ID:?}
  target-e2e.after-sale-flow.dev/project: ${TARGET_E2E_PROJECT_NAME:?}
  target-e2e.after-sale-flow.dev/lock-nonce: ${TARGET_E2E_LOCK_NONCE:?}
  target-e2e.after-sale-flow.dev/image-lock-hash: ${TARGET_E2E_IMAGE_LOCK_HASH:?}

x-java-environment: &java-environment
  APP_ENV: target-e2e
  POSTGRES_HOST: domain-db
  POSTGRES_PORT: 5432
  POSTGRES_USER: domain_app
  POSTGRES_PASSWORD: ${TARGET_E2E_DOMAIN_APP_PASSWORD:?}
  JAVA_DB_NAME: target_domain
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${TARGET_E2E_REDIS_PASSWORD:?}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${TARGET_E2E_MINIO_ROOT_USER:?}
  MINIO_ROOT_PASSWORD: ${TARGET_E2E_MINIO_ROOT_PASSWORD:?}
  ELASTICSEARCH_URL: http://elasticsearch:9200
  TEMPORAL_ADDRESS: temporal-server:7233
  TEMPORAL_NAMESPACE: ${TARGET_E2E_TEMPORAL_NAMESPACE:?}
  TEMPORAL_TASK_QUEUE: target-e2e-case-dispute
  TEMPORAL_SEARCH_ATTRIBUTES_ENABLED: "false"
  TEMPORAL_PAYLOAD_CODEC_MODE: DISABLED
  OTEL_TRACING_ENABLED: "false"
  SEED_DEMO_DISPUTES: "false"
  PYTHON_AGENT_SERVICE_URL: https://graph-mtls-proxy:8443
  OCR_SERVICE_URL: http://ocr-parser-service:8010
  JAVA_SERVICE_SECRET: ${TARGET_E2E_JAVA_SERVICE_SECRET:?}
  PYTHON_AGENT_SERVICE_SECRET: ${TARGET_E2E_PYTHON_SERVICE_SECRET:?}
  OCR_SERVICE_SECRET: ${TARGET_E2E_OCR_SERVICE_SECRET:?}
  APP_TENANT_SURROGATE: target-e2e
  TARGET_E2E_ACTIVATION_ID: ${TARGET_E2E_ACTIVATION_ID:?}
  TARGET_E2E_ENVIRONMENT_ID: ${TARGET_E2E_ENVIRONMENT_ID:?}
  TARGET_E2E_ENVIRONMENT_GENERATION: ${TARGET_E2E_ENVIRONMENT_GENERATION:?}
  TARGET_E2E_RUN_NONCE: ${TARGET_E2E_RUN_NONCE:?}
  APP_ORCHESTRATION_COMMAND_V1_ENABLED: "true"
  APP_ORCHESTRATION_NEW_EPOCH_MODE: TEMPORAL
  APP_ORCHESTRATION_NON_LEGACY_EPOCH_ALLOCATION_ENABLED: "true"
  APP_ORCHESTRATION_TEMPORAL_WRITER_ENABLED: "true"
  APP_ORCHESTRATION_INTAKE_EPOCH_SELECTION_MODE: TEMPORAL
  APP_ORCHESTRATION_INTAKE_SHADOW_COHORT_BASIS_POINTS: "0"
  APP_ORCHESTRATION_INTAKE_COHORT_POLICY_VERSION: target-e2e.temporal.v1
  APP_ORCHESTRATION_COMMAND_OUTBOX_ENABLED: "true"
  APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_ENABLED: "true"
  APP_ORCHESTRATION_DOMAIN_EVENT_RECOVERY_ENABLED: "true"
  APP_ORCHESTRATION_PROJECTION_RECONCILIATION_ENABLED: "true"
  APP_AGENT_RUN_V2_ENABLED: "true"
  APP_AGENT_RUN_V2_PROTOCOL_DEFAULT: V2
  APP_AGENT_RUN_V2_SCHEDULER_MODE: DETECTOR
  ENABLE_AUDIT_LOG: "true"
  ENABLE_SENSITIVE_LOG_MASKING: "true"

x-java-core-depends: &java-core-depends
  domain-db:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully
  elasticsearch-init:
    condition: service_completed_successfully
  temporal-namespace-init:
    condition: service_completed_successfully

services:
  domain-db:
    image: ${TARGET_E2E_POSTGRES_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: target_domain_admin
      POSTGRES_PASSWORD: ${TARGET_E2E_DOMAIN_ADMIN_PASSWORD:?}
      DOMAIN_DB_NAME: target_domain
      DOMAIN_DB_USER: domain_app
      DOMAIN_DB_PASSWORD: ${TARGET_E2E_DOMAIN_APP_PASSWORD:?}
    volumes:
      - target_domain_data:/var/lib/postgresql/data
      - type: bind
        source: ./deploy/target-e2e/postgresql/init-domain.sh
        target: /docker-entrypoint-initdb.d/10-init-domain.sh
        read_only: true
    networks: [domain-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  graph-db:
    image: ${TARGET_E2E_POSTGRES_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: target_graph_admin
      POSTGRES_PASSWORD: ${TARGET_E2E_GRAPH_ADMIN_PASSWORD:?}
      GRAPH_DB_NAME: target_graph
      GRAPH_DB_SCHEMA: graph_runtime
      GRAPH_OWNER_USER: graph_owner
      GRAPH_MIGRATOR_USER: graph_migrator
      GRAPH_MIGRATOR_PASSWORD: ${TARGET_E2E_GRAPH_MIGRATOR_PASSWORD:?}
      GRAPH_RUNTIME_USER: graph_runtime
      GRAPH_RUNTIME_PASSWORD: ${TARGET_E2E_GRAPH_RUNTIME_PASSWORD:?}
      GRAPH_RETENTION_USER: graph_retention
      GRAPH_RETENTION_PASSWORD: ${TARGET_E2E_GRAPH_RETENTION_PASSWORD:?}
    volumes:
      - target_graph_data:/var/lib/postgresql/data
      - type: bind
        source: ./deploy/target-e2e/postgresql/init-graph.sh
        target: /docker-entrypoint-initdb.d/10-init-graph.sh
        read_only: true
    networks: [graph-data, python-egress]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  temporal-db:
    image: ${TARGET_E2E_POSTGRES_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: target_temporal_admin
      POSTGRES_PASSWORD: ${TARGET_E2E_TEMPORAL_ADMIN_PASSWORD:?}
      TEMPORAL_DB_USER: temporal_app
      TEMPORAL_DB_PASSWORD: ${TARGET_E2E_TEMPORAL_DB_PASSWORD:?}
    volumes:
      - target_temporal_data:/var/lib/postgresql/data
      - type: bind
        source: ./deploy/target-e2e/postgresql/init-temporal.sh
        target: /docker-entrypoint-initdb.d/10-init-temporal.sh
        read_only: true
    networks: [temporal-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: ${TARGET_E2E_REDIS_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${TARGET_E2E_REDIS_PASSWORD:?}
    volumes:
      - target_redis_data:/data
    networks: [cache-data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: ${TARGET_E2E_MINIO_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${TARGET_E2E_MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${TARGET_E2E_MINIO_ROOT_PASSWORD:?}
    volumes:
      - target_minio_data:/data
    networks: [object-data, python-egress]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio-init:
    image: ${TARGET_E2E_MINIO_MC_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${TARGET_E2E_MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${TARGET_E2E_MINIO_ROOT_PASSWORD:?}
    volumes:
      - type: bind
        source: ./deploy/target-e2e/minio/init.sh
        target: /opt/target-e2e/init.sh
        read_only: true
    entrypoint: ["/bin/sh", "/opt/target-e2e/init.sh"]
    networks: [object-data]

  elasticsearch:
    image: ${TARGET_E2E_ELASTICSEARCH_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - target_elasticsearch_data:/usr/share/elasticsearch/data
    networks: [search-data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  elasticsearch-init:
    image: ${TARGET_E2E_ELASTICSEARCH_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - type: bind
        source: ./deploy/target-e2e/elasticsearch/init.sh
        target: /opt/target-e2e/init.sh
        read_only: true
    entrypoint: ["/bin/sh", "/opt/target-e2e/init.sh"]
    networks: [search-data]

  temporal-server:
    image: ${TARGET_E2E_TEMPORAL_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-db
      POSTGRES_USER: temporal_app
      POSTGRES_PWD: ${TARGET_E2E_TEMPORAL_DB_PASSWORD:?}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      SKIP_DB_CREATE: "true"
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./deploy/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks: [temporal-data, temporal-runtime]
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal-server:7233 cluster health | grep SERVING"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  temporal-namespace-init:
    image: ${TARGET_E2E_TEMPORAL_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: "no"
    depends_on:
      temporal-server:
        condition: service_healthy
    environment:
      TARGET_E2E_TEMPORAL_NAMESPACE: ${TARGET_E2E_TEMPORAL_NAMESPACE:?}
    volumes:
      - type: bind
        source: ./deploy/target-e2e/temporal/create-namespace.sh
        target: /opt/target-e2e/create-namespace.sh
        read_only: true
    entrypoint: ["/bin/sh", "/opt/target-e2e/create-namespace.sh"]
    networks: [temporal-runtime]

  graph-migrate:
    image: ${TARGET_E2E_PYTHON_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: "no"
    command: ["python", "-m", "app.graph_runtime.migrations"]
    depends_on:
      graph-db:
        condition: service_healthy
    environment:
      GRAPH_MIGRATION_DATABASE_DSN: postgresql://graph_migrator:${TARGET_E2E_GRAPH_MIGRATOR_PASSWORD:?}@graph-db:5432/target_graph
      GRAPH_MIGRATION_EXPECTED_USER: graph_migrator
      GRAPH_OWNER_USER: graph_owner
      GRAPH_RUNTIME_USER: graph_runtime
      GRAPH_RETENTION_USER: graph_retention
      GRAPH_DB_SCHEMA: graph_runtime
      GRAPH_DB_ENVIRONMENT_GENERATION: ${TARGET_E2E_GRAPH_ENVIRONMENT_GENERATION:?}
    networks: [graph-data]

  graph-restore-validation:
    image: ${TARGET_E2E_PYTHON_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: "no"
    command: ["python", "-m", "app.graph_runtime.restore_validation"]
    depends_on:
      graph-migrate:
        condition: service_completed_successfully
    environment:
      GRAPH_MIGRATION_DATABASE_DSN: postgresql://graph_migrator:${TARGET_E2E_GRAPH_MIGRATOR_PASSWORD:?}@graph-db:5432/target_graph
      GRAPH_MIGRATION_EXPECTED_USER: graph_migrator
      GRAPH_OWNER_USER: graph_owner
      GRAPH_DB_SCHEMA: graph_runtime
      GRAPH_DB_ENVIRONMENT_GENERATION: ${TARGET_E2E_GRAPH_ENVIRONMENT_GENERATION:?}
      GRAPH_DB_RESTORE_VERIFICATION_HASH: ${TARGET_E2E_GRAPH_RESTORE_HASH:?}
    networks: [graph-data]

  jwks-server:
    image: ${TARGET_E2E_NGINX_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    volumes:
      - ./deploy/target-e2e/nginx/jwks.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${TARGET_E2E_PUBLIC_DIR:?}/jwks/graph-jwks.json
        target: /srv/jwks/graph-jwks.json
        read_only: true
    networks: [python-egress]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/.well-known/graph-jwks.json | grep '\"ES256\"'"]
      interval: 5s
      timeout: 5s
      retries: 20

  python-agent-service:
    image: ${TARGET_E2E_PYTHON_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    command:
      - sh
      - -c
      - umask 000; rm -f /run/target-e2e/python/agent.sock; exec uvicorn target_e2e_mtls_adapter:create_app --factory --uds /run/target-e2e/python/agent.sock --no-server-header
    environment:
      APP_ENV: target-e2e
      LITELLM_BASE_URL: http://model-contract-blocker:4000
      LITELLM_MODEL: target-e2e.contract-blocked
      LITELLM_MASTER_KEY: ${TARGET_E2E_LOCAL_MODEL_KEY:?}
      LANGFUSE_ENABLED: "false"
      LANGFUSE_HOST: http://observability-contract-blocker:3000
      LANGFUSE_PUBLIC_KEY: target-e2e-disabled
      LANGFUSE_SECRET_KEY: ${TARGET_E2E_LOCAL_OBSERVABILITY_KEY:?}
      JAVA_API_SERVICE_URL: http://java-api-service:8080
      JAVA_SERVICE_SECRET: ${TARGET_E2E_JAVA_SERVICE_SECRET:?}
      PYTHON_AGENT_SERVICE_SECRET: ${TARGET_E2E_PYTHON_SERVICE_SECRET:?}
      ENABLE_SENSITIVE_LOG_MASKING: "true"
      GRAPH_GATEWAY_MODE: TARGET_E2E_CANDIDATE
      GRAPH_TARGET_E2E_ISOLATED: "true"
      GRAPH_DATABASE_DSN: postgresql://graph_runtime:${TARGET_E2E_GRAPH_RUNTIME_PASSWORD:?}@graph-db:5432/target_graph
      GRAPH_DATABASE_NAME: target_graph
      GRAPH_DATABASE_USER: graph_runtime
      GRAPH_DATABASE_SCHEMA: graph_runtime
      GRAPH_JWKS_URL: http://jwks-server:8080/.well-known/graph-jwks.json
      GRAPH_EXPECTED_SPIFFE_ID: spiffe://after-sale-flow/java-api-service
      GRAPH_EXPECTED_ENVIRONMENT_GENERATION: ${TARGET_E2E_GRAPH_ENVIRONMENT_GENERATION:?}
      GRAPH_EXPECTED_RESTORE_VERIFICATION_HASH: ${TARGET_E2E_GRAPH_RESTORE_HASH:?}
      GRAPH_TARGET_E2E_RUNTIME_CONTEXT: ${GRAPH_TARGET_E2E_RUNTIME_CONTEXT:?}
      GRAPH_TARGET_E2E_BINDINGS: ${GRAPH_TARGET_E2E_BINDINGS:?}
      TARGET_E2E_MTLS_CA_CERTIFICATE_PATH: /run/target-e2e/public/ca.crt
      TARGET_E2E_MTLS_CA_CERT_SHA256: ${TARGET_E2E_MTLS_CA_CERT_SHA256:?}
      TARGET_E2E_MTLS_CLIENT_CERT_SHA256: ${TARGET_E2E_MTLS_CLIENT_CERT_SHA256:?}
    volumes:
      - ./contracts/agent-platform/v1:/contracts/agent-platform/v1:ro
      - ./deploy/target-e2e/python/mtls_adapter.py:/app/target_e2e_mtls_adapter.py:ro
      - type: bind
        source: ${TARGET_E2E_SOCKET_DIR:?}
        target: /run/target-e2e/python
      - type: bind
        source: ${TARGET_E2E_PUBLIC_DIR:?}/mtls/ca.crt
        target: /run/target-e2e/public/ca.crt
        read_only: true
    depends_on:
      graph-restore-validation:
        condition: service_completed_successfully
      jwks-server:
        condition: service_healthy
    networks: [python-egress]
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/target-e2e/python/agent.sock && kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  graph-mtls-proxy:
    image: ${TARGET_E2E_NGINX_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    depends_on:
      python-agent-service:
        condition: service_healthy
    volumes:
      - ./deploy/target-e2e/nginx/mtls.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${TARGET_E2E_SECRETS_DIR:?}/mtls/server.crt
        target: /run/target-e2e/mtls/server.crt
        read_only: true
      - type: bind
        source: ${TARGET_E2E_SECRETS_DIR:?}/mtls/server.key
        target: /run/target-e2e/mtls/server.key
        read_only: true
      - type: bind
        source: ${TARGET_E2E_SECRETS_DIR:?}/mtls/ca.crt
        target: /run/target-e2e/mtls/ca.crt
        read_only: true
      - type: bind
        source: ${TARGET_E2E_SOCKET_DIR:?}
        target: /run/target-e2e/python
    networks: [graph-mtls-client]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/backend-healthz | grep ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  ocr-parser-service:
    image: ${TARGET_E2E_OCR_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      APP_ENV: target-e2e
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${TARGET_E2E_MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${TARGET_E2E_MINIO_ROOT_PASSWORD:?}
      MINIO_BUCKET_EVIDENCE_ORIGINAL: target-e2e-evidence-original
      MINIO_BUCKET_EVIDENCE_DESENSITIZED: target-e2e-evidence-desensitized
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JAVA_API_SERVICE_URL: http://java-api-service:8080
      OCR_SERVICE_SECRET: ${TARGET_E2E_OCR_SERVICE_SECRET:?}
      OCR_TEMP_DIR: /var/lib/ocr-parser
      ENABLE_SENSITIVE_LOG_MASKING: "true"
    volumes:
      - target_ocr_data:/var/lib/ocr-parser
      - target_ocr_models:/home/app/.paddlex
    depends_on:
      minio-init:
        condition: service_completed_successfully
      elasticsearch-init:
        condition: service_completed_successfully
    networks: [object-data, search-data, ocr-plane]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  java-api-service:
    image: ${TARGET_E2E_JAVA_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: api
      APP_TEMPORAL_WORKER_ENABLED: "false"
      APP_GRAPH_JWKS_ENABLED: "false"
    depends_on:
      <<: *java-core-depends
      ocr-parser-service:
        condition: service_healthy
    networks:
      - domain-data
      - cache-data
      - object-data
      - search-data
      - temporal-runtime
      - ocr-plane
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  java-control-worker:
    image: ${TARGET_E2E_JAVA_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: control-worker
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      APP_TEMPORAL_WORKER_ENABLED: "true"
      TEMPORAL_WORKER_ROLE: CONTROL
      TEMPORAL_WORKER_DEPLOYMENT_NAME: target-e2e-control
      TEMPORAL_WORKER_BUILD_ID: ${TARGET_E2E_BUILD_ID:?}
      TEMPORAL_WORKER_VERSIONING_MODE: BUILD_ID
      APP_ORCHESTRATION_COMMAND_OUTBOX_ENABLED: "false"
      TARGET_E2E_ACTIVATION_JWS_PATH: /run/target-e2e/java-activation/activation.jws
      TARGET_E2E_ACTIVATION_MANIFEST_PATH: /run/target-e2e/java-activation/activation-manifest.json
    volumes:
      - type: bind
        source: ${TARGET_E2E_ACTIVATION_DIR:?}
        target: /run/target-e2e/java-activation
        read_only: true
    depends_on: *java-core-depends
    networks: [domain-data, cache-data, object-data, search-data, temporal-runtime]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  java-agent-worker:
    image: ${TARGET_E2E_JAVA_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: agent-worker
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      APP_TEMPORAL_WORKER_ENABLED: "true"
      TEMPORAL_WORKER_ROLE: AGENT
      TEMPORAL_WORKER_DEPLOYMENT_NAME: target-e2e-agent
      TEMPORAL_WORKER_BUILD_ID: ${TARGET_E2E_BUILD_ID:?}
      TEMPORAL_WORKER_VERSIONING_MODE: BUILD_ID
      APP_ORCHESTRATION_COMMAND_OUTBOX_ENABLED: "false"
      APP_AGENT_RUN_V2_GRAPH_CLIENT_MODE: SHADOW
      APP_AGENT_RUN_V2_GRAPH_CLIENT_BASE_URI: https://graph-mtls-proxy:8443
      APP_AGENT_RUN_V2_GRAPH_CLIENT_ALLOW_PLAINTEXT_TRANSPORT: "false"
      APP_AGENT_RUN_V2_GRAPH_SIGNING_KEY_DIRECTORY: /run/target-e2e/graph-signing-keys
      APP_AGENT_RUN_V2_GRAPH_SIGNING_ACTIVE_KEY_ID: ${TARGET_E2E_GRAPH_SIGNING_KEY_ID:?}
      APP_AGENT_RUN_V2_GRAPH_TLS_KEY_STORE_PATH: /run/target-e2e/mtls/client.p12
      APP_AGENT_RUN_V2_GRAPH_TLS_KEY_STORE_PASSWORD: ${TARGET_E2E_MTLS_KEYSTORE_PASSWORD:?}
      APP_AGENT_RUN_V2_GRAPH_TLS_TRUST_STORE_PATH: /run/target-e2e/mtls/trust.p12
      APP_AGENT_RUN_V2_GRAPH_TLS_TRUST_STORE_PASSWORD: ${TARGET_E2E_MTLS_TRUSTSTORE_PASSWORD:?}
      APP_AGENT_RUN_V2_GRAPH_BINDING_GRAPH_KEY: intake.v2
      APP_AGENT_RUN_V2_GRAPH_BINDING_GRAPH_VERSION: 2.0.0
      APP_AGENT_RUN_V2_GRAPH_BINDING_CHECKPOINT_SCHEMA_VERSION: intake-checkpoint.v2
      APP_AGENT_RUN_V2_GRAPH_BINDING_AGENT_PROFILE_ID: intake-agent.target-e2e.v1
      APP_AGENT_RUN_V2_GRAPH_BINDING_PROMPT_PROFILE_ID: intake-prompt.target-e2e.v1
      APP_AGENT_RUN_V2_GRAPH_BINDING_MODEL_PROFILE_ID: target-e2e.contract-blocked
      APP_AGENT_RUN_V2_GRAPH_BINDING_OUTPUT_SCHEMA_VERSION: intake-turn-proposal.v2
      APP_AGENT_RUN_V2_GRAPH_BINDING_POLICY_VERSION: intake-policy.target-e2e.v1
      APP_AGENT_RUN_V2_GRAPH_BINDING_GUARDRAIL_VERSION: intake-guardrail.target-e2e.v1
      APP_AGENT_RUN_V2_GRAPH_BINDING_AUDIENCE: SYSTEM
      APP_AGENT_RUN_V2_GRAPH_BINDING_REGISTRY_HASH: ${TARGET_E2E_GRAPH_REGISTRY_HASH:?}
      APP_AGENT_RUN_V2_GRAPH_BINDING_TOOL_POLICY_VERSION: no-tools.v1
    volumes:
      - type: bind
        source: ${TARGET_E2E_SECRETS_DIR:?}/graph-signing-keys
        target: /run/target-e2e/graph-signing-keys
        read_only: true
      - type: bind
        source: ${TARGET_E2E_SECRETS_DIR:?}/mtls
        target: /run/target-e2e/mtls
        read_only: true
    depends_on:
      <<: *java-core-depends
      graph-mtls-proxy:
        condition: service_healthy
    networks:
      - domain-data
      - cache-data
      - object-data
      - search-data
      - temporal-runtime
      - graph-mtls-client
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    image: ${TARGET_E2E_FRONTEND_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/healthz | grep ok"]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway:
    image: ${TARGET_E2E_NGINX_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TARGET_E2E_GATEWAY_PORT:-25180}:8080"
    volumes:
      - ./deploy/target-e2e/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      java-api-service:
        condition: service_healthy
    networks: [edge, app-internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mtls-proof:
    profiles: [evidence]
    image: ${TARGET_E2E_CURL_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: "no"
    command:
      - --fail
      - --silent
      - --show-error
      - --cacert
      - /run/target-e2e/mtls/ca.crt
      - --cert
      - /run/target-e2e/mtls/client.crt
      - --key
      - /run/target-e2e/mtls/client.key
      - https://graph-mtls-proxy:8443/ready/graph
    volumes:
      - type: bind
        source: ${TARGET_E2E_SECRETS_DIR:?}/mtls
        target: /run/target-e2e/mtls
        read_only: true
    depends_on:
      graph-mtls-proxy:
        condition: service_healthy
    networks: [graph-mtls-client]

