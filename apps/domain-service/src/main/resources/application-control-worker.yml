spring:
  application:
    name: java-control-worker
  main:
    lazy-initialization: true
    web-application-type: none

app:
  orchestration:
    control-recovery-scheduling:
      enabled: true
  temporal:
    worker:
      enabled: true
      role: CONTROL
      # Retained prior builds drain scheduled/retrying v1 bridge Activities.
      versioning-mode: BUILD_ID
      deployment-name: after-sale-control

dispute:
  scheduling:
    enabled: false
