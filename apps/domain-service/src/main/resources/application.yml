# 文件作用：Java API 服务代码文件，承载售后争议后端业务、持久化或集成逻辑。
# 说明：本注释用于帮助读者先了解配置用途，再修改具体配置项。

spring:
  application:
    name: java-api-service
  task:
    scheduling:
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: java-api-scheduling-
  profiles:
    active: ${APP_ENV:local}
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

management:
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}
    propagation:
      type: w3c
    sampling:
      probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
      timeout: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:10s}
      export:
        enabled: ${OTEL_TRACING_ENABLED:false}
    logging:
      export:
        enabled: false
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  graph-jwks:
    enabled: ${APP_GRAPH_JWKS_ENABLED:false}
    key-directory: ${APP_GRAPH_JWKS_KEY_DIRECTORY:}
  agent-run-v2:
    enabled: ${APP_AGENT_RUN_V2_ENABLED:false}
    protocol-default: ${APP_AGENT_RUN_V2_PROTOCOL_DEFAULT:V1}
    scheduler-mode: ${APP_AGENT_RUN_V2_SCHEDULER_MODE:EXECUTOR}
    start-to-close-timeout: ${APP_AGENT_RUN_V2_START_TO_CLOSE_TIMEOUT:PT10M}
    heartbeat-timeout: ${APP_AGENT_RUN_V2_HEARTBEAT_TIMEOUT:PT15S}
    progress-heartbeat-interval: ${APP_AGENT_RUN_V2_PROGRESS_HEARTBEAT_INTERVAL:PT5S}
    graph-client:
      mode: ${APP_AGENT_RUN_V2_GRAPH_CLIENT_MODE:DISABLED}
      base-uri: ${APP_AGENT_RUN_V2_GRAPH_CLIENT_BASE_URI:}
      activation-id: ${APP_AGENT_RUN_V2_GRAPH_CLIENT_ACTIVATION_ID:}
      request-timeout: ${APP_AGENT_RUN_V2_GRAPH_CLIENT_REQUEST_TIMEOUT:PT10M}
      allow-plaintext-transport: ${APP_AGENT_RUN_V2_GRAPH_CLIENT_ALLOW_PLAINTEXT_TRANSPORT:false}
      signing:
        key-directory: ${APP_AGENT_RUN_V2_GRAPH_SIGNING_KEY_DIRECTORY:}
        active-key-id: ${APP_AGENT_RUN_V2_GRAPH_SIGNING_ACTIVE_KEY_ID:}
      tls:
        key-store-path: ${APP_AGENT_RUN_V2_GRAPH_TLS_KEY_STORE_PATH:}
        trust-store-path: ${APP_AGENT_RUN_V2_GRAPH_TLS_TRUST_STORE_PATH:}
        connect-timeout: ${APP_AGENT_RUN_V2_GRAPH_TLS_CONNECT_TIMEOUT:PT2S}
      registry:
        bindings:
          - graph-key: ${APP_AGENT_RUN_V2_GRAPH_BINDING_GRAPH_KEY:}
            graph-version: ${APP_AGENT_RUN_V2_GRAPH_BINDING_GRAPH_VERSION:}
            checkpoint-schema-version: ${APP_AGENT_RUN_V2_GRAPH_BINDING_CHECKPOINT_SCHEMA_VERSION:}
            agent-profile-id: ${APP_AGENT_RUN_V2_GRAPH_BINDING_AGENT_PROFILE_ID:}
            prompt-profile-id: ${APP_AGENT_RUN_V2_GRAPH_BINDING_PROMPT_PROFILE_ID:}
            model-profile-id: ${APP_AGENT_RUN_V2_GRAPH_BINDING_MODEL_PROFILE_ID:}
            output-schema-version: ${APP_AGENT_RUN_V2_GRAPH_BINDING_OUTPUT_SCHEMA_VERSION:}
            policy-version: ${APP_AGENT_RUN_V2_GRAPH_BINDING_POLICY_VERSION:}
            guardrail-version: ${APP_AGENT_RUN_V2_GRAPH_BINDING_GUARDRAIL_VERSION:}
            audience: ${APP_AGENT_RUN_V2_GRAPH_BINDING_AUDIENCE:SYSTEM}
            registry-binding-hash: ${APP_AGENT_RUN_V2_GRAPH_BINDING_REGISTRY_HASH:}
            tool-policy-version: ${APP_AGENT_RUN_V2_GRAPH_BINDING_TOOL_POLICY_VERSION:}
            visible-fields-by-node: {}
  security:
    tenant-authority:
      surrogate: ${APP_TENANT_SURROGATE:legacy-default}
  orchestration:
    command-v1-enabled: ${APP_ORCHESTRATION_COMMAND_V1_ENABLED:false}
    new-epoch-mode: ${APP_ORCHESTRATION_NEW_EPOCH_MODE:LEGACY}
    non-legacy-epoch-allocation-enabled: ${APP_ORCHESTRATION_NON_LEGACY_EPOCH_ALLOCATION_ENABLED:false}
    temporal-writer-enabled: ${APP_ORCHESTRATION_TEMPORAL_WRITER_ENABLED:false}
    intake-epoch-selection:
      mode: ${APP_ORCHESTRATION_INTAKE_EPOCH_SELECTION_MODE:LEGACY}
      shadow-cohort-basis-points: ${APP_ORCHESTRATION_INTAKE_SHADOW_COHORT_BASIS_POINTS:0}
      cohort-policy-version: ${APP_ORCHESTRATION_INTAKE_COHORT_POLICY_VERSION:}
      signed-synthetic-shadow-enabled: ${APP_ORCHESTRATION_INTAKE_SIGNED_SYNTHETIC_SHADOW_ENABLED:false}
    intake-synthetic-admission-trust:
      enabled: ${APP_ORCHESTRATION_INTAKE_SYNTHETIC_ADMISSION_TRUST_ENABLED:false}
    intake-synthetic-exchange:
      enabled: ${APP_ORCHESTRATION_INTAKE_SYNTHETIC_EXCHANGE_ENABLED:false}
    intake-synthetic-runtime-material:
      enabled: ${APP_ORCHESTRATION_INTAKE_SYNTHETIC_RUNTIME_MATERIAL_ENABLED:false}
    command-outbox:
      enabled: ${APP_ORCHESTRATION_COMMAND_OUTBOX_ENABLED:false}
      batch-size: ${APP_ORCHESTRATION_COMMAND_OUTBOX_BATCH_SIZE:32}
      lease-duration: ${APP_ORCHESTRATION_COMMAND_OUTBOX_LEASE_DURATION:PT1M}
      base-backoff: ${APP_ORCHESTRATION_COMMAND_OUTBOX_BASE_BACKOFF:PT1S}
      max-backoff: ${APP_ORCHESTRATION_COMMAND_OUTBOX_MAX_BACKOFF:PT5M}
      poll-interval: ${APP_ORCHESTRATION_COMMAND_OUTBOX_POLL_INTERVAL:PT5S}
    room-epoch-bootstrap:
      enabled: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_ENABLED:false}
      batch-size: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_BATCH_SIZE:32}
      concurrency: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_CONCURRENCY:32}
      lease-duration: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_LEASE_DURATION:PT2M}
      completion-timeout: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_COMPLETION_TIMEOUT:PT90S}
      base-backoff: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_BASE_BACKOFF:PT1S}
      max-backoff: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_MAX_BACKOFF:PT5M}
      poll-interval: ${APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_POLL_INTERVAL:PT5S}
    domain-event-recovery:
      enabled: ${APP_ORCHESTRATION_DOMAIN_EVENT_RECOVERY_ENABLED:false}
      workflow-batch-size: ${APP_ORCHESTRATION_DOMAIN_EVENT_RECOVERY_WORKFLOW_BATCH_SIZE:32}
      event-batch-size: ${APP_ORCHESTRATION_DOMAIN_EVENT_RECOVERY_EVENT_BATCH_SIZE:64}
      claim-duration: ${APP_ORCHESTRATION_DOMAIN_EVENT_RECOVERY_CLAIM_DURATION:PT5M}
      poll-interval: ${APP_ORCHESTRATION_DOMAIN_EVENT_RECOVERY_POLL_INTERVAL:PT5S}
    projection-reconciliation:
      enabled: ${APP_ORCHESTRATION_PROJECTION_RECONCILIATION_ENABLED:false}
      batch-size: ${APP_ORCHESTRATION_PROJECTION_RECONCILIATION_BATCH_SIZE:32}
      claim-duration: ${APP_ORCHESTRATION_PROJECTION_RECONCILIATION_CLAIM_DURATION:PT5M}
      poll-interval: ${APP_ORCHESTRATION_PROJECTION_RECONCILIATION_POLL_INTERVAL:PT30S}

dispute:
  evidence-window: ${EVIDENCE_WINDOW:PT2H}
  hearing-window: ${HEARING_WINDOW:PT3H}
  hearing-party-stage-window: ${HEARING_PARTY_STAGE_WINDOW:PT20M}
  sse-heartbeat: ${SSE_HEARTBEAT:PT15S}
  seed-demo-disputes: ${SEED_DEMO_DISPUTES:false}
