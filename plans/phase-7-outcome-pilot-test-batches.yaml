schema_version: phase-test-batches.v1
phase: 7
name: outcome-engineering-noop-shadow
document_status: P7_0_NOT_RUN_IMPLEMENTATION_BLOCKED

documents:
  execution_plan: plans/phase-7-outcome-pilot-execution.md
  owner_briefs: plans/phase-7-owner-briefs.yaml
  source_plan: plans/temporal-langgraph-room-refactor.md
  engineering_exception: docs/architecture/adr/0016-phase-7-outcome-engineering-exception.md
  contract_pack: docs/runbooks/temporal-first/phase-7-p7.0-contract-pack.md
  baseline_inventory: docs/runbooks/temporal-first/phase-7-p7.0-baseline-inventory.md
  entry_checkpoint: docs/runbooks/temporal-first/phase-7-p7.0-entry-checkpoint.md
  acceptance_checklist: docs/acceptance/temporal-first-agent-platform-verification-checklist.md
  room_behavior_baseline: docs/acceptance/current-room-function-baseline.md
  acceptance_manifest: tests/acceptance/temporal-first-check-manifest.yaml
  baseline_manifest: tests/baseline/current-room-baseline.yaml
  compatibility_matrix: contracts/agent-platform/outcome/v1/compatibility-matrix.yaml
  synthetic_noop_receipt_schema: contracts/agent-platform/outcome/v1/outcome-synthetic-noop-receipt.schema.json
  static_contract_gate: tests/static/test_phase7_outcome_contracts.py
  static_plan_gate: tests/static/test_phase7_outcome_pilot_plan.py
  static_entry_checkpoint_gate: tests/static/test_phase7_entry_checkpoint.py
  static_entry_evidence_gate: tests/static/test_phase7_entry_evidence.py
  entry_runner: scripts/run_phase7_entry_checkpoint.py
  entry_evidence_generator: scripts/generate_phase7_entry_evidence.py

gate:
  contract_gate: P7.0
  contract_gate_status: NOT_RUN
  implementation_authorized: false
  implementation_owners_state: BLOCKED
  accepted_phase_6_candidate_C6: ea046eae2792cd5afb9929bca40da8fb8c77a9bd
  accepted_phase_6_evidence_E6: e674263e9026e3fec46ec295767d432807f5ab44
  accepted_phase_6_checkpoint_A6: d18a1f130a925429e8c2dfd11352cea4ca8673a0
  accepted_upstream_state:
    phase_6_engineering_checkpoint: PASS
    next_phase_permission: PHASE_7_ENGINEERING_ONLY
    phase_7_engineering_exception: ADR_0016_ACCEPTED_FOR_ENGINEERING_ONLY
    MIG-006: PENDING_PROMOTION
    MIG-007: PENDING_PROMOTION
  required_entry: EXACT_C6_E6_A6_PLUS_PHASE7_ENGINEERING_EXCEPTION_AND_P7_0_EXACT_SHA_EVIDENCE
  entry_decision: NOT_RUN
  entry_effect_after_green_evidence: P7_0_ENGINEERING_ENTRY_PASS
  product_implementation: BLOCKED
  V045: FORBIDDEN_BEFORE_SEPARATE_ENTRY_EVIDENCE
  two_commit_gate:
    commit_1: P7_0_CONTRACT_CANDIDATE
    exact_sha_batch: BATCH_0_ALL_FOUR_SOURCES
    commit_2: P7_0_ENTRY_EVIDENCE_DIRECT_CHILD
    implementation_after: COMMIT_2_RECORDS_P7_0_PASS_FOR_EXACT_COMMIT_1_SHA
    mixed_product_implementation_in_commit_1: false
    reuse_reports_from_another_sha_or_attempt: false
  runtime_modes_allowed_now: [LEGACY, DISABLED]
  runtime_mode_allowed_after_p7_0: JAVA_SIGNED_SYNTHETIC_NOOP_SHADOW
  runtime_modes_forbidden: [REAL_CASE_SHADOW, TEMPORAL]
  traffic_constraints:
    legacy_java_remains_formal: true
    formal_outcome_workflow_activation_allowed: false
    temporal_outcome_allocation_allowed: false
    formal_outcome_graph_sink_allowed: false
    real_tool_effect_allowed: false
    real_or_party_data_shadow_allowed: false
    production_traffic_change_allowed: false
    canary_allowed: false
    promotion_allowed: false
    synthetic_fixture_may_resolve_domain_case: false
  invariants:
    - Java and Domain PostgreSQL remain the sole formal ReviewPacket decision action receipt closure and evaluation ledger.
    - Temporal source is an unregistered deterministic engineering kernel only.
    - The private outcome.review.v1 graph is advisory read-only and has an empty tool policy.
    - Only Java-signed synthetic fixtures and deterministic no-op tool adapters may enter the new path.
    - A decision receipt precedes execution and terminal operation receipts precede closure.
    - Evaluation reads the exact CLOSED snapshot and cannot mutate process state.
    - Existing Draft Review and Outcome HTTP and UI compatibility remains authoritative.
    - MIG-006 and MIG-007 cannot pass from synthetic engineering evidence.
  gate_change_policy:
    - Any candidate content change requires a new exact-SHA Batch 0.
    - A6 does not implicitly pass P7.0.
    - No owner A through E may write product code before the separate evidence commit.
    - Missing exception contract fixture schema runner report or evidence hash fails closed.
  contract_candidate_allowed_paths:
    - plans/phase-7-outcome-pilot-execution.md
    - plans/phase-7-outcome-pilot-test-batches.yaml
    - plans/phase-7-owner-briefs.yaml
    - docs/architecture/adr/0016-phase-7-outcome-engineering-exception.md
    - docs/runbooks/temporal-first/phase-7-*
    - contracts/agent-platform/outcome/**
    - tests/static/test_phase7_*.py
    - scripts/run_phase7_entry_checkpoint.py
    - scripts/generate_phase7_entry_evidence.py
  contract_candidate_forbidden_content:
    - V045_MIGRATION
    - PRODUCT_OR_RUNTIME_IMPLEMENTATION
    - WORKER_REGISTRATION_OR_SELECTOR_ADMISSION
    - REAL_OR_PRODUCTION_CONFIGURATION

mode_contract:
  LEGACY:
    formal_process_owner: EXISTING_JAVA_REVIEW_OUTCOME_PATH
    formal_writer: JAVA_DOMAIN_POSTGRESQL
    new_runtime: NONE
  DISABLED:
    formal_process_owner: EXISTING_JAVA_REVIEW_OUTCOME_PATH
    formal_writer: JAVA_DOMAIN_POSTGRESQL
    new_runtime: NONE
  JAVA_SIGNED_SYNTHETIC_NOOP_SHADOW:
    formal_process_owner: EXISTING_JAVA_REVIEW_OUTCOME_PATH
    formal_writer: EXISTING_JAVA_PATH_ONLY
    input: JAVA_SIGNED_NON_CASE_FIXTURE
    tool_capability: DETERMINISTIC_NOOP_ONLY
    graph_sink: ISOLATED_PROPOSAL_COMPARISON_ONLY
    allocation: ENGINEERING_ONLY_AFTER_P7_0_PASS
  TEMPORAL:
    formal_process_owner: OUTCOME_ROOM_WORKFLOW
    formal_writer: JAVA_ACTIVITY_FINALIZERS
    allocation: FORBIDDEN

resources:
  primary_owner: R
  heavy_test_slots: 1
  light_test_slots: 2
  maven_fork_count: 1
  frontend_vitest_process_slots: 1
  frontend_cli_worker_override: OMITTED_USE_REPOSITORY_POOL_CONFIG
  heavy_token_required_for:
    - maven_test_or_spring_context
    - temporal_test_environment
    - postgresql_or_testcontainers
    - frontend_production_build_or_browser
    - docker_compose
    - full_regression_load_soak_chaos_or_dr
  delegated_forbidden_commands:
    - full_java_suite
    - full_python_suite
    - full_frontend_suite_or_build
    - docker_compose_up_or_build
    - browser_or_playwright
    - load_soak_chaos_or_dr

team:
  primary: R
  implementation_owners: [A, B, C, D, E]
  logical_p0_review_lanes: [R1, R2, R3]
  logical_verification_lanes: [V1, V2]
  logical_lookahead_lane: L
  activation: DEPENDENCY_AWARE
  shared_path_writes: PRIMARY_ONLY
  owner_E_subscopes: SEQUENTIAL_PYTHON_THEN_FRONTEND

task_dag:
  P7-R0:
    result: P7_CONTRACT_CANDIDATE_COMMIT
    requires: [EXACT_C6_E6_A6, PHASE7_ENGINEERING_EXCEPTION, CONTRACT_PACK_COMPLETE]
  P7-R1:
    result: FOUR_SOURCE_BATCH_0_REPORTS
    requires: [P7-R0]
  P7-R2:
    result: P7_0_PASS_OR_BLOCKED_ENTRY_EVIDENCE
    requires: [P7-R1_ALL_PASS]
  P7-A1:
    result: PURE_OUTCOME_WORKFLOW_KERNEL
    requires: [P7-R2_PASS]
  P7-B1:
    result: FROZEN_PACKET_AND_FIVE_DECISION_AUTHORITY
    requires: [P7-R2_PASS]
  P7-C1:
    result: V045_OPERATION_RECEIPT_COMPENSATION_LEDGER_FOUNDATION
    requires: [P7-R2_PASS]
  P7-C2:
    result: V045_LEDGER_BOUND_TO_REVIEW_PROTOCOL
    requires: [P7-C1, B_REVIEW_CONTRACT_PUBLISHED]
  P7-D1:
    result: SYNTHETIC_NOOP_EXECUTION_CLOSURE_EVALUATION_FOUNDATION
    requires: [P7-R2_PASS]
  P7-D2:
    result: SYNTHETIC_NOOP_EXECUTION_BOUND_TO_WORKFLOW_AND_LEDGER
    requires: [P7-D1, A_WORKFLOW_PROTOCOL_PUBLISHED, C_LEDGER_CONTRACT_PUBLISHED]
  P7-E1:
    result: PRIVATE_OUTCOME_REVIEW_GRAPH
    requires: [P7-R2_PASS]
  P7-E2:
    result: DRAFT_REVIEW_OUTCOME_FRONTEND_COMPATIBILITY
    requires: [P7-E1, B_REVIEW_PROJECTION_PUBLISHED, D_OUTCOME_PROJECTION_PUBLISHED]
  P7-R3:
    result: FAIL_CLOSED_SHARED_ASSEMBLY
    requires: [P7-A1, P7-B1, P7-C2, P7-D2, P7-E2]
  P7-R4:
    result: PHASE7_ENGINEERING_CANDIDATE
    requires: [P7-R3, ALL_P0_CLOSED, BATCH_1_PASS, BATCH_2_PASS]

batches:
  draft_validation:
    status: RUNNABLE_FOR_PLANNING_ONLY
    purpose: Parse and inspect planning artifacts; cannot pass P7.0 or authorize implementation.
    commands:
      - id: yaml_phase7_draft
        cwd: .
        resource_class: light
        command: >-
          D:\miniconda\python.exe -c
          "import pathlib,yaml; [yaml.safe_load(pathlib.Path(p).read_text(encoding='utf-8'))
          for p in ('plans/phase-7-outcome-pilot-test-batches.yaml','plans/phase-7-owner-briefs.yaml')]"

  batch_0_entry:
    status: NOT_RUN
    owner: R
    exact_clean_detached_sha_required: true
    fresh_run_directory_required: true
    sealed_execution_manifest_required: true
    all_four_sources_required: true
    max_parallel_light_sources: 2
    max_parallel_heavy_sources: 1
    accepted_candidate_commit: null
    entry_evidence_commit: null
    source_test_counts: null
    execution_gate:
      required_candidate_state: P7_0_CONTRACT_CANDIDATE_COMMITTED
      required_upstream_checkpoint: d18a1f130a925429e8c2dfd11352cea4ca8673a0
      required_next_phase_permission: PHASE_7_ENGINEERING_ONLY
      required_exception_state: ADR_0016_ACCEPTED_FOR_ENGINEERING_ONLY
      required_batch_status: READY_FOR_EXACT_SHA_BATCH_0
      required_entry_decision: CONTRACT_CANDIDATE_READY
      reject_before_source_execution: true
    source_reports:
      static_phase7_entry: static-phase7-entry.xml
      python_phase7_entry: python-phase7-entry.xml
      java_phase7_entry: java-phase7-entry.xml
      frontend_phase7_entry: frontend-phase7-entry.xml
    source_commands:
      - id: static_phase7_entry
        cwd: .
        resource_class: light
        report: static-phase7-entry.xml
        report_kind: PYTEST_JUNIT
        expected_report_count: 1
        selected_test_file_count: 5
        minimum_tests: 65
        command: >-
          D:\miniconda\python.exe -m pytest -q
          tests/static/test_phase7_outcome_contracts.py
          tests/static/test_phase7_outcome_pilot_plan.py
          tests/static/test_phase7_entry_checkpoint.py
          tests/static/test_phase7_entry_evidence.py
          tests/static/test_temporal_refactor_traceability.py
          --junitxml={raw_report}
      - id: python_phase7_entry
        cwd: python-agent-service
        resource_class: light
        report: python-phase7-entry.xml
        report_kind: PYTEST_JUNIT
        expected_report_count: 1
        selected_test_file_count: 1
        minimum_tests: 3
        command: >-
          D:\miniconda\python.exe -m pytest -q tests/test_evaluation.py
          --junitxml={raw_report}
      - id: java_phase7_entry
        cwd: java-api-service
        resource_class: heavy
        report: java-phase7-entry.xml
        report_kind: SUREFIRE_GLOB
        raw_report_glob: target/surefire-reports/TEST-*-{report_suffix}.xml
        expected_report_count: 7
        selected_test_file_count: 7
        minimum_tests: 18
        command: >-
          .\mvnw.cmd -DforkCount=1
          -Dtest=ReviewApplicationServiceV2Test,FrozenReviewPacketTest,ApprovalPolicyEngineTest,ReviewControllerTest,CaseOutcomeServiceTest,CaseOutcomeControllerTest,RestClientEvaluationAgentClientTest
          -Dsurefire.reportNameSuffix={report_suffix} test
      - id: frontend_phase7_entry
        cwd: frontend
        resource_class: light
        report: frontend-phase7-entry.xml
        report_kind: VITEST_JUNIT
        expected_report_count: 1
        selected_test_file_count: 6
        minimum_tests: 41
        command: >-
          node node_modules/vitest/vitest.mjs run
          src/views/disputes/OutcomeView.test.js
          src/views/disputes/AdjudicationDraftView.test.js
          src/views/reviews/ReviewQueueView.test.js
          src/views/reviews/ReviewWorkbenchView.test.js
          src/views/ReviewWorkbenchView.test.js
          src/api/review.test.js
          --reporter=default --reporter=junit
          --outputFile.junit={raw_report}
    execution_manifest:
      filename: phase7-entry-execution-manifest.json
      schema_version: phase7-entry-execution-manifest.v1
      seal: SHA256_CANONICAL_JSON_EXCLUDING_MANIFEST_SHA256
      candidate_sha_and_clean_state_before_after_each_source: true
      argv_command_hash_environment_hash_required: true
      stdout_stderr_and_report_hashes_required: true
      ordered_source_prefix_required_on_resume: true
      terminal_green_status: SOURCE_SUITES_GREEN_AWAITING_SEPARATE_ENTRY_EVIDENCE
      forbidden_statuses: [P7_0_PASS, IMPLEMENTATION_AUTHORIZED, MIG_006_PASS, MIG_007_PASS]
    retry_policy:
      classify_before_retry: true
      classifications: [PRODUCT, FIXTURE, INFRA, EXTERNAL_GATE]
      same_sha_retry_allowed_only_for: INFRA
      quarantined_attempt_reports_reused: false
      mixed_attempt_or_candidate_reports_forbidden: true
    required_result: P7_0_ENGINEERING_ENTRY_PASS_FROM_SEPARATE_DIRECT_CHILD_EVIDENCE_COMMIT

  batch_1_foundation:
    status: PLANNED_BLOCKED_ON_P7_0
    owner: R
    java_test_classes:
      - OutcomeRoomWorkflowTest
      - OutcomeRoomWorkflowReplayTest
      - ReviewApplicationServiceV2Test
      - FrozenReviewPacketTest
      - ApprovalPolicyEngineTest
      - OutcomeOperationLedgerPersistenceTest
      - ToolActivityIdempotencyTest
      - CaseClosureServiceTest
      - RestClientEvaluationAgentClientTest
    python_test_paths:
      - python-agent-service/tests/graphs/outcome/**
      - python-agent-service/tests/agents/test_review_copilot.py
      - python-agent-service/tests/test_evaluation.py
    frontend_test_paths:
      - frontend/src/views/disputes/AdjudicationDraftView.test.js
      - frontend/src/views/disputes/OutcomeView.test.js
      - frontend/src/views/reviews/ReviewQueueView.test.js
      - frontend/src/views/reviews/ReviewWorkbenchView.test.js
      - frontend/src/views/ReviewWorkbenchView.test.js
      - frontend/src/api/review.test.js
    assertions:
      - WORKFLOW_KERNEL_UNREGISTERED_AND_UNALLOCATED
      - FIVE_HUMAN_DECISIONS_ACTOR_BOUND_AND_IDEMPOTENT
      - V045_ADDITIVE_HASH_BOUND_LEDGER
      - EXACT_FIVE_DECISIONS_APPROVE_MODIFY_AND_APPROVE_REQUEST_MORE_EVIDENCE_REJECT_ESCALATE_MANUAL
      - GRAPH_READ_ONLY_EMPTY_TOOL_POLICY
      - SYNTHETIC_TOOLS_DETERMINISTIC_NOOP
      - LEGACY_FRONTEND_COMPATIBILITY

  batch_2_integration:
    status: PLANNED_BLOCKED_ON_BATCH_1
    owner: R
    planned_test_classes:
      - ReviewTemporalCommandIntegrationTest
      - OutcomeOperationLedgerIntegrationTest
      - ToolActivityIdempotencyTest
      - CompensationWorkflowTest
      - OutcomeClosureEvaluationOrderingTest
      - OutcomeSyntheticNoopAssemblyTest
      - OutcomeReliabilityHarnessTest
    assertions:
      - REVIEW_DECISION_AND_SLA_SAME_TICK_DETERMINISTIC
      - DUPLICATE_DECISION_AND_OPERATION_RETURN_IDENTICAL_RECEIPT
      - DIFFERENT_HASH_OR_ACTOR_CONFLICTS
      - LOST_RESPONSE_DOES_NOT_DUPLICATE_EFFECT
      - COMPENSATION_APPEND_ONLY_REVERSE_PARENT_ORDER
      - CLOSE_ONLY_AFTER_REQUIRED_TERMINAL_RECEIPTS
      - EVALUATION_FAILURE_CANNOT_REOPEN
      - NO_REAL_CASE_SOURCE_TOOL_EFFECT_FORMAL_SINK_OR_TEMPORAL_ALLOCATION

  batch_3_engineering_candidate:
    status: PLANNED_NOT_RUN
    owner: R
    exact_clean_candidate_sha_required: true
    all_sources_rerun_from_same_sha: true
    evidence_commit_must_be_separate_direct_child: true
    required_artifacts:
      - phase7-candidate-execution-manifest.json
      - static-phase7-candidate.xml
      - python-phase7-candidate.xml
      - java-phase7-candidate-surefire-reports
      - frontend-phase7-candidate.xml
      - raw-stdout-stderr-with-sha256-index
      - source-tree-and-environment-manifest
      - p0-review-disposition
      - phase7-engineering-decision.json
    decision_ceiling: PHASE_7_ENGINEERING_CHECKPOINT_ONLY
    forbidden_claims:
      - MIG_006_PASS
      - MIG_007_PASS
      - TEMPORAL_OUTCOME_ALLOCATION
      - FORMAL_WORKFLOW_ACTIVATION
      - REAL_TOOL_EFFECT
      - REAL_CASE_SHADOW
      - CANARY
      - PROMOTION

  unified_or_promotion:
    status: DEFERRED
    automatic: false
    requires_explicit_separate_authorization: true
    includes: [full_regression, browser_e2e, docker, load, soak, chaos, dr, real_shadow, canary, promotion]

evidence_rules:
  candidate_bound: true
  clean_detached_worktree: true
  single_candidate_sha_per_checkpoint: true
  immutable_raw_reports: true
  source_argv_and_hashes: true
  stdout_stderr_hashes: true
  environment_hash: true
  test_counts_and_zero_skip_policy_recorded: true
  separate_direct_child_evidence_commit: true
  no_local_uncommitted_report_as_evidence: true
  no_pass_claim_in_planning_artifacts: true
  report_completeness_rule: DISTINGUISH_RAW_REPORT_COUNT_FROM_SELECTED_FILE_OR_CLASS_COUNT_AND_FREEZE_MINIMUM_TESTS_ONLY_FROM_MEASURED_CLEAN_CANDIDATE_RESULTS

promotion_boundary:
  engineering_checkpoint_may_grant: PHASE_8_ENGINEERING_ONLY
  engineering_checkpoint_cannot_grant:
    - MIG_006_PASS
    - MIG_007_PASS
    - TEMPORAL_OUTCOME_ALLOCATION
    - FORMAL_OUTCOME_WORKFLOW
    - REAL_TOOL_CAPABILITY
    - REAL_DATA_SHADOW
    - PRODUCTION_TRAFFIC
    - CANARY
    - PROMOTION
