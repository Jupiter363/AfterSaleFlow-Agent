schema_version: phase-test-batches.v1
phase: 4
name: intake-pilot-engineering-shadow

gate:
  contract_gate: P4.0
  required_entry: PHASE_3_ENGINEERING_CHECKPOINT
  observed_entry_state:
    engineering_checkpoint: PASS
    promotion_gate: PENDING
    next_phase_permission: PHASE_4_ENGINEERING_ONLY
    MIG-003: PENDING_PROMOTION
  entry_decision: ENGINEERING_ONLY
  implementation_allowed_when:
    - P4_0_CONTRACT_GATE_COMMITTED
    - P4_0_BATCH_0_PASSED_ON_EXACT_CONTRACT_CANDIDATE_SHA
    - P4_0_ENTRY_EVIDENCE_COMMITTED
    - PHASE_3_ENGINEERING_CHECKPOINT_PASS
    - PHASE_4_ENGINEERING_ONLY_PERMISSION_RECORDED
  runtime_modes_allowed: [DISABLED, SIGNED_SYNTHETIC_SHADOW]
  traffic_constraints:
    formal_room_writer_allowed: false
    temporal_intake_writer_allowed: false
    real_case_shadow_allowed: false
    production_traffic_allowed: false
    canary_allowed: false
    promotion_allowed: false
    synthetic_fixtures_only: true
  invariants:
    - Java remains the only formal business writer.
    - Python has no Domain DB credentials or formal side-effect capability.
    - Graph results remain proposals and cannot advance a room.
    - Existing formal intake traffic remains on the legacy writer.
    - MIG-004 cannot become PASS while MIG-003 is PENDING_PROMOTION.
  gate_change_policy:
    - A later MIG-003 approval does not implicitly relax this matrix.
    - Formal traffic requires an explicit amended gate and a new candidate checkpoint.
  authority_binding_gate:
    gate_id: P4-R1.5
    status: FROZEN_FOR_IMPLEMENTATION
    manifest: plans/phase-4-r15-authority-binding-contract.yaml
    schema: plans/phase-4-r15-authority-binding-contract.schema.json
    static_gate: tests/static/test_phase4_r15_authority_binding_contract.py
    required_before_tasks: [P4-R1, P4-D1, P4-E1]
    runtime_effect: none

resources:
  active_primary_agents: 1
  logical_child_owners: 5
  max_active_child_agents: 3
  max_active_agents_total: 4
  execution_waves: 2
  heavy_test_slots: 1
  light_test_slots: 2
  pytest_db_workers: 1
  maven_fork_count: 1
  frontend_max_workers: 2
  docker_compose_owner: primary
  temporal_test_environment_owner: primary
  candidate_checkpoint_owner: primary
  heavy_resources:
    - maven_test
    - spring_context
    - postgresql
    - testcontainers
    - temporal_test_server
    - docker_compose
    - frontend_build
    - browser_or_playwright
    - repository_full_regression
  child_forbidden_commands:
    - java_full_suite
    - python_full_suite
    - docker_compose_up_or_build
    - frontend_production_build
    - browser_or_playwright_suite
    - repository_full_regression

test_token:
  required_for:
    - maven_test
    - spring_context
    - postgresql
    - testcontainers
    - temporal_test_server
    - docker_compose
    - browser_or_playwright
  request_fields: [task_id, command, expected_duration, resource_class]
  grantor: primary
  max_heavy_tokens: 1

tiers:
  T0:
    owner: delegated_agent
    max_duration_seconds: 180
    services: none
    purpose: syntax, schema, import boundary, pure graph, workflow, domain, and UI unit checks
  T1:
    owner: primary
    trigger: wave_1_merged
    purpose: deduplicated signed-synthetic minimum-chain and foundation checks
  T2:
    owner: primary
    trigger: wave_2_merged
    purpose: PostgreSQL, Temporal time-skipping, recovery, projection, stream, and UI integration
  T3:
    owner: primary
    trigger: explicit_unified_verification_checkpoint_only
    automatic: false
    purpose: full repository, browser E2E, real canary, load, soak, DR, and production-equivalent validation

baseline_ids:
  intake: [INT-001, INT-002, INT-003, INT-004, INT-005, INT-006, INT-007, INT-008, INT-009, INT-010]
  overview: [OVR-003]
  recovery_stream_history: [CORE-004, CORE-005, CORE-006, CORE-007, CORE-008, CORE-009, CORE-010]
  security: [SEC-001, SEC-002, SEC-003, SEC-004, SEC-005, SEC-006]
  ui: [UI-001, UI-003, UI-004]

check_ids:
  room_intake: [ROOM-INTAKE-001, ROOM-INTAKE-002, ROOM-INTAKE-003, ROOM-INTAKE-004]
  graph: [GRAPH-007, GRAPH-008, GRAPH-020, GRAPH-021, GRAPH-022]
  temporal: [TEMP-020, TEMP-021, TEMP-022, TEMP-023]
  java: [JAVA-007, JAVA-008, JAVA-009, JAVA-010, JAVA-011]
  migration: [MIG-004]

supporting_regression_check_ids:
  lcel: [LCEL-001, LCEL-002, LCEL-004, LCEL-005, LCEL-006, LCEL-007, LCEL-008, LCEL-010, LCEL-012, LCEL-014]
  contract: [CONTRACT-003, CONTRACT-004, CONTRACT-005, CONTRACT-006, CONTRACT-007, CONTRACT-012, CONTRACT-013]

claim_status_policy:
  PASS_ENGINEERING:
    - ROOM-INTAKE-001
    - ROOM-INTAKE-002
    - ROOM-INTAKE-003
    - ROOM-INTAKE-004
    - GRAPH-007
    - GRAPH-008
    - GRAPH-020
    - GRAPH-021
    - GRAPH-022
    - TEMP-021
    - TEMP-022
    - JAVA-007
    - JAVA-008
    - JAVA-009
    - JAVA-010
    - JAVA-011
  PARTIAL_ENGINEERING:
    TEMP-020: Intake has no product deadline; prove durable waiting and no implicit timeout without claiming the Evidence reminder/deadline requirement.
    TEMP-023: synthetic worker-kill and replay evidence is engineering support; production-equivalent worker topology remains external.
  PENDING_PROMOTION:
    MIG-004: real shadow, privacy scan, formal writer cutover, and cohort observation are forbidden under the current gate.

