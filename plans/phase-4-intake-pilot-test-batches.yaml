task_contracts:
  P4-0:
    owner: R
    depends_on: []
    objective: Freeze ADR 0011, the P4.0 contract pack, schemas, fixtures, execution plan, test matrix, baseline inventory, and static entry gate.
    outputs: [contract_candidate_commit]
    definition_of_done: All wire and authority choices are closed and no feature runtime is enabled.
  P4-R0G:
    owner: R
    depends_on: [P4-0]
    objective: Add only the fail-closed non-LEGACY epoch-allocation guard required to make the engineering defaults enforceable.
    outputs: [selector_guard, configuration_guard, authenticated_legacy_epoch_fixture, focused_context_tests]
    definition_of_done: Default or partially configured deployments cannot allocate SHADOW or TEMPORAL real epochs; the synthetic driver requires explicit enablement.
  P4-A1:
    owner: A
    depends_on: [P4-0, P4-R0G]
    objective: Implement typed intake.v2 state, one-time snapshot import, event application, exhaustive routing, validators, and proposal projection.
    inputs: [graph-private-thread-registration.v1, intake-domain-snapshot.v2, intake-turn-event.v2, intake-turn-proposal.v2]
    outputs: [compiled_intake_v2_graph, focused_graph_tests]
    definition_of_done: Service-free tests prove exact private bindings, bounded state, no memory_frame, no long interrupt, and proposal-only output.
  P4-A2:
    owner: A
    depends_on: [P4-A1]
    objective: Bind the Intake State Lens and governed LCEL chain to the Phase 3 executor and harden checkpoint replay and recovery behavior.
    inputs: [governed_runnable_protocol, graph_runtime_v1]
    outputs: [intake_lcel_pipeline, graph_recovery_tests]
    definition_of_done: Runnable object capture, guardrails, cached replay, and crash-boundary tests pass without a formal sink.
  P4-B1:
    owner: B
    depends_on: [P4-0, P4-R0G]
    objective: Implement the pure deterministic Intake Workflow kernel, five states, enqueue-only handlers, sequencing, and branch receipts.
    inputs: [intake_workflow_protocol, frozen_activity_ports]
    outputs: [intake_room_workflow, time_skipping_unit_tests]
    definition_of_done: Accept, reject, cancel, respondent lock, durable wait, duplicate, and out-of-order cases are deterministic and replayable.
  P4-B2:
    owner: B
    depends_on: [P4-B1]
    objective: Add Activity orchestration, cancellation, retry-budget propagation, Continue-As-New carry state, replay, and worker-kill tests against fakes.
    inputs: [frozen_activity_receipts, operation_keys]
    outputs: [workflow_activity_orchestration, workflow_recovery_tests]
    definition_of_done: Commit/completion loss and stale results converge without repeated side effects; no repository or model client enters Workflow code.
  P4-C1:
    owner: C
    depends_on: [P4-0, P4-R0G]
    objective: Implement V043, Java private-thread registration, immutable snapshot publication, event refs, and Graph command construction.
    inputs: [thread_registration_contract, snapshot_event_contracts]
    outputs: [V043, thread_factory, snapshot_publisher, graph_command_factory]
    definition_of_done: Hash, scope, epoch, session, visibility, idempotency, and no-private-crossing tests pass with no Graph DB access from Java.
  P4-C2:
    owner: C
    depends_on: [P4-C1]
    objective: Implement proposal loading/hash verification, typed Finalizer, domain Activities, legacy mode guards, and idempotent receipts behind unreachable formal wiring.
    inputs: [intake-turn-proposal.v2, intake-finalization-receipt.v1, workflow_activity_ports]
    outputs: [formal_ports, transaction_tests, legacy_strangler_guards]
    definition_of_done: Atomicity, replay, stale fence, actor isolation, and all Intake branch invariants pass; SHADOW cannot resolve these ports.
  P4-D1:
    owner: D
    depends_on: [P4-B2, P4-C2, P4-R1.5, P4-R1]
    objective: Implement the versioned Java Intake projection/reader and API compatibility fields.
    inputs: [workflow_snapshot, finalization_receipt, process_projection]
    outputs: [projection_adapter, API_compatibility_tests]
    definition_of_done: Legacy and future projections preserve authorization and return explicit lag/pending/version state without inference.
  P4-D2:
    owner: D
    depends_on: [P4-D1]
    objective: Update Vue/store compatibility for versioned projection, active-run recovery, history lock, private stream, layout, and accessibility.
    inputs: [compatible_intake_API, agent_stream_v2]
    outputs: [frontend_compatibility, focused_UI_tests]
    definition_of_done: OVR, CORE, INT, SEC, and UI focused baselines pass without route or layout regressions.
  P4-E1:
    owner: E
    depends_on: [P4-A2, P4-B2, P4-C2, P4-R1.5, P4-R1]
    objective: Replace global cutover semantics with a room-specific stable Intake selector and implement isolated synthetic parity and bounded telemetry.
    inputs: [epoch_selection_contract, normalized_parity_contract]
    outputs: [intake_epoch_selector, shadow_comparison, observability]
    definition_of_done: Other rooms remain LEGACY, real traffic remains forbidden, formal sink reachability is zero, and parity contains no private text.
  P4-E2:
    owner: E
    depends_on: [P4-E1, P4-D2]
    objective: Implement the crash/race/rollback harness and Phase 4 evidence policy without running the final candidate checkpoint.
    inputs: [all_slice_receipts, rollback_protocol]
    outputs: [fault_harness, evidence_policy, rollback_checks]
    definition_of_done: Synthetic failure cases are classified and reproducible, with no claim that external gates passed.
  P4-R1.5:
    owner: R
    depends_on: [P4-A1, P4-B1, P4-C1]
    objective: Freeze the exact V043_1 authority relations, source payload schemas, revocation linearization, and static contract gate before shared worker assembly or Wave B consumers advance.
    inputs: [A_foundation, B_ports, C_foundation, V043_immutable_bindings]
    outputs: [r15_authority_manifest, r15_wire_schemas, r15_static_gate]
    definition_of_done: The manifest validates against a closed schema, positive and negative wire fixtures pass, runtime gates remain closed, and independent review accepts the contract commit.
  P4-R1:
    owner: R
    depends_on: [P4-A1, P4-B1, P4-C1, P4-R1.5]
    objective: Integrate shared proposal transport, exact Graph registration/runtime binding, versioned typed-child dispatch, worker registration, and no-formal-sink assembly.
    inputs: [A_foundation, B_ports, C_foundation]
    outputs: [minimum_signed_synthetic_chain, shared_integration_tests]
    definition_of_done: Case Workflow dispatch honors persisted workflow_type with a Temporal version marker, and the S1 chain ends only in comparison storage.
  P4-R2:
    owner: R
    depends_on: [P4-A2, P4-B2, P4-C2, P4-D2, P4-E2, P4-R1.5, P4-R1]
    objective: Close reviews, freeze one candidate, run the deduplicated checkpoint, classify failures, and archive evidence.
    outputs: [phase4_candidate, phase4_evidence_bundle, engineering_checkpoint]
    definition_of_done: One candidate SHA supplies all accepted reports and promotion remains PENDING.

slices:
  P4-S1:
    name: minimum-signed-synthetic-intake-v2-chain
    objective: Exercise snapshot binding, private thread identity, intake.v2 Graph, typed proposal, and shadow comparison without a formal write.
    allowed_runtime_modes: [DISABLED, SIGNED_SYNTHETIC_SHADOW]
    formal_side_effects_allowed: false
    baseline_ids: [INT-008, INT-009, INT-010, CORE-006, CORE-007, CORE-008, CORE-009, SEC-004, SEC-005, SEC-006]
    check_ids: [ROOM-INTAKE-003, GRAPH-007, GRAPH-008, GRAPH-020, GRAPH-021, GRAPH-022, JAVA-007, JAVA-010]
    focused_test_groups:
      - intake_graph_state_router_and_validator_units
      - trusted_snapshot_and_thread_identity_contracts
      - governed_lcel_object_flow_and_guardrails
      - proposal_only_shadow_transport
      - legacy_adapter_compatibility

  P4-S2:
    name: initiator-accept-reject-cancel
    objective: Verify initiator branch semantics in deterministic Workflow and Java domain fixtures while formal Temporal ownership remains disabled.
    allowed_runtime_modes: [DISABLED, SIGNED_SYNTHETIC_SHADOW]
    formal_side_effects_allowed: false
    baseline_ids: [INT-003, INT-004, INT-007, SEC-001, SEC-003]
    check_ids: [ROOM-INTAKE-004, TEMP-020, TEMP-021, JAVA-007, JAVA-008, JAVA-009, JAVA-010, JAVA-011]
    focused_test_groups:
      - initiator_ready_but_java_admission_rejects
      - accept_invites_and_stays_in_intake
      - not_admissible_terminal_branch
      - initiator_cancelled_terminal_branch
      - respondent_cannot_cancel_or_preempt

  P4-S3:
    name: respondent-private-supplement-freeze-and-evidence-open
    objective: Preserve actor isolation and sequential admission through independent respondent readiness and bilateral freeze.
    allowed_runtime_modes: [DISABLED, SIGNED_SYNTHETIC_SHADOW]
    formal_side_effects_allowed: false
    baseline_ids: [INT-001, INT-002, INT-005, INT-006, OVR-003, SEC-001, SEC-002, SEC-003, SEC-004, SEC-005, SEC-006]
    check_ids: [ROOM-INTAKE-001, ROOM-INTAKE-003, ROOM-INTAKE-004, GRAPH-008, GRAPH-020, TEMP-020, TEMP-021, JAVA-007, JAVA-009, JAVA-011]
    focused_test_groups:
      - exact_actor_private_thread_isolation
      - respondent_locked_until_initiator_acceptance
      - respondent_readiness_recomputed_independently
      - bilateral_frozen_matrix_once
      - evidence_open_and_timer_start_once

  P4-S4:
    name: projection-stream-and-ui-compatibility
    objective: Preserve the existing URL, projection semantics, active-run recovery, public stream, history mode, layout, and accessibility behavior.
    allowed_runtime_modes: [DISABLED, SIGNED_SYNTHETIC_SHADOW]
    formal_side_effects_allowed: false
    baseline_ids: [OVR-003, CORE-004, CORE-005, CORE-006, CORE-007, CORE-008, CORE-009, CORE-010, INT-009, INT-010, UI-001, UI-003, UI-004]
    check_ids: [ROOM-INTAKE-001, JAVA-010, JAVA-011]
    focused_test_groups:
      - process_projection_version_and_pending_state
      - active_run_refresh_and_stream_replay
      - role_switch_late_response_rejection
      - history_mode_write_lock
      - intake_shell_breakpoint_long_content_and_dialog_focus

  P4-S5:
    name: crash-race-parity-and-rollback-hardening
    objective: Prove deterministic recovery and rollback invariants at synthetic crash and race points without enabling a formal writer or canary.
    allowed_runtime_modes: [DISABLED, SIGNED_SYNTHETIC_SHADOW]
    formal_side_effects_allowed: false
    baseline_ids: [INT-001, INT-002, INT-003, INT-004, INT-005, INT-006, INT-007, INT-008, INT-009, INT-010, CORE-004, CORE-005, SEC-001, SEC-002, SEC-003, SEC-004, SEC-005, SEC-006]
    check_ids: [ROOM-INTAKE-001, ROOM-INTAKE-002, ROOM-INTAKE-003, ROOM-INTAKE-004, GRAPH-007, GRAPH-021, GRAPH-022, TEMP-022, TEMP-023, JAVA-007, JAVA-008, JAVA-009, JAVA-010, JAVA-011, MIG-004]
    focused_test_groups:
      - same_command_same_hash_and_different_hash
      - model_and_checkpoint_four_crash_points
      - simultaneous_party_confirmation
      - respondent_wait_and_submission_replay_without_implicit_timeout
      - java_commit_then_signal_or_completion_loss
      - stale_epoch_and_late_final_rejection
      - normalized_shadow_invariant_diff
      - disabled_mode_and_higher_epoch_rollback_contract

waves:
  wave_0:
    active_roles: [R]
    tasks: [P4-0, P4-R0G]
    trigger: P4_0_contract_gate_commit
    runtime_changes_allowed: gate_hardening_only
    allowed_runtime_change_routes:
      - Java non-LEGACY epoch allocation guard with fail-closed defaults
      - static proof that signed synthetic SHADOW cannot resolve a formal Finalizer
    feature_implementation_allowed: false
    test_batch: P4-BATCH-0

  wave_1:
    active_roles: [A, B, C]
    tasks: [P4-A1, P4-A2, P4-B1, P4-B2, P4-C1, P4-C2]
    slices: [P4-S1, P4-S2, P4-S3]
    max_active_children: 3
    test_batch: P4-BATCH-1

  wave_2:
    active_roles: [D, E, R]
    tasks: [P4-R1.5, P4-R1, P4-D1, P4-D2, P4-E1, P4-E2]
    reused_completed_slots: true
    slices: [P4-S2, P4-S3, P4-S4, P4-S5]
