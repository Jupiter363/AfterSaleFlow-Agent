failure_classification:
  required_values: [PRODUCT, FIXTURE, INFRA, EXTERNAL_GATE]
  classify_before_rerun: true
  exactly_one_classification_per_failure: true
  PRODUCT:
    criteria:
      - deterministic product, contract, privacy, recovery, or baseline assertion fails at the candidate SHA
      - implementation violates a writer, epoch, fence, idempotency, or audience invariant
    action: fix_owner_code_run_exact_test_and_affected_batch_then_create_a_new_candidate_SHA
    blocks_engineering_checkpoint: true
    blocks_promotion: true
  FIXTURE:
    criteria:
      - product contract is independently proven and the test data, golden result, or harness expectation is stale or malformed
    action: record_contract_proof_update_fixture_without_weakening_assertions_then_run_exact_test_and_affected_batch
    blocks_engineering_checkpoint_until_resolved: true
    blocks_promotion_until_resolved: true
  INFRA:
    criteria:
      - environment failure such as Docker, port, disk, network, Testcontainers, or Temporal test server failure occurs without a product assertion
    action: preserve_trace_restore_environment_and_rerun_only_the_failed_source_suite_on_the_same_SHA
    evidence_rule: quarantine_failed_attempt_and_do_not_mix_it_into_derived_views
    code_change_allowed: false
  EXTERNAL_GATE:
    criteria:
      - approval, real identity, production-equivalent traffic, canary observation, load, soak, DR, or another externally controlled condition is unavailable
    action: retain_engineering_evidence_and_keep_promotion_MIG_003_and_MIG_004_pending
    blocks_engineering_checkpoint: false
    blocks_promotion: true
  forbidden:
    - unconditional_full_suite_retry
    - weakening_security_privacy_or_writer_assertions_for_green
    - reclassifying_a_deterministic_product_failure_as_infrastructure
    - mixing_results_from_different_candidate_commits
    - mixing_quarantined_and_accepted_attempt_reports
    - formal_writer_or_real_traffic_in_phase_4_engineering

external_gates:
  current_status: PENDING
  classification: EXTERNAL_GATE
  excluded_from_engineering_pass: true
  required_before_formal_canary:
    - MIG_003_PROMOTED
    - production_mTLS_identity_and_key_rotation_approved
    - production_equivalent_signed_driver_approved
    - formal_writer_cutover_runbook_approved
    - rollback_authority_and_observers_assigned
  required_before_MIG_004_PASS:
    - all_engineering_batches_pass_on_one_candidate
    - real_shadow_privacy_scan_zero_leakage
    - canary_1_percent_new_epochs_observation_pass
    - canary_5_percent_new_epochs_observation_pass
    - canary_25_percent_new_epochs_observation_pass
    - canary_100_percent_new_epochs_observation_pass
    - no_active_epoch_implicitly_changes_graph_or_workflow_version
    - Java_no_longer_round_trips_memory_frame_as_cognitive_truth
    - production_approval_recorded
  current_engineering_result_must_report:
    promotion_gate: PENDING
    MIG-003: PENDING_PROMOTION
    MIG-004: PENDING_PROMOTION

verification_schedule:
  delegated_slice_loop:
    - run_owned_T0_tests_only
    - record_command_duration_exit_code_and_touched_slice
    - request_heavy_test_token_instead_of_starting_services
    - hand_off_focused_failures_with_classification
  primary_wave_loop:
    - run_P4_BATCH_0_once_at_entry
    - run_P4_BATCH_1_once_after_wave_1_merge
    - run_P4_BATCH_2_once_after_wave_2_merge_and_fixes
    - freeze_one_candidate_SHA_after_cross_review
    - run_P4_BATCH_3_once_for_accepted_candidate_evidence
  deferred:
    - full_repository_regression
    - browser_E2E
    - real_canary
    - load_soak_and_DR
