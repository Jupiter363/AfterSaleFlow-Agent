  required_values: [PRODUCT, FIXTURE, CONTRACT, INFRA, EXTERNAL_GATE]
  classify_before_rerun: true
  PRODUCT: Product code, runtime, migration, deployment, or test behavior changes invalidate affected exact-SHA evidence.
  FIXTURE: Prove the contract then replace the fixture and rerun the exact scope.
  CONTRACT: Create a replacement sole-parent C8 contract candidate from exact A7 and run a full fresh Batch 0 before any implementation.
  INFRA: Preserve the failed attempt and rerun the same SHA only.
  EXTERNAL_GATE: Record the owner and prerequisite without claiming PASS.
  forbidden:
    - unconditional_full_suite_retry
    - mixing_candidate_commits_or_attempts
    - weakening_security_reference_authority_or_slo_assertions
