task_contracts:
  P5-0:
    owner: R
    status: BLOCKED_PENDING_PHASE_4_ENGINEERING_CHECKPOINT
    depends_on:
      - PHASE_4_ENGINEERING_CHECKPOINT_PASS
      - ADR_0012_ACCEPTED
    definition_of_done:
      - exact_contract_candidate_committed
      - batch_0_passed_on_candidate_sha
      - separate_entry_evidence_commit
  P5-A1:
    owner: A
    depends_on: [P5-0]
    output: evidence_v2_state_topology_and_manifest_scheduler
    t0_checks: [schema_imports, pure_topology, one_eight_one_hundred_bounds]
  P5-A2:
    owner: A
    depends_on: [P5-A1, P5-C1]
    output: deterministic_keyed_reducer_and_recovery_properties
    t0_checks: [associativity, completion_order, identical_replay, conflicting_key]
  P5-B1:
    owner: B
    depends_on: [P5-0]
    output: typed_evidence_workflow_timer_kernel
    t0_checks: [determinism, duplicate_signal, immutable_deadline, reminder_boundary]
  P5-B2:
    owner: B
    depends_on: [P5-B1, P5-C1]
    output: java_receipt_orchestration_and_recovery
    t0_checks: [activity_retry, cancellation, stale_epoch, admission_receipt]
  P5-C1:
    owner: C
    depends_on: [P5-0]
    output: manifest_asset_and_versioned_authority_contracts
    t0_checks: [scope_hash_owner_visibility, actual_load_receipt, stale_fence]
  P5-C2:
    owner: C
    depends_on: [P5-A1, P5-B1, P5-C1]
    output: exact_once_java_merge_freeze_and_additive_bindings
    t0_checks: [terminal_coverage, transaction_idempotency, low_relevance_semantics]
  P5-D0:
    owner: D
    depends_on: [P5-0]
    output: compatible_projection_contracts_and_baseline_ui_api_fixtures
    t0_checks: [legacy_projection_contract, public_limit_50, role_privacy_fixtures]
  P5-D1:
    owner: D
    depends_on: [P5-D0, P5-A2, P5-B2, P5-C2]
    output: versioned_evidence_projection_and_api_compatibility
    t0_checks: [privacy_matrix, pending_state, active_run, history_mode]
  P5-D2:
    owner: D
    depends_on: [P5-D1]
    output: disabled_signed_synthetic_evidence_100_card_frontend_behavior
    t0_checks: [component, store, api, accessibility]
  P5-E0:
    owner: E
    depends_on: [P5-0]
    output: bulkhead_no_sink_metrics_and_signed_synthetic_test_harnesses
    t0_checks: [bulkhead_contract, no_formal_sink_static, bounded_metric_labels]
  P5-E1:
    owner: E
    depends_on: [P5-E0, P5-0, P5-A2, P5-B2, P5-C2]
    output: tenant_global_bulkheads_and_signed_synthetic_parity
    closes_engineering_checks: [GRAPH-016]
    t0_checks: [bounded_queue, no_formal_sink, privacy, deterministic_hash]
  P5-E2:
    owner: E
    depends_on: [P5-D2, P5-E1]
    output: crash_race_selector_observability_and_rollback
    t0_checks: [first_eighth_hundredth_crash, timer_race, selector_fail_closed]
  P5-R1:
    owner: R
    depends_on: [P5-A2, P5-B2, P5-C2]
    output: wave_a_integration_and_batch_1
  P5-R2:
    owner: R
    depends_on: [P5-D2, P5-E2]
    output: cross_review_closure_and_one_candidate_checkpoint

waves:
  wave_0:
    active_roles: [R]
    tasks: [P5-0]
    test_batch: P5-BATCH-0
  wave_a:
    active_roles: [R, A, B, C, D, E]
    delegated_tasks: [P5-A1, P5-A2, P5-B1, P5-B2, P5-C1, P5-C2, P5-D0, P5-E0]
    integration_task: P5-R1
    test_batch: P5-BATCH-1
  wave_b:
    active_roles: [R, A, B, C, D, E]
    delegated_tasks: [P5-D1, P5-D2, P5-E1, P5-E2]
    foundation_roles_supply_dependency_fixes_and_review: true
    test_batch: P5-BATCH-2
  candidate_wave:
    active_roles: [R]
    tasks: [P5-R2]
    requires_cross_review: true
    test_batch: P5-BATCH-3

batches:
  P5-BATCH-0:
    status: BLOCKED_PENDING_PHASE_4_ENGINEERING_CHECKPOINT
    tier: T1
    trigger: P5_0_contract_candidate_commit
    purpose: Authenticate the Phase 4 engineering handoff and ADR 0012 restrictions, then freeze the exact legacy Evidence baseline before implementation.
    requires:
      - phase_4_engineering_checkpoint_pass
      - PHASE_5_ENGINEERING_ONLY_permission
      - ADR_0012_accepted
      - public_evidence_submission_limit_remains_50
      - synthetic_manifest_counts_restricted_to_1_8_100
      - graph_016_recorded_as_phase_5_exit_evidence
      - asset_loader_restricted_to_java_signed_synthetic_capabilities
      - runtime_restricted_to_DISABLED_or_SIGNED_SYNTHETIC_SHADOW
      - protected_unrelated_worktree_changes_recorded
    asserts_pending_external_gates:
      - MIG-004
      - EVIDENCE_100_FILE_PRODUCT_API_UI_APPROVAL
      - PRODUCTION_ASSET_AUTHORIZATION
    baseline_suites:
      java:
        - EvidenceApiIntegrationTest
        - EvidenceSubmissionServiceTest
        - EvidenceCompletionServiceTest
        - EvidenceAgentTurnServiceTest
        - EvidenceDossierFreezerTest
        - EvidenceWindowWorkflowTest
        - EvidenceWindowCoordinatorTest
        - EvidenceRoomControllerTest
        - EvidenceRoomIntegrationTest
      python:
        - python-agent-service/tests/agents/test_evidence_clerk_turn.py
        - python-agent-service/tests/agents/test_evidence_fact_mapping_policy.py
        - python-agent-service/tests/evals/test_evidence_clerk_prompt_catalog.py
        - python-agent-service/tests/test_streaming.py
        - python-agent-service/tests/test_streaming_v2.py
      frontend:
        - frontend/src/views/disputes/EvidenceRoomView.test.js
        - frontend/src/components/room/RoomShell.test.js
        - frontend/src/api/evidence.test.js
        - frontend/src/api/agentStream.test.js
        - frontend/src/stores/agentStream.test.js
    static_tests:
      - tests/static/test_phase5_evidence_pilot_plan.py
      - tests/static/test_phase5_entry_contract_plan.py
      - tests/static/test_temporal_refactor_traceability.py
      - tests/static/test_graph_import_boundaries.py
      - tests/static/test_agent_platform_schema_contracts.py
    execution:
      candidate_sha_must_be_clean_and_detached: true
      evidence_commit_must_be_later_than_tested_sha: true
      heavy_parallelism: 1
      light_parallelism: 2
      browser_or_playwright: none
      real_provider: forbidden
      formal_finalizer: forbidden

  P5-BATCH-1:
    tier: T1
    trigger: wave_a_merged
    purpose: Verify Graph reducer Workflow kernel Java authority and additive persistence once after Wave A integration.
    requires_tasks: [P5-A1, P5-A2, P5-B1, P5-B2, P5-C1, P5-C2, P5-D0, P5-E0, P5-R1]
    planned_python_tests:
      - python-agent-service/tests/graphs/evidence
      - python-agent-service/tests/agents/test_evidence_clerk_turn.py
      - python-agent-service/tests/agents/test_evidence_fact_mapping_policy.py
    planned_java_test_classes:
      - EvidenceRoomWorkflowTest
      - EvidenceReducerPropertyTest
      - EvidenceGraphCommandFactoryTest
      - EvidenceGraphResultFinalizerTest
      - EvidenceAssetAuthorizationTest
      - EvidenceSubmissionServiceTest
      - EvidenceCompletionServiceTest
      - EvidenceDossierFreezerTest
    execution:
      heavy_parallelism: 1
      light_parallelism: 2
      database_workers: 1
      temporal_test_environments: 1
      real_provider: forbidden
      formal_finalizer_runtime_wiring: forbidden

  P5-BATCH-2:
    tier: T2
    trigger: wave_b_merged
    purpose: Verify projections frontend bulkheads synthetic parity fault recovery and rollback once after all owner work.
    requires_tasks: [P5-D1, P5-D2, P5-E1, P5-E2]
    planned_python_tests:
      - python-agent-service/tests/graphs/evidence
      - python-agent-service/tests/graphs/evidence/test_evidence_graph_recovery.py
      - python-agent-service/tests/security
    planned_java_test_classes:
      - EvidenceRoomWorkflowRecoveryTest
      - EvidenceTemporalCutoverIntegrationTest
      - EvidenceShadowParityServiceTest
      - EvidenceCutoverRollbackTest
      - EvidenceBulkheadIntegrationTest
      - EvidenceApiIntegrationTest
      - EvidenceAgentTurnServiceTest
      - EvidenceWindowWorkflowTest
    frontend_tests:
      - frontend/src/views/disputes/EvidenceRoomView.test.js
      - frontend/src/components/room/RoomShell.test.js
      - frontend/src/api/evidence.test.js
      - frontend/src/api/agentStream.test.js
      - frontend/src/stores/agentStream.test.js
    execution:
      order: [graph_and_asset_privacy, java_postgresql_and_temporal, projection_stream_and_frontend, crash_race_parity_and_rollback]
      heavy_parallelism: 1
      light_parallelism: 2
      database_workers: 1
      temporal_test_environments: 1
      frontend_workers: 2
      browser_or_playwright: none
      real_provider: forbidden
      formal_finalizer_runtime_wiring: forbidden

  P5-BATCH-3:
    tier: T2
    trigger: cross_review_fixes_merged
    purpose: Produce one accepted Phase 5 engineering candidate checkpoint and evidence bundle.
    requires:
      - clean_detached_candidate_worktree
      - fixed_candidate_commit_before_first_command
      - batch_0_pass
      - batch_1_pass
      - batch_2_pass
      - all_phase_5_baseline_ids_mapped
      - all_phase_5_check_ids_mapped
      - no_open_PRODUCT_failures
      - formal_traffic_still_disabled
      - real_case_shadow_still_forbidden
    candidate_policy:
      accepted_candidate_count: 1
      candidate_sha_immutable_during_run: true
      source_suites_execute_once_per_accepted_candidate: true
      mixed_commit_results_forbidden: true
      quarantined_attempts_not_reused: true
      code_change_invalidates_entire_candidate_checkpoint: true
      infra_retry_same_sha_only: true
    source_groups:
      - python_phase_5_deduplicated
      - java_phase_5_deduplicated
      - frontend_phase_5_deduplicated
      - static_phase_5_deduplicated
    execution:
      strategy: deduplicated_source_suites_then_derived_batch_views
      heavy_parallelism: 1
      light_parallelism: 2
      database_workers: 1
    evidence:
      root: test-reports/temporal-first/<release-id>/phase-5
      required_files:
        - phase-metrics.json
        - baseline-id-coverage.json
        - check-id-coverage.json
        - failure-classification.json
        - external-gates.json
        - candidate-commit.txt
        - python-phase5-junit.xml
        - java-phase5-junit.xml
        - frontend-phase5-junit.xml
        - static-phase5-junit.xml
        - batch-0-junit.xml
        - batch-1-junit.xml
        - batch-2-junit.xml
        - batch-3-junit.xml
      required_status_output:
        engineering_checkpoint: PASS_or_FAIL
        promotion_gate: PENDING
        next_phase_permission: PHASE_6_ENGINEERING_ONLY_or_BLOCKED
        MIG-005: PENDING_PROMOTION

  P5-UNIFIED-CHECKPOINT:
    tier: T3
    automatic: false
    trigger: explicit_user_request_or_agreed_unified_checkpoint
    owner: primary
    classification: EXTERNAL_GATE
    commands:
      - repository_full_regression
      - browser_full_regression
      - docker_all_service_deployment
      - production_equivalent_mtls_and_asset_acl
      - real_case_shadow_privacy_scan
      - temporal_worker_kill_matrix
      - graph_postgresql_failover
      - evidence_100_file_load
      - 1000_room_load
      - soak_24h
      - dr_restore_and_failover
      - canary_observation

failure_classification:
  required_values: [PRODUCT, FIXTURE, INFRA, EXTERNAL_GATE]
  classify_before_rerun: true
  exactly_one_classification_per_failure: true
  PRODUCT:
    action: return_to_owner_and_block_dependent_batch
  FIXTURE:
    action: prove_contract_correct_fixture_and_rerun_exact_failed_scope
  INFRA:
