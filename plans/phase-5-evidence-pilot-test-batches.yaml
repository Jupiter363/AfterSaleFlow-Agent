batches:
  P5-BATCH-0:
    status: PASS
    tier: T1
    trigger: P5_0_contract_candidate_commit
    purpose: Authenticate the Phase 4 engineering handoff and ADR 0012 restrictions, then freeze the exact legacy Evidence baseline before implementation.
    requires:
      - phase_4_engineering_checkpoint_pass
      - PHASE_5_ENGINEERING_ONLY_permission
      - ADR_0012_accepted
      - evidence_v2_closed_contract_set_validated
      - public_evidence_submission_limit_remains_50
      - synthetic_manifest_counts_restricted_to_1_8_100
      - graph_016_recorded_as_phase_5_exit_evidence
      - asset_loader_restricted_to_java_signed_synthetic_capabilities
      - runtime_restricted_to_DISABLED_or_SIGNED_SYNTHETIC_SHADOW
      - protected_unrelated_worktree_changes_recorded
    asserts_pending_external_gates:
      - MIG-004
      - EVIDENCE_100_FILE_PRODUCT_API_UI_APPROVAL
      - PRODUCTION_ASSET_AUTHORIZATION
    source_commands:
      - id: p5_entry_static
        cwd: .
        report: static-phase5-entry-junit.xml
        resource_class: light_pytest
        command: >-
          D:\miniconda\python.exe -m pytest
          tests/static/test_phase5_evidence_contracts.py
          tests/static/test_phase5_evidence_pilot_plan.py
          tests/static/test_phase5_entry_contract_plan.py
          tests/static/test_phase5_entry_runner.py
          tests/static/test_phase5_entry_evidence.py
          tests/static/test_temporal_refactor_traceability.py
          tests/static/test_graph_import_boundaries.py
          tests/static/test_agent_platform_schema_contracts.py
          tests/static/test_phase4_no_formal_sink_assembly.py
          -q
      - id: p5_entry_python
        cwd: python-agent-service
        report: python-phase5-entry-junit.xml
        resource_class: light_pytest
        command: >-
          D:\miniconda\python.exe -m pytest
          tests/agents/test_evidence_clerk_turn.py
          tests/agents/test_evidence_fact_mapping_policy.py
          tests/evals/test_evidence_clerk_prompt_catalog.py
          tests/test_streaming.py
          tests/test_streaming_v2.py
          -q
      - id: p5_entry_java
        cwd: java-api-service
        report: java-phase5-entry-junit.xml
        resource_class: maven_test
        command: >-
          .\mvnw.cmd -DforkCount=1
          -Dtest=EvidenceApiIntegrationTest,EvidenceSubmissionServiceTest,EvidenceCompletionServiceTest,EvidenceAgentTurnServiceTest,EvidenceDossierFreezerTest,EvidenceWindowWorkflowTest,EvidenceWindowCoordinatorTest,EvidenceRoomControllerTest,EvidenceRoomIntegrationTest,EvidenceV2ContractFixtureTest,JdbcEpochBootstrapOutboxPublisherTest,TransactionalEpochAuthorityServiceTest,JdbcIntakePayloadAuthorityStoreTest,IntakeFormalSinkAssemblyTest
          test
      - id: p5_entry_frontend
        cwd: frontend
        report: frontend-phase5-entry-junit.xml
        resource_class: light_frontend_unit
        preflight:
