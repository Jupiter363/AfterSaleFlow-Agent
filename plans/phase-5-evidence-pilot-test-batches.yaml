schema_version: phase-test-batches.v1
phase: 5
name: evidence-pilot-engineering-shadow
document_status: ENGINEERING_EXCEPTION_ACCEPTED_AWAITING_PHASE4_CHECKPOINT

documents:
  execution_plan: plans/phase-5-evidence-pilot-execution.md
  contract_pack: docs/runbooks/temporal-first/phase-5-p5.0-contract-pack.md
  engineering_exception: docs/architecture/adr/0012-phase-5-evidence-engineering-exception.md
  source_plan: plans/temporal-langgraph-room-refactor.md
  acceptance_checklist: docs/acceptance/temporal-first-agent-platform-verification-checklist.md
  acceptance_manifest: tests/acceptance/temporal-first-check-manifest.yaml
  room_behavior_baseline: docs/acceptance/current-room-function-baseline.md

gate:
  contract_gate: P5.0
  contract_gate_status: NOT_RUN
  required_entry: PHASE_4_ENGINEERING_CHECKPOINT
  engineering_exception: ADR_0012_ACCEPTED
  observed_base_sha: 1191e0cc419515b5af835aa3e61e9fc976f8be42
  observed_entry_state:
    phase_4_engineering_checkpoint: NOT_RECORDED
    next_phase_permission: BLOCKED
    MIG-004: PENDING_PROMOTION
    product_100_file_approval: NOT_RECORDED
    fanout_bulkhead_evidence: PARTIAL_ENGINEERING
    authorized_asset_boundary: NOT_APPROVED_FOR_PHASE_5
  entry_decision: BLOCKED_PENDING_PHASE_4_ENGINEERING_CHECKPOINT
  contract_candidate_allowed_when:
    - PHASE_4_ENGINEERING_CHECKPOINT_PASS
    - PHASE_5_ENGINEERING_ONLY_PERMISSION_RECORDED
    - ADR_0012_ACCEPTED
  implementation_allowed_when:
    - PHASE_4_ENGINEERING_CHECKPOINT_PASS
    - PHASE_5_ENGINEERING_ONLY_PERMISSION_RECORDED
    - ADR_0012_ACCEPTED
    - P5_0_CONTRACT_CANDIDATE_COMMITTED
    - P5_0_BATCH_0_PASSED_ON_EXACT_CONTRACT_CANDIDATE_SHA
    - P5_0_ENTRY_EVIDENCE_COMMITTED
  external_promotion_gates:
    MIG-004: PENDING_PROMOTION
    evidence_100_file_product_api_ui_approval: PENDING_EXTERNAL_APPROVAL
    production_asset_authorization: PENDING_EXTERNAL_APPROVAL
    real_shadow_and_canary: FORBIDDEN
  engineering_scope:
    public_submission_limit: 50
    synthetic_manifest_item_counts: [1, 8, 100]
    asset_loading: JAVA_SIGNED_SYNTHETIC_CAPABILITY_ONLY
  runtime_modes_allowed: [LEGACY, DISABLED, SIGNED_SYNTHETIC_SHADOW]
  traffic_constraints:
    formal_evidence_graph_sink_allowed: false
    temporal_evidence_allocation_allowed: false
    real_case_shadow_allowed: false
    production_traffic_allowed: false
    canary_allowed: false
    promotion_allowed: false
    synthetic_fixtures_only: true
  invariants:
    - Java Evidence ledger remains the sole formal writer.
    - Temporal owns Evidence wait timer and party completion ordering only for a future admitted TEMPORAL epoch.
    - Graph results remain proposals and cannot merge freeze or open Hearing.
    - The public Evidence submission limit remains 50 until separate product API and UI approval.
    - Synthetic engineering manifests cover 1 8 and 100 items and room assessment concurrency is at most 8.
    - GRAPH-016 tenant and global bulkheads plus bounded queues are Phase 5 engineering exit evidence.
    - Production asset authorization remains external; engineering uses only Java-signed synthetic capabilities.
    - Hearing supplementation remains unchanged and capped at 50 files per party.
    - MIG-005 cannot pass from synthetic engineering evidence.
  gate_change_policy:
    - An upstream approval does not implicitly relax this matrix.
    - Every changed gate requires an amended candidate and a new exact-SHA checkpoint.
    - No implementation task may start before exact-SHA P5.0 entry evidence is committed.
    - External promotion gates cannot be relabeled as engineering entry evidence.

resources:
  active_primary_agents: 1
  logical_child_owners: 5
  max_active_child_agents: 5
  max_active_agents_total: 6
  execution_waves: 2
  heavy_test_slots: 1
  light_test_slots: 2
  pytest_db_workers: 1
  maven_fork_count: 1
  frontend_max_workers: 2
  docker_compose_owner: primary
  temporal_test_environment_owner: primary
  candidate_checkpoint_owner: primary
  heavy_resources:
    - maven_test
    - spring_context
    - postgresql
    - testcontainers
    - temporal_test_server
    - docker_compose
    - frontend_build
    - browser_or_playwright
    - repository_full_regression
    - load_or_soak
  child_forbidden_commands:
    - java_full_suite
    - python_full_suite
    - docker_compose_up_or_build
    - frontend_production_build
    - browser_or_playwright_suite
    - repository_full_regression
    - load_or_soak

test_token:
  required_for:
    - maven_test
    - spring_context
    - postgresql
    - testcontainers
    - temporal_test_server
    - docker_compose
    - browser_or_playwright
    - load_or_soak
  request_fields: [task_id, command, expected_duration, resource_class]
  grantor: primary
  max_heavy_tokens: 1

tiers:
  T0:
    owner: delegated_agent
    max_duration_seconds: 180
    services: none
    purpose: syntax schema pure reducer workflow domain and UI unit checks
  T1:
    owner: primary
    trigger: wave_a_merged
    purpose: deduplicated service-free Graph Workflow and Java authority checks
  T2:
    owner: primary
    trigger: wave_b_merged
    purpose: PostgreSQL Temporal recovery projection stream and synthetic parity integration
  T3:
    owner: primary
    trigger: explicit_unified_verification_checkpoint_only
    automatic: false
    purpose: full regression browser real shadow load soak failover DR and canary

