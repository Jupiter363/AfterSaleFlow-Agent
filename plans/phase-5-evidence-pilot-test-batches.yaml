    evidence_path: test-reports/temporal-first/phase-5-entry-20260723-e70492a1/phase-5-entry
    batch_0_result: PASS
    tests: 396
    engineering_execution: ALLOWED_WITH_DISABLED_JAVA_SIGNED_SYNTHETIC_SHADOW_RESTRICTIONS
    next_phase_permission: PHASE_5_ENGINEERING_ONLY
    phase_6_permission: FORBIDDEN
    promotion_gate: PENDING
    MIG-004: PENDING_PROMOTION
    MIG-005: PENDING_PROMOTION
  contract_candidate_allowed_when:
    - PHASE_4_ENGINEERING_CHECKPOINT_PASS
    - PHASE_5_ENGINEERING_ONLY_PERMISSION_RECORDED
    - ADR_0012_ACCEPTED
    - EVIDENCE_V2_CLOSED_CONTRACT_SET_VALIDATED
  implementation_allowed_when:
    - PHASE_4_ENGINEERING_CHECKPOINT_PASS
    - PHASE_5_ENGINEERING_ONLY_PERMISSION_RECORDED
    - ADR_0012_ACCEPTED
    - P5_0_CONTRACT_CANDIDATE_COMMITTED
    - P5_0_BATCH_0_PASSED_ON_EXACT_CONTRACT_CANDIDATE_SHA
    - P5_0_ENTRY_EVIDENCE_COMMITTED
  external_promotion_gates:
    MIG-004: PENDING_PROMOTION
    evidence_100_file_product_api_ui_approval: PENDING_EXTERNAL_APPROVAL
    production_asset_authorization: PENDING_EXTERNAL_APPROVAL
    real_shadow_and_canary: FORBIDDEN
  engineering_scope:
    public_submission_limit: 50
    synthetic_manifest_item_counts: [1, 8, 100]
    asset_loading: JAVA_SIGNED_SYNTHETIC_CAPABILITY_ONLY
  runtime_modes_allowed: [LEGACY, DISABLED, SIGNED_SYNTHETIC_SHADOW]
  traffic_constraints:
    formal_evidence_graph_sink_allowed: false
    temporal_evidence_allocation_allowed: false
    real_case_shadow_allowed: false
    production_traffic_allowed: false
    canary_allowed: false
    promotion_allowed: false
    synthetic_fixtures_only: true
  invariants:
    - Java Evidence ledger remains the sole formal writer.
    - Temporal owns Evidence wait timer and party completion ordering only for a future admitted TEMPORAL epoch.
    - Graph results remain proposals and cannot merge freeze or open Hearing.
    - The public Evidence submission limit remains 50 until separate product API and UI approval.
    - Synthetic engineering manifests cover 1 8 and 100 items and room assessment concurrency is at most 8.
    - GRAPH-016 tenant and global bulkheads plus bounded queues are Phase 5 engineering exit evidence.
    - Production asset authorization remains external; engineering uses only Java-signed synthetic capabilities.
    - Hearing supplementation remains unchanged and capped at 50 files per party.
    - MIG-005 cannot pass from synthetic engineering evidence.
  gate_change_policy:
    - An upstream approval does not implicitly relax this matrix.
    - Every changed gate requires an amended candidate and a new exact-SHA checkpoint.
    - No implementation task may start before exact-SHA P5.0 entry evidence is committed.
    - External promotion gates cannot be relabeled as engineering entry evidence.

