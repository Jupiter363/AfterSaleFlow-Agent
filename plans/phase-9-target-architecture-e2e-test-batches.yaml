schema_version: phase-test-batches.v1
phase: 9
name: target-architecture-isolated-preproduction-e2e
document_status: P9_0_CONTRACT_FREEZE_CANDIDATE

documents:
  execution_plan: plans/phase-9-target-architecture-e2e-execution.md
  adr: docs/architecture/adr/0017-target-architecture-preproduction-e2e.md
  contract_pack: docs/runbooks/temporal-first/phase-9-p9.0-contract-pack.md
  phase8_checkpoint: docs/runbooks/temporal-first/phase-8-engineering-checkpoint.md
  activation_schema: contracts/agent-platform/target-e2e/v1/target-e2e-activation-manifest.schema.json
  validation_policy: contracts/agent-platform/target-e2e/v1/activation-validation-policy.v1.json
  command_envelope_schema: contracts/agent-platform/target-e2e/v1/target-e2e-graph-command-envelope.schema.json
  result_envelope_schema: contracts/agent-platform/target-e2e/v1/target-e2e-graph-result-envelope.schema.json
  finalization_receipt_schema: contracts/agent-platform/target-e2e/v1/target-e2e-finalization-receipt.schema.json
  synthetic_fixture_schema: contracts/agent-platform/target-e2e/v1/target-e2e-synthetic-fixture-set.schema.json
  isolated_domain_db_binding_schema: contracts/agent-platform/target-e2e/v1/target-e2e-isolated-domain-db-binding.schema.json
  room_proposal_source_schema: contracts/agent-platform/target-e2e/v1/target-e2e-room-proposal-source.schema.json
  static_contract_test: tests/static/test_phase9_target_e2e_contract.py

gate:
  contract_gate: P9.0
  status: NOT_RUN
  implementation_policy: DEFAULT_OFF_IMPLEMENTATION_ALLOWED_ACTIVATION_BLOCKED
  runtime_activation: BLOCKED
  execution_lane: TARGET_E2E_CANDIDATE
  environment_class: ISOLATED_PREPRODUCTION
  accepted_phase8_engineering_checkpoint: 654d92201254b36a7a10da4a3cdb29ebec6c5fc0
  phase8_engineering_candidate: 9233f9b489dff7d9624f2b0f21369d349f104cca
  phase8_engineering_evidence: df97e398f03552bd6689b77925f7af6386fa7e16
  production_checkpoint: PENDING_EXTERNAL
  promotion_gate: PENDING
  migration_gates:
    MIG-003: PENDING_PROMOTION
    MIG-004: PENDING_PROMOTION
    MIG-005: PENDING_PROMOTION
    MIG-006: PENDING_PROMOTION
    MIG-007: PENDING_PROMOTION
    MIG-008: PENDING_PROMOTION
  production_defaults:
    formal_case_selector: LEGACY
    target_e2e_activation: DISABLED
  maximum_success:
    P9.0: PASS
    target_architecture_preproduction_e2e: PASS
    next_permission: SEPARATELY_AUTHORIZED_EXTERNAL_PRODUCTION_CHECKPOINT_ONLY
  forbidden_claims:
    - PRODUCTION_CHECKPOINT_PASS
    - PRODUCTION_READY
    - CANARY_AUTHORIZED
    - PROMOTION_AUTHORIZED
    - MIGRATION_PROMOTED
    - V047_AUTHORIZED

authority:
  temporal: PROCESS_ORDER_WAITS_TIMERS_RETRY_CANCEL_COMPENSATION
  graph: PROPOSAL_ONLY
  graph_domain_credentials: FORBIDDEN
  graph_domain_write_allowed: false
  formal_writer: JAVA_FINALIZER_ONLY
  java_domain_commit_allowed: BOUND_ISOLATED_DOMAIN_DATABASE_ONLY
  external_effects_allowed: false
  production_traffic_allowed: false
  frontend: PRESENTATION_AND_COMMAND_SUBMISSION_ONLY
  room_types: [INTAKE, EVIDENCE, HEARING, REVIEW]
  projections_not_room_types: [DRAFT, OUTCOME]

activation:
  contract_version: target-e2e-activation.v1
  activation_id_pattern: '^p9act\.v1\.[0-9a-f]{32}$'
  maximum_lifetime_seconds: 2592000
  future_issued_at_tolerance_seconds: 0
  replay_identity: [environmentId, environmentGeneration, activationId, nonce, manifestHash]
  unique_grant_keys: [activationId, nonce]
  replay_operation: ATOMIC_REGISTER_OR_ATTACH_IDENTICAL
  identical_replica_result: ATTACHED_EXISTING
  conflicting_replay_result: REJECT_NONCE_REPLAY_OR_BINDING_CONFLICT
  case_scope_modes: [EXPLICIT_CASE_IDS, ISOLATED_SYNTHETIC_NEW_CASES]
  synthetic_new_case:
    exact_prefix_required: true
    maximum_cases: 16
    wildcard_allowed: false
    reservation: ATOMIC_BEFORE_FIRST_EPOCH_SELECTION
    fixture_hash: SHA256_RFC8785_FULL_CONFIGURED_READ_ONLY_SCHEMA_VALIDATED_BYTES
    generated_case_id_unique_scope: GLOBAL
    tombstone: DURABLE_NEVER_REASSIGN
    cross_activation_or_concurrent_slot_reuse: REJECT
  environment_generation:
    durable_high_water_scope: PER_ENVIRONMENT_ID
    first_registration: STRICTLY_GREATER_THAN_HIGH_WATER
    update: ATOMIC_WITH_ACTIVATION_REGISTRATION
    identical_replica_at_high_water: ALLOW
    same_generation_different_grant: REJECT_CONFLICT
    lower_generation: REJECT_STALE
  physical_database_isolation:
    cluster_identity_must_differ: true
    database_identity_must_differ: true
    principal_difference_alone_sufficient: false
  preferred_transport: READ_ONLY_MOUNTED_FILE
  bootstrap_header: X-AfterSaleFlow-Target-E2E-Activation
  graph_endpoint_header_allowed: false
  per_command_manifest_allowed: false
  compact_jws:
    algorithm: ES256
    typ: target-e2e-activation+jwt
    payload: FULL_RFC8785_CANONICAL_MANIFEST
  rejection_matrix:
    - EXPIRED
    - LIFETIME_OVER_2_HOURS
    - FUTURE_ISSUED_AT
    - NONCE_REPLAY
    - WRONG_ENVIRONMENT_OR_GENERATION
    - WRONG_CANDIDATE_SHA
    - WRONG_LANE_OR_CONTRACT_VERSION
    - WRONG_CASE_CONTROL_AGENT_BUILD
    - WRONG_GRAPH_KEY_VERSION_CHECKPOINT_BINDING_HASH_OR_CODE_BUILD
    - WRONG_IMAGE_DIGEST
    - WRONG_TEMPORAL_NAMESPACE
    - WRONG_DOMAIN_OR_GRAPH_DATABASE_IDENTITY
    - DOMAIN_GRAPH_CLUSTER_OR_DATABASE_COLLISION
    - WRONG_SYNTHETIC_FIXTURE_BYTES_OR_HASH
    - GENERATED_CASE_ID_GLOBAL_TOMBSTONE_CONFLICT
    - ENVIRONMENT_GENERATION_NOT_ABOVE_HIGH_WATER
    - WRONG_TENANT_ROOM_CASE_OR_SYNTHETIC_SCOPE

graph_command:
  embedded_contract: room-graph-command.v1
  wrapper_contract: target-e2e-graph-command-envelope.v1
  wrapper_members: [schema_version, execution_lane, activation_id, room_fencing_token, command_hash, command_envelope_hash, command]
  embedded_contract_mutation_allowed: false
  command_hash: SHA256_RFC8785_FULL_COMMAND_INCLUDING_VERIFIED_REQUEST_HASH
  command_envelope_hash: SHA256_RFC8785_WRAPPER_OMITTING_ONLY_COMMAND_ENVELOPE_HASH
  compact_jws_typ: target-e2e-graph-command+jwt
  additional_signed_claims: [execution_lane, activation_id, room_fencing_token, command_hash, command_envelope_hash]
  room_fence_authority: JAVA_SIGNED_DOMAIN_ROOM_FENCE
  graph_lease_fence_authority: GRAPH_RUNTIME_LOCAL_CHECKPOINT_LEASE
  room_fence_is_graph_lease_fence: false
  both_fences_verified_before_checkpoint_mutation: true
  activation_jws_as_bearer: FORBIDDEN
  result_hash: EQUALS_NESTED_OUTPUT_HASH_SHA256_RFC8785_RESULT_OMITTING_ONLY_OUTPUT_HASH
  proposal_hash: SHA256_RFC8785_EXACT_ROOM_SPECIFIC_PROPOSAL
  result_envelope_hash: SHA256_RFC8785_WRAPPER_OMITTING_ONLY_RESULT_ENVELOPE_HASH
  finalization_receipt_hash: SHA256_RFC8785_RECEIPT_OMITTING_ONLY_RECEIPT_HASH
  finalization_receipt_status: COMMITTED
  immutable_replay: RETURN_ORIGINAL_RECEIPT_EXACT_BYTES_AND_HASH
  hash_sources:
    agent_run_manifest_hash: AGENT_EXECUTION_MANIFEST_V1_POINTER_ROOT_FULL_RFC8785
    isolated_domain_db_binding_hash: TARGET_E2E_DB_BINDING_POINTER_ROOT_OMIT_ONLY_BINDING_HASH
    proposal_hash: TARGET_E2E_ROOM_PROPOSAL_SOURCE_POINTER_PROPOSAL_FULL_RFC8785

resources:
  maximum_light_processes: 2
  maximum_maven_testcontainers_processes: 2
  maven_fork_count: 1
  browser_processes_at_unified_checkpoint: 1
  repeated_full_suite_during_slices: false
  docker_or_browser_before_unified_checkpoint: false

slices:
  P9-S1:
    name: ACTIVATION_TRUST_AND_ISOLATION
    requires: [P9_CONTRACT_FREEZE_REVIEWED]
    exit: [ALL_BINDING_NEGATIVES_FAIL_CLOSED, DEFAULTS_LEGACY_DISABLED, GRAPH_DOMAIN_ACCESS_DENIED]
  P9-S2:
    name: TEMPORAL_CONTROL_AND_TYPED_ROOMS
    requires: [P9-S1_CONTRACTS_PUBLISHED]
    exit: [FOUR_TYPED_ROOMS_REPLAY_GREEN, STALE_FENCE_REJECTED, NO_LEGACY_EXECUTOR_FOR_TARGET_EPOCH]
  P9-S3:
    name: PROPOSAL_ONLY_GRAPH_EXECUTION
    requires: [P9-S1_ACTIVATION_ID_AVAILABLE, P9-S2_COMMAND_WRAPPER_AVAILABLE]
    exit: [FOUR_EXACT_GRAPH_BINDINGS, ROOM_AND_LEASE_FENCE_VERIFIED_BEFORE_CHECKPOINT, CHECKPOINT_RECOVERY_GREEN, NO_DOMAIN_CREDENTIAL_OR_FORMAL_SINK]
  P9-S4:
    name: JAVA_FINALIZATION_AND_BROWSER_FLOW
    requires: [P9-S2_HANDOFF_STABLE, P9-S3_RESULT_ENVELOPE_STABLE]
    exit: [TARGET_ONLY_OUTER_RECEIPT_ADAPTER_NOT_DEFAULT_DISCOVERABLE, JAVA_TRANSACTION_ONLY, REPLAY_ORIGINAL_RECEIPT_EXACT_BYTES_AND_HASH, DIFFERENT_HASH_CONFLICT, BROWSER_READS_JAVA_PROJECTION]
  P9-S5:
    name: RECOVERY_DRAIN_AND_UNIFIED_EVIDENCE
    requires: [P9-S1_PASS, P9-S2_PASS, P9-S3_PASS, P9-S4_PASS, ALL_P0_CLOSED]
    exit: [UNIFIED_BATCH_4_PASS, ACTIVATION_REVOKED_TERMINAL_AFTER_DRAINED, ZERO_UNRESOLVED_LEDGER_ROWS]

batches:
  batch_0_contract:
    status: RUNNABLE_CONTRACT_ONLY
    resource_class: light
    exact_clean_candidate_required: true
    commands:
      - id: phase9_contract_static
        cwd: .
        command: >-
          D:\miniconda\python.exe -m pytest -q
          tests/static/test_phase9_target_e2e_contract.py
          -p no:cacheprovider --tb=short
      - id: phase9_json_yaml_parse
        cwd: .
        command: >-
          D:\miniconda\python.exe -c
          "import json,pathlib,yaml;
          [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('contracts/agent-platform/target-e2e').rglob('*.json')];
          yaml.safe_load(pathlib.Path('plans/phase-9-target-architecture-e2e-test-batches.yaml').read_text(encoding='utf-8'))"
    required_result: CONTRACT_GREEN_WITH_RUNTIME_ACTIVATION_STILL_BLOCKED

  batch_1_foundation_focused:
    status: PLANNED_AFTER_IMPLEMENTATION
    maximum_parallel_light: 2
    maximum_parallel_heavy: 1
    selectors:
      java:
        - TargetE2EActivationManifestTest
        - TargetE2EActivationLedgerIntegrationTest
        - TargetE2EActivationConfigurationTest
        - TargetE2EGraphEnvelopeSignerTest
        - TargetE2EDatabaseSeparationTest
      python:
        - python-agent-service/tests/graph_runtime/test_target_e2e_envelope.py
        - python-agent-service/tests/security/test_target_e2e_activation.py
      static:
        - tests/static/test_phase9_target_e2e_contract.py
        - tests/static/test_graph_import_boundaries.py
    assertions:
      - ABSENT_EXPIRED_FUTURE_OVERLONG_REPLAYED_OR_MISMATCHED_ACTIVATION_FAILS_STARTUP
      - MEASURED_RUNTIME_BINDINGS_MATCH_MANIFEST_EXACTLY
      - ACTIVATION_JWS_NEVER_REACHES_GRAPH_ENDPOINT
      - GRAPH_RUNTIME_HAS_NO_DOMAIN_DATABASE_PRIVILEGE

  batch_2_room_verticals_focused:
    status: PLANNED_AFTER_IMPLEMENTATION
    maximum_parallel_light: 2
    maximum_parallel_heavy: 2
    java_selectors:
      - TargetE2ECaseProcessWorkflowTest
      - TargetE2ETypedRoomDispatchTest
      - TargetE2EAgentRunV2IntegrationTest
      - TargetE2EIntakeFinalizerIntegrationTest
      - TargetE2EEvidenceFinalizerIntegrationTest
      - TargetE2EHearingFinalizerIntegrationTest
      - TargetE2EOutcomeFinalizerIntegrationTest
    python_paths:
      - python-agent-service/tests/graphs/intake/test_target_e2e.py
      - python-agent-service/tests/graphs/evidence/test_target_e2e.py
      - python-agent-service/tests/graphs/hearing/test_target_e2e.py
      - python-agent-service/tests/graphs/outcome/test_target_e2e.py
    frontend_paths:
      - frontend/src/views/disputes/TargetE2EFlow.test.js
    assertions:
      - ALL_FOUR_ROOM_EPOCHS_TEMPORAL
      - ALL_GRAPH_OUTPUTS_PROPOSAL_ONLY
      - JAVA_FINALIZER_ONLY_FORMAL_WRITER
      - NO_LEGACY_OR_SHADOW_RELABELING

  batch_3_recovery_focused:
    status: PLANNED_AFTER_IMPLEMENTATION
    isolated_postgresql_required: true
    temporal_test_environment_required: true
    scenarios:
      - PYTHON_RESTART_AFTER_CHECKPOINT
      - AGENT_WORKER_RESTART_AFTER_MODEL_BEFORE_FINALIZER
      - JAVA_RESTART_AFTER_DOMAIN_COMMIT_BEFORE_RESPONSE
      - DUPLICATE_COMMAND_SAME_HASH_RETURNS_IDENTICAL_RECEIPT
      - DUPLICATE_COMMAND_DIFFERENT_HASH_CONFLICTS
      - STALE_EPOCH_REVISION_OR_FENCE_REJECTED
      - ACTIVATION_EXPIRY_STOPS_NEW_ADMISSION_BUT_DRAINS_ACCEPTED_WORK
    required_result: ZERO_DUPLICATE_COGNITION_DOMAIN_FACT_OR_EXTERNAL_EFFECT

  batch_4_unified_isolated_e2e:
    status: BLOCKED_UNTIL_P9_S1_TO_S5_AND_ALL_P0_CLOSED
    unified_checkpoint: true
    one_candidate_sha: true
    one_activation_id_and_nonce: true
    one_environment_generation: true
    one_build_and_image_set: true
    one_temporal_namespace: true
    one_domain_graph_database_pair: true
    stop_on_first_failure: true
    sequence:
      - PROVE_DEFAULT_DISABLED_WITHOUT_MANIFEST
      - REGISTER_MANIFEST_ATTACH_IDENTICAL_REPLICAS_THEN_REJECT_CONFLICTING_REPLAY
      - BROWSER_CREATE_OR_IMPORT_ALLOWLISTED_CASE
      - COMPLETE_INTAKE_EVIDENCE_HEARING_REVIEW_OUTCOME_CLOSURE_EVALUATION
      - EXECUTE_THREE_COMMIT_RECOVERY_WINDOWS
      - RECONNECT_SSE_AND_RELOAD_FROM_JAVA_PROJECTIONS
      - RUN_DATABASE_TEMPORAL_GRAPH_SECURITY_ASSERTIONS
      - EXPIRE_TO_DRAIN_ONLY_CONTINUE_ONLY_PREEXPIRY_COMMANDS_DRAIN_THEN_REVOKE_TERMINAL
    required_result:
      engineering_checkpoint: TARGET_ARCHITECTURE_PREPRODUCTION_E2E_PASS
      production_checkpoint: PENDING_EXTERNAL
      promotion_gate: PENDING
      migrations: PENDING_PROMOTION

database_assertions:
  activation_control:
    - EXACTLY_ONE_ROW_PER_ENVIRONMENT_GENERATION_ACTIVATION_NONCE_IDENTITY
    - EXACT_MANIFEST_HASH_CANDIDATE_BUILD_IMAGE_GRAPH_NAMESPACE_AND_DATABASE_BINDINGS
    - DURABLE_ENVIRONMENT_GENERATION_HIGH_WATER_EQUALS_CANDIDATE_GENERATION
    - LIFECYCLE_REGISTERED_ACTIVE_DRAIN_ONLY_DRAINED_REVOKED_TERMINAL_IN_ORDER
    - EXACTLY_ONE_REGISTRATION_ROW_AND_ZERO_DUPLICATE_CONSUMPTION_ROWS
    - SYNTHETIC_GENERATED_CASE_IDS_EXACT_PREFIX_AND_ATOMIC_SLOT_BEFORE_FIRST_EPOCH
    - SYNTHETIC_CASE_SLOT_COUNT_AT_MOST_SIGNED_MAXIMUM_16
    - SYNTHETIC_FIXTURE_CANONICAL_BYTES_HASH_EQUALS_MANIFEST_AND_MEASURED_CONTEXT
    - GENERATED_CASE_ID_GLOBAL_TOMBSTONE_SURVIVES_REVOKE
    - ZERO_CROSS_ACTIVATION_OR_CONCURRENT_DIFFERENT_SLOT_CASE_ID_REUSE
  domain:
    - CASE_ROOM_EPOCH_EXACT_SET_INTAKE_EVIDENCE_HEARING_REVIEW
    - ALL_TARGET_EPOCHS_TEMPORAL_READY_OR_TERMINAL_WITH_NON_NULL_WORKFLOW_RUN_AND_BUILD_IDS
    - MONOTONIC_FENCES_AND_HIGHEST_PROCESS_PROJECTION_REVISION
    - CASE_COMMAND_AND_OUTBOX_ZERO_NONTERMINAL_OR_DEAD_LETTER
    - ROOM_EPOCH_BOOTSTRAP_OUTBOX_ALL_DELIVERED
    - AGENT_RUN_V2_TEMPORAL_ACTIVITY_AGENT_STREAM_V2_ONLY
    - ONE_TERMINAL_RESULT_MANIFEST_AND_JAVA_FINALIZATION_PER_LOGICAL_RUN
    - ZERO_LEGACY_WORKER_RUNS_FOR_TARGET_CASE
    - INTAKE_EVIDENCE_HEARING_REVIEW_OUTCOME_RECEIPT_CHAIN_HASHES_MATCH
    - RECEIPT_AGENT_RUN_MANIFEST_DB_BINDING_AND_FOUR_ROOM_PROPOSAL_HASH_SOURCES_MATCH
    - RECEIPT_REPLAY_RETURNS_ORIGINAL_COMMITTED_BYTES_AND_HASH
    - ZERO_DUPLICATE_FORMAL_MESSAGE_ARTIFACT_DECISION_OPERATION_RECEIPT_CLOSURE_OR_EVALUATION
  graph:
    - EXACT_REGISTRY_KEY_VERSION_CHECKPOINT_BINDING_HASH_AND_CODE_BUILD_ID
    - COMMAND_ATTEMPT_RESULT_AND_CHECKPOINT_CAUSAL_HASHES_MATCH
    - EVERY_ROW_BINDS_TARGET_E2E_LANE_AND_ACTIVATION_ID
    - EVERY_COMMAND_RESULT_AND_RECEIPT_BINDS_CURRENT_JAVA_ROOM_FENCING_TOKEN
    - ROOM_FENCE_AND_DISTINCT_GRAPH_LEASE_FENCE_VERIFIED_BEFORE_CHECKPOINT_MUTATION
    - ZERO_UNRESOLVED_COMMAND_ACTIVE_LEASE_HASH_CONFLICT_OR_CROSS_SCOPE_THREAD
  privileges:
    - DOMAIN_AND_GRAPH_CLUSTER_IDENTITIES_PHYSICALLY_DIFFERENT
    - DOMAIN_AND_GRAPH_DATABASE_IDENTITIES_PHYSICALLY_DIFFERENT
    - PRINCIPAL_DIFFERENCE_ALONE_NOT_ACCEPTED_AS_ISOLATION
    - GRAPH_PRINCIPAL_ZERO_DOMAIN_CONNECT_SCHEMA_TABLE_SEQUENCE_OR_FUNCTION_PRIVILEGE
    - JAVA_DOMAIN_PRINCIPAL_ZERO_GRAPH_CHECKPOINT_OR_LEDGER_WRITE_PRIVILEGE
  temporal:
    - EXACT_NAMESPACE_BUILD_WORKFLOW_RUN_AND_TYPED_CHILD_IDS
    - ZERO_STUCK_TASK_UPDATE_SIGNAL_OR_ACTIVITY
    - HISTORY_CONTAINS_ONLY_BOUNDED_REFS_HASHES_REVISIONS_EPOCHS_FENCES_AND_DEADLINES

retry_policy:
  classify_before_retry: true
  classifications: [PRODUCT, FIXTURE, INFRA, CONTRACT, EXTERNAL_GATE]
  same_candidate_retry_allowed_only_for: INFRA
  preserve_all_attempts: true
  mix_candidate_environment_activation_build_image_namespace_database_or_attempt: false

drain_policy:
  lifecycle: [REGISTERED, ACTIVE, DRAIN_ONLY, DRAINED, REVOKED_TERMINAL]
  expiry_transition: ACTIVE_TO_DRAIN_ONLY
  new_admission_in_drain_only: false
  replica_attach_in_drain_only: PREEXPIRY_DURABLY_ADMITTED_COMMAND_ONLY
  drained_accepts_or_executes_work: false
  revoke_preconditions: [ZERO_UNRESOLVED_ACCEPTED_WORK, ALL_REPLICAS_DETACHED, EVIDENCE_SEALED, DRAINED_AT_RECORDED]
  terminal_state: REVOKED_TERMINAL
  timestamp_order: EXPIRES_AT_LE_DRAIN_ONLY_AT_LE_DRAINED_AT_LT_REVOKED_AT
  legacy_fallback_inside_active_epoch: false
  in_place_manifest_renewal: false
  failed_drain: SUSPEND_AT_SAFE_BOUNDARY_AND_REQUIRE_MANUAL_RECONCILIATION
  retry_requires: [NEW_ACTIVATION_ID, NEW_NONCE, HIGHER_ENVIRONMENT_GENERATION, NEW_SIGNATURE]
