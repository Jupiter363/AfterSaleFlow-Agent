  - sequence: 14
    code: HUMAN_REVIEW_OPEN
    owner: SYSTEM
    party_wait: false
    graph_operation: null
    completion_receipt: IDEMPOTENT_REVIEW_HANDOFF
  - sequence: 15
    code: CLOSED
    owner: SYSTEM
    party_wait: false
    graph_operation: null
