      - id: python_phase6_entry
        cwd: python-agent-service
        resource_class: light
        report: python-phase6-entry.xml
        report_kind: PYTEST_JUNIT
        command: >-
          D:\miniconda\python.exe -m pytest -q tests/agents/test_hearing_flow_v2.py
