        report_kind: VITEST_JUNIT
        command: >-
          node node_modules/vitest/vitest.mjs run
          src/views/disputes/HearingCourtView.test.js
          src/utils/hearingFlow.test.js
          src/api/hearing.test.js
          --reporter=default --reporter=junit
          --outputFile.junit={raw_report}
    execution_manifest:
      filename: phase6-entry-execution-manifest.json
      schema_version: phase6-entry-execution-manifest.v1
      seal: SHA256_CANONICAL_JSON_EXCLUDING_MANIFEST_SHA256
      ordered_source_prefix_required_on_resume: true
      source_report_hashes_required: true
      stdout_stderr_hashes_required: true
      candidate_unchanged_before_and_after_every_source: true
      terminal_green_status: SOURCE_SUITES_GREEN_AWAITING_SEPARATE_ENTRY_EVIDENCE
      forbidden_statuses: [P6_0_PASS, IMPLEMENTATION_AUTHORIZED, MIG_006_PASS]
    retry_policy:
