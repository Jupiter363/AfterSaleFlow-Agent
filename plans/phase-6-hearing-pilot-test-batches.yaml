          -Dtest=HearingFlowRuntimeServiceTest,HearingFlowPersistenceContractTest,HearingTrialDossierServiceTest,HearingReviewHandoffServiceTest
          -Dsurefire.reportNameSuffix={report_suffix} test
      - id: frontend_phase6_entry
