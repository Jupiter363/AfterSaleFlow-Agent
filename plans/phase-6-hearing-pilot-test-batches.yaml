task_dag:
  P6-R0:
    description: Freeze approved contract candidate after upstream authorization.
    requires: [UPSTREAM_AUTHORIZATION]
    result: CONTRACT_CANDIDATE_COMMIT
  P6-R1:
    description: Run all Batch 0 source suites from exact clean detached candidate SHA.
    requires: [P6-R0]
    result: IMMUTABLE_BATCH_0_REPORTS
  P6-R2:
    description: Commit entry evidence and P6.0 decision separately.
    requires: [P6-R1]
    result: P6_0_PASS_OR_BLOCKED
  P6-A1:
    description: Implement four explicit Hearing graph families and registry identities.
    requires: [P6-R2_PASS]
  P6-B1:
    description: Implement deterministic 15-stage Hearing child Workflow contract.
    requires: [P6-R2_PASS]
  P6-C1:
    description: Implement additive V044 and Java mode/fence/receipt foundation.
    requires: [P6-R2_PASS]
  P6-D1:
    description: Split side-effect-free query projection and preserve API/UI baseline.
    requires: [P6-R2_PASS]
  P6-E1:
    description: Implement signed synthetic comparison and scheduler detector controls.
    requires: [P6-R2_PASS]
  P6-A2:
    description: Add bounded evidence Send/reducer and checkpoint recovery.
    requires: [P6-A1, P6-C1]
  P6-B2:
    description: Add two waits deadlines signals receipts and AgentRun ordering.
    requires: [P6-B1, P6-C1]
  P6-C2:
    description: Split action ledger Finalizers projection and decision-chain receipts.
    requires: [P6-C1]
  P6-D2:
    description: Verify privacy history route and unchanged six-group presentation.
    requires: [P6-D1, P6-C2]
  P6-E2:
    description: Add kill replay parity metrics reconciliation and rollback harness.
    requires: [P6-E1, P6-A2, P6-B2, P6-C2]
  P6-R3:
    description: Freeze and run one Phase 6 engineering candidate checkpoint.
    requires: [P6-A2, P6-B2, P6-C2, P6-D2, P6-E2]

