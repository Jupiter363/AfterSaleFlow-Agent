    - Keep formal Hearing allocation LEGACY and new Phase 6 runtime DISABLED.
    - Stop signed synthetic commands and fence nonterminal Graph leases.
    - Preserve V035 facts and any additive V044 or comparison rows.
    - Re-run mode no-formal-sink privacy stage-order and side-effect-free query gates.
  future_temporal:
    - Set new Hearing cohort allocation to zero without changing active epoch mode.
    - Keep active TEMPORAL Hearings pinned to compatible workers until terminal.
    - Never return an active flow to Java or regenerate dossier V1 Jury V2 or handoff.
    - Reconcile History revision and Java receipts before resuming.

