  phase_5_evidence_sha: 8770d84aac4f653e8953d469246295b6e8c3b8fa
  required_entry: PHASE_5_ENGINEERING_CHECKPOINT_AND_ADR_0015
  observed_entry_state:
    phase_5_engineering_checkpoint: PASS
    phase_6_engineering_exception: ADR_0015_ACCEPTED_FOR_ENGINEERING_ONLY
    next_phase_permission: PHASE_6_ENGINEERING_ONLY
    MIG-004: PENDING_PROMOTION
    MIG-005: PENDING_PROMOTION
    P6.0: PASS
    MIG-006: PENDING_PROMOTION
  entry_decision: ENTRY_EVIDENCE_ACCEPTED
  product_implementation: ALLOWED_UNDER_ADR_0015_ENGINEERING_RESTRICTIONS
  implementation_allowed_when:
    - PHASE_5_ENGINEERING_CHECKPOINT_PASS
    - ADR_0015_ACCEPTED_FOR_ENGINEERING_ONLY
    - PHASE_6_ENGINEERING_ONLY_PERMISSION_RECORDED
    - P6_0_CONTRACT_CANDIDATE_COMMITTED
    - P6_0_BATCH_0_PASSED_ON_EXACT_CONTRACT_CANDIDATE_SHA
    - P6_0_ENTRY_EVIDENCE_COMMITTED
  exception_constraints:
    - ADR_0015_CANNOT_MARK_MIG_004_MIG_005_OR_MIG_006_PASS
    - AN_EXCEPTION_ALLOWS_ONLY_DISABLED_OR_JAVA_SIGNED_SYNTHETIC_SHADOW
    - AN_EXCEPTION_CANNOT_AUTHORIZE_REAL_DATA_FORMAL_SINK_OR_TEMPORAL_ALLOCATION
  two_commit_gate:
    commit_1: P6_0_CONTRACT_CANDIDATE
    exact_sha_batch: BATCH_0_ALL_FOUR_SUITES
    commit_2: P6_0_ENTRY_EVIDENCE
    implementation_after: COMMIT_2_RECORDS_P6_0_PASS
    mixed_product_implementation_in_commit_1: false
    reuse_reports_from_another_sha: false
  runtime_modes_allowed_now: [LEGACY, DISABLED, SIGNED_SYNTHETIC_SHADOW]
  runtime_modes_forbidden_now: [REAL_CASE_SHADOW, TEMPORAL]
  traffic_constraints:
    formal_hearing_graph_sink_allowed: false
    temporal_hearing_allocation_allowed: false
    real_case_shadow_allowed: false
    active_v035_in_place_migration_allowed: false
    production_traffic_change_allowed: false
    canary_allowed: false
    promotion_allowed: false
    synthetic_fixtures_only_for_new_runtime: true
    hearing_ui_behavior_change_allowed: false
  invariants:
    - Java Hearing action artifact dossier decision and handoff ledgers remain the sole formal writers.
    - Temporal may own stage ordering timers retry and failure only for a future admitted TEMPORAL epoch.
    - Graph output remains a proposal and cannot advance stage open review handoff or close Hearing.
    - Party waits remain in Temporal and never use a long-lived LangGraph interrupt.
    - Shared Hearing Graph accepts only Java-authorized formal Artifact references.
    - V035 action and artifact append-only constraints remain intact.
    - V044__hearing_temporal_projection.sql is reserved and absent before accepted P6.0 entry evidence.
    - Existing Hearing API and UI baseline is preserved.
    - MIG-006 cannot pass from synthetic engineering evidence.
  gate_change_policy:
    - An upstream checkpoint or exception does not implicitly pass P6.0.
    - Every changed gate requires an amended contract candidate and a new exact-SHA Batch 0.
    - No implementation owner starts before the separate P6.0 entry-evidence commit.

