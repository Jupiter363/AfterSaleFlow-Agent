          - java-api-service/src/main/java/com/example/dispute/evidence/application/graph/EvidenceFinalizationReceipt.java
        output_contracts:
          - activity retries consume committed Java receipts and reject stale epoch or fence
          - cancellation and lost-response recovery never infer a formal commit from Workflow history alone
        owned_files:
