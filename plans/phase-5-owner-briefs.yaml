            workdir: java-api-service
            argv: [./mvnw.cmd, -q, "-Dtest=EvidenceAssetAuthorizationTest,JdbcEvidenceGraphBindingStoreTest", test]
            resource_class: maven_test
            test_token_required: true
            max_duration_seconds: 180
        commit_definition_of_done:
          - Only P5-C1 owned_files are staged and no prior migration changes.
          - Signed synthetic capabilities reject wrong owner visibility object version hash epoch fence expiry and nonce.
          - Binding writes are additive and idempotent while formal execution remains disabled.
          - Token-granted T0 passes and A records P0 review closure.
          - Commit SHA migration checksum and test-token release are returned to R.
      P5-C2:
        initial_parallel: false
        depends_on: [P5-A1, P5-B1, P5-C1]
        input_contracts:
          - contracts/agent-platform/evidence/v2/evidence-terminal-proposal.schema.json
          - contracts/agent-platform/evidence/v2/evidence-finalization-receipt.schema.json
        output_contracts:
          - Java Finalizer validates complete manifest coverage and performs one idempotent ACID merge behind a disabled formal-sink gate
          - committed receipt is the only authority B may use to advance freeze or transition ordering
        owned_files:
