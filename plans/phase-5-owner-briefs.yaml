test_token_policy:
  grantor: R
  max_concurrent_heavy_tokens: 1
  request_fields: [task_id, command_id, expected_duration_seconds, resource_class]
  required_resource_classes:
    - maven_test
    - spring_context
    - postgresql
    - testcontainers
    - temporal_test_server
    - docker_compose
    - browser_or_playwright
    - load_or_soak
  rules:
    - A delegated owner may run token-free T0 commands only from its own brief.
    - A Maven test remains token-controlled even when it is a focused service-free unit test.
    - T1 and T2 commands are deduplicated and run by R at the declared integration checkpoint.
    - Full regression browser Docker real shadow load soak failover DR and canary are not delegated.
    - A granted token is released immediately after its single declared command exits.
    - A failed command is classified before any same-SHA retry; PRODUCT blocks dependent work.

wave_a_parallel_launch:
  status: READY
  simultaneously_active_tasks: [P5-A1, P5-B1, P5-C1, P5-D0, P5-E0]
  exact_write_sets_must_be_disjoint: true
  owner_count: 5
  initial_review_pairs:
