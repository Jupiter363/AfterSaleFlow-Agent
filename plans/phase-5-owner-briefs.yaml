          - java-api-service/src/test/java/com/example/dispute/workflow/room/evidence/EvidenceRoomWorkflowTest.java
          - java-api-service/src/test/java/com/example/dispute/workflow/room/evidence/EvidenceRoomWorkflowReplayTest.java
        t0_commands:
          - id: B1_MAVEN_TEST
            workdir: java-api-service
            argv: [./mvnw.cmd, -q, "-Dtest=EvidenceRoomWorkflowTest,EvidenceRoomWorkflowReplayTest", test]
            resource_class: maven_test
            test_token_required: true
            max_duration_seconds: 180
        commit_definition_of_done:
          - Only P5-B1 owned_files are staged.
          - Workflow code contains no repository HTTP model or system-time access.
          - Deadline duplicate signal warning boundary and replay tests exist.
          - Token-granted T0 passes and E records P0 review closure.
          - Commit SHA and test-token release are returned to R.
      P5-B2:
        initial_parallel: false
        depends_on: [P5-B1, P5-C1]
        input_contracts:
