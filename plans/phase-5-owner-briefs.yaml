          - java-api-service/src/main/java/com/example/dispute/workflow/temporal/room/evidence/EvidenceFinalizationReceiptRef.java
          - java-api-service/src/test/java/com/example/dispute/workflow/room/evidence/EvidenceRoomActivityContractTest.java
          - java-api-service/src/test/java/com/example/dispute/workflow/room/evidence/EvidenceRoomWorkflowWorkerRecoveryTest.java
        t0_commands:
          - id: B2_MAVEN_TEST
            workdir: java-api-service
            argv: [./mvnw.cmd, -q, "-Dtest=EvidenceRoomActivityContractTest,EvidenceRoomWorkflowWorkerRecoveryTest", test]
            resource_class: maven_test
            test_token_required: true
            max_duration_seconds: 180
        commit_definition_of_done:
          - Only P5-B2 owned_files are staged.
          - Receipt epoch fence manifest hash and idempotency key are checked before progress.
          - Lost response and cancellation recovery are covered without formal sink activation.
          - Token-granted T0 passes and E records P0 review closure.
          - Commit SHA and test-token release are returned to R.

  C:
