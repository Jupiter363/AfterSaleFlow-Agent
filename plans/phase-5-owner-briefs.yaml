      - java-api-service/src/main/java/com/example/dispute/workflow/config/TemporalWorkerConfiguration.java
    tasks:
      P5-B1:
        initial_parallel: true
        depends_on: [P5-0]
        input_contracts:
          - contracts/agent-platform/evidence/v2/evidence-batch-manifest.schema.json
          - contracts/agent-platform/evidence/v2/evidence-finalization-receipt.schema.json
        output_contracts:
          - deterministic Workflow kernel preserves original deadline and one warning at deadline minus 30 minutes
          - duplicate party completion and expiry races produce ordered commands without writing Domain truth
        owned_files:
          - java-api-service/src/main/java/com/example/dispute/workflow/temporal/room/evidence/EvidenceRoomWorkflow.java
          - java-api-service/src/main/java/com/example/dispute/workflow/temporal/room/evidence/EvidenceRoomWorkflowImpl.java
          - java-api-service/src/main/java/com/example/dispute/workflow/temporal/room/evidence/EvidenceRoomStart.java
