        owned_files:
          - java-api-service/src/main/java/com/example/dispute/workflow/projection/evidence/EvidenceProcessProjectionAdapter.java
          - java-api-service/src/main/java/com/example/dispute/workflow/projection/evidence/EvidenceProcessProjectionView.java
