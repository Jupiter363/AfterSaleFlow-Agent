schema_version: phase-owner-briefs.v1
phase: 5
name: evidence-pilot-delegated-owner-briefs
document_status: DRAFT_BLOCKED_UNTIL_P5_0_ENTRY_EVIDENCE

authority:
  execution_plan: plans/phase-5-evidence-pilot-execution.md
  test_schedule: plans/phase-5-evidence-pilot-test-batches.yaml
  contract_pack: docs/runbooks/temporal-first/phase-5-p5.0-contract-pack.md
  baseline_inventory: docs/runbooks/temporal-first/phase-5-p5.0-baseline-inventory.md
  review_closure: docs/runbooks/temporal-first/phase-5-p5.0-review-closure.md
  engineering_exception: docs/architecture/adr/0012-phase-5-evidence-engineering-exception.md

entry_gate:
  status: BLOCKED
  required_before_dispatch:
    - PHASE_4_ENGINEERING_CHECKPOINT_PASS
    - PHASE_5_ENGINEERING_ONLY_PERMISSION_RECORDED
    - P5_0_CONTRACT_CANDIDATE_COMMITTED
    - P5_0_BATCH_0_PASSED_ON_EXACT_CONTRACT_CANDIDATE_SHA
    - P5_0_ENTRY_EVIDENCE_COMMITTED
  dispatch_rule: No owner may create implementation commits while document_status is DRAFT_BLOCKED_UNTIL_P5_0_ENTRY_EVIDENCE.

shared_contract_owner:
  owner: R
  delegated_owners_may_edit: false
  contract_candidate_draft_owner: A
  contract_candidate_integration_owner: R
  contract_candidate_draft_gate: P5_0_CONTRACT_CANDIDATE
  contract_candidate_draft_paths:
    - contracts/agent-platform/evidence/v2/
    - tests/static/test_phase5_evidence_contracts.py
    - java-api-service/src/test/java/com/example/dispute/workflow/contract/v1/EvidenceV2ContractFixtureTest.java
  files:
    - contracts/agent-platform/evidence/v2/compatibility-matrix.yaml
    - contracts/agent-platform/evidence/v2/evidence-batch-manifest.schema.json
    - contracts/agent-platform/evidence/v2/evidence-asset-capability.schema.json
    - contracts/agent-platform/evidence/v2/evidence-item-proposal.schema.json
    - contracts/agent-platform/evidence/v2/evidence-terminal-proposal.schema.json
    - contracts/agent-platform/evidence/v2/evidence-finalization-receipt.schema.json
    - contracts/agent-platform/evidence/v2/evidence-process-projection.schema.json

test_token_policy:
  grantor: R
  max_concurrent_heavy_tokens: 1
  request_fields: [task_id, command_id, expected_duration_seconds, resource_class]
  required_resource_classes:
    - maven_test
    - spring_context
    - postgresql
    - testcontainers
    - temporal_test_server
    - docker_compose
    - browser_or_playwright
    - load_or_soak
  rules:
    - A delegated owner may run token-free T0 commands only from its own brief.
    - A Maven test remains token-controlled even when it is a focused service-free unit test.
    - T1 and T2 commands are deduplicated and run by R at the declared integration checkpoint.
    - Full regression browser Docker real shadow load soak failover DR and canary are not delegated.
    - A granted token is released immediately after its single declared command exits.
    - A failed command is classified before any same-SHA retry; PRODUCT blocks dependent work.

wave_a_parallel_launch:
  status: BLOCKED_ON_ENTRY_GATE
  simultaneously_active_tasks: [P5-A1, P5-B1, P5-C1, P5-D0, P5-E0]
  exact_write_sets_must_be_disjoint: true
  owner_count: 5
  initial_review_pairs:
    P5-A1: C
    P5-B1: E
    P5-C1: A
    P5-D0: R
    P5-E0: B

integration_barriers:
  P5-WAVE-A-INTEGRATED:
    status: BLOCKED
    owner: R
    prerequisites:
      - P5-A2_COMMITTED_AND_REVIEWED
      - P5-B2_COMMITTED_AND_REVIEWED
      - P5-C2_COMMITTED_AND_REVIEWED
      - P5-D0_COMMITTED_AND_REVIEWED
      - P5-E0_COMMITTED_AND_REVIEWED
      - P5_BATCH_1_PASS_ON_MERGED_SHA
    rules:
      - D1 and E1 may not edit any takeover file before this barrier is OPEN.
      - A B and C become dependency-fix-only after this barrier and need an exact-file grant from R.
      - R records the merged SHA before opening D1 and E1.
    path_takeovers:
      - owner: D
        from_task: P5-D0
        to_task: P5-D1
        files:
          - java-api-service/src/main/java/com/example/dispute/workflow/projection/evidence/EvidenceProcessProjectionAdapter.java
          - java-api-service/src/main/java/com/example/dispute/workflow/projection/evidence/EvidenceProcessProjectionView.java
          - java-api-service/src/test/java/com/example/dispute/workflow/projection/EvidenceProcessProjectionAdapterTest.java
          - frontend/src/api/evidence.test.js
          - frontend/src/views/disputes/EvidenceRoomView.test.js
      - owner: E
        from_task: P5-E0
        to_task: P5-E1
        files:
          - java-api-service/src/main/java/com/example/dispute/workflow/shadow/evidence/EvidenceBulkheadPolicy.java
          - java-api-service/src/main/java/com/example/dispute/workflow/shadow/evidence/EvidenceNoFormalSinkGuard.java
          - java-api-service/src/test/java/com/example/dispute/workflow/shadow/evidence/EvidenceBulkheadPolicyTest.java
          - java-api-service/src/test/java/com/example/dispute/workflow/shadow/evidence/EvidenceNoFormalSinkGuardTest.java
          - tests/static/test_phase5_evidence_no_sink_bulkhead.py

owners:
  A:
    role: Evidence Graph state fanout reducer and recovery
    status: DRAFT_BLOCKED_UNTIL_P5_0_ENTRY_EVIDENCE
    review_partner: C
    scope_guard:
      public_evidence_submission_max: 50
      closed_synthetic_manifest_counts: [1, 8, 100]
      closed_synthetic_100_is_public_contract: false
      formal_evidence_sink_allowed: false
      temporal_evidence_allocation_allowed: false
      allowed_new_runtime_modes: [DISABLED, SIGNED_SYNTHETIC_SHADOW]
      asset_mode: JAVA_SIGNED_SYNTHETIC_CAPABILITY_ONLY
      hearing_supplement_max_per_party_unchanged: 50
    forbidden_path_prefixes:
      - java-api-service/
      - frontend/
      - contracts/agent-platform/evidence/v2/
      - plans/
      - docs/
      - test-reports/
    forbidden_files:
      - python-agent-service/app/agents/evidence_clerk/workflow.py
      - python-agent-service/app/graph_runtime/checkpoint.py
      - python-agent-service/app/graph_runtime/ledger.py
      - python-agent-service/app/graph_runtime/registry.py
      - python-agent-service/app/graph_runtime/recovery.py
    tasks:
      P5-A1:
        initial_parallel: true
        depends_on: [P5-0]
        input_contracts:
          - contracts/agent-platform/evidence/v2/evidence-batch-manifest.schema.json
          - contracts/agent-platform/evidence/v2/evidence-item-proposal.schema.json
          - contracts/agent-platform/evidence/v2/evidence-terminal-proposal.schema.json
        output_contracts:
          - evidence.v2 state validates one immutable manifest and emits proposal-only terminal coverage
          - dispatch waves contain at most eight active item assessments for closed synthetic counts 1 8 and 100
        owned_files:
          - python-agent-service/app/graphs/evidence/__init__.py
          - python-agent-service/app/graphs/evidence/contracts.py
          - python-agent-service/app/graphs/evidence/state.py
          - python-agent-service/app/graphs/evidence/nodes.py
          - python-agent-service/app/graphs/evidence/graph.py
          - python-agent-service/tests/graphs/evidence/__init__.py
          - python-agent-service/tests/graphs/evidence/conftest.py
          - python-agent-service/tests/graphs/evidence/test_state.py
          - python-agent-service/tests/graphs/evidence/test_graph.py
        t0_commands:
          - id: A1_PYTEST
            workdir: python-agent-service
            argv: [D:/miniconda/python.exe, -m, pytest, tests/graphs/evidence/test_state.py, tests/graphs/evidence/test_graph.py, -q]
            resource_class: light_pytest
            test_token_required: false
            max_duration_seconds: 180
        commit_definition_of_done:
          - Only P5-A1 owned_files are staged.
          - Counts 1 8 and 100 and max-active 8 have positive and negative tests.
          - State contains no formal merge freeze Hearing-open or trusted business-decision field.
          - T0 passes and C records P0 review closure.
          - Commit SHA and exact T0 command result are returned to R.
      P5-A2:
        initial_parallel: false
        depends_on: [P5-A1, P5-C1]
        input_contracts:
          - contracts/agent-platform/evidence/v2/evidence-asset-capability.schema.json
          - contracts/agent-platform/evidence/v2/evidence-terminal-proposal.schema.json
        output_contracts:
          - keyed item reduction is associative order-independent replay-idempotent and conflict-failing
          - recovery resumes the same manifest membership without creating a formal sink
        owned_files:
          - python-agent-service/app/graphs/evidence/reducers.py
          - python-agent-service/app/graphs/evidence/runtime.py
          - python-agent-service/tests/graphs/evidence/test_reducers.py
          - python-agent-service/tests/graphs/evidence/test_recovery.py
        t0_commands:
          - id: A2_PYTEST
            workdir: python-agent-service
            argv: [D:/miniconda/python.exe, -m, pytest, tests/graphs/evidence/test_reducers.py, tests/graphs/evidence/test_recovery.py, -q]
            resource_class: light_pytest
            test_token_required: false
            max_duration_seconds: 180
        commit_definition_of_done:
          - Only P5-A2 owned_files are staged.
          - Duplicate identical keys are idempotent and conflicting keys fail closed.
          - Random completion order yields one stable proposal hash with complete manifest coverage.
          - T0 passes and C records P0 review closure.
          - Commit SHA and exact T0 command result are returned to R.

  B:
    role: Temporal Evidence process timers and recovery
    status: DRAFT_BLOCKED_UNTIL_P5_0_ENTRY_EVIDENCE
    review_partner: E
    scope_guard:
      public_evidence_submission_max: 50
      closed_synthetic_manifest_counts: [1, 8, 100]
      closed_synthetic_100_is_public_contract: false
      formal_evidence_sink_allowed: false
      temporal_evidence_allocation_allowed: false
      allowed_new_runtime_modes: [DISABLED, SIGNED_SYNTHETIC_SHADOW]
      asset_mode: JAVA_SIGNED_SYNTHETIC_CAPABILITY_ONLY
