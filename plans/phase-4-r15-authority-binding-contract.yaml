          - session_tenant_id
          - session_case_id
          - actor_id
          - actor_role
          - permission_level
        references:
          table: case_access_session
          columns:
            - id
            - tenant_id
            - case_id
            - actor_id
            - actor_role
            - permission_level
          candidate_key_added_by_V043_1: true
      - columns:
          - agent_session_id
          - session_tenant_id
          - session_case_id
          - room_type
          - access_session_id
          - actor_id
          - actor_role
          - agent_key
          - prompt_profile_id
          - memory_policy_id
        references:
          table: agent_conversation_session
          columns:
            - id
            - tenant_id
            - case_id
            - room_type
            - access_session_id
            - actor_id
            - actor_role
            - agent_key
            - prompt_profile_id
            - memory_policy_id
          candidate_key_added_by_V043_1: true
