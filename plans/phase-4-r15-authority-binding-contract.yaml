      - tenant_surrogate
      - case_id
      - session_tenant_id
      - session_case_id
      - room_type
      - room_epoch
      - fencing_token
      - registration_id
      - registration_hash
      - thread_id
      - actor_id
      - actor_role
      - audience
      - actor_scope_hash
      - access_session_id
      - permission_level
      - agent_session_id
      - agent_key
      - prompt_version
      - prompt_profile_id
      - agent_session_profile_version
      - memory_policy_id
    check_constraints:
      ck_r15_party_scope:
        all:
          - party_IN_INITIATOR_RESPONDENT
          - room_type_EQUALS_INTAKE
          - session_tenant_id_EQUALS_tenant_surrogate
          - session_case_id_EQUALS_case_id
          - actor_role_EQUALS_audience
      ck_r15_party_permission:
        any:
          - actor_role_EQUALS_USER_AND_permission_level_EQUALS_PARTY_USER
          - actor_role_EQUALS_MERCHANT_AND_permission_level_EQUALS_PARTY_MERCHANT
      ck_r15_party_profile:
        all:
          - agent_key_EQUALS_DISPUTE_INTAKE_OFFICER
          - agent_session_profile_version_EQUALS_agent-session-profile.v1
          - prompt_profile_id_MATCHES_asp.v1.lowercase_sha256
          - memory_policy_id_EQUALS_GRAPH_PRIVATE_NO_MEMORY_FRAME_V1
    agent_session_profile_proof:
      existing_V019_fk_columns:
        - agent_session_id
        - session_tenant_id
        - session_case_id
        - room_type
        - access_session_id
        - actor_id
        - actor_role
        - agent_key
        - prompt_profile_id
        - memory_policy_id
      party_local_hash_inputs: [agent_key, actor_role, prompt_version, agent_session_profile_version]
      prompt_profile_id_formula: "asp.v1.{lowercase_sha256_of_rfc8785_utf8_hash_inputs}"
      registry_requirement: immutable_exact_input_and_id_match
      epoch_prompt_and_profile_versions_must_equal_party: true
      registration_prompt_version_must_equal_party: true
      V019_column_addition_or_backfill_required: false
    scope_checks:
      party_enum: [INITIATOR, RESPONDENT]
      session_tenant_id_equals_tenant_surrogate: true
      session_case_id_equals_case_id: true
      room_type: INTAKE
      permission_level_by_actor_role:
        USER: PARTY_USER
        MERCHANT: PARTY_MERCHANT
    transactional_status_checks:
      epoch_binding_transaction:
        case_access_session:
          column: status
          required_value: ACTIVE
        agent_conversation_session:
          column: status
          required_value: ACTIVE
        case_intake_graph_thread_binding:
          column: registration_status
          required_value: REGISTERED
      acceptance_transaction:
        case_access_session:
          column: status
          required_value: ACTIVE
        agent_conversation_session:
          column: status
          required_value: ACTIVE
        case_intake_graph_thread_binding:
          column: registration_status
          required_value: REGISTERED
      start_read_transaction:
        case_access_session:
          column: status
          required_value: ACTIVE
        agent_conversation_session:
          column: status
          required_value: ACTIVE
        case_intake_graph_thread_binding:
          column: registration_status
          required_value: REGISTERED
      status_columns_in_foreign_keys: false
      reason: ACTIVE_is_mutable_and_must_not_be_part_of_an_immutable_candidate_key
    bootstrap_cardinality_assertion:
      required_parties: [INITIATOR, RESPONDENT]
      exact_row_count: 2
      asserted_in: epoch_binding_transaction
      unique_epoch_party_semantics: at_most_one_row_per_party_only
      bootstrap_outbox_deliverable_after_assertion_only: true

