schema_ref: phase-4-r15-authority-binding-contract.schema.json
schema_version: phase-4-r15-authority-binding-contract.v1
contract_id: P4-R1.5
status: FROZEN_FOR_IMPLEMENTATION
owner: R
depends_on: [P4-A1, P4-B1, P4-C1, P4-R1_TYPED_DISPATCH]

purpose: >-
  Bind every typed Intake bridge read to immutable Java-owned epoch, case-party,
  registration, access-session, AgentSession, payload, and command authority
  without accepting a client-selected thread or session.

migration_contract:
  file: V043_1__intake_authority_bindings.sql
  predecessor: V043__intake_graph_bindings.sql
  mode: EXPAND_ONLY
  reserved_versions_untouched:
    V044: phase_6_hearing_temporal_projection
    V045: outcome_execution_compensation
  implementation_present_in_this_gate: false

runtime_gate:
  allowed_modes: [DISABLED, SIGNED_SYNTHETIC_SHADOW]
  real_case_shadow_allowed: false
  temporal_intake_allocation_allowed: false
  formal_sink_allowed: false
  required_defaults:
    graph_runtime: DISABLED
    new_epoch_mode: LEGACY
    non_legacy_epoch_allocation_enabled: false
    temporal_writer_enabled: false

execution_matrix:
  DISABLED:
    INERT_EXTERNAL_EVENT: forbidden
    ACTIVITY_ORCHESTRATED: forbidden
  SIGNED_SYNTHETIC_SHADOW:
    INERT_EXTERNAL_EVENT: allowed
    ACTIVITY_ORCHESTRATED: forbidden_until_P4_E1
  TEMPORAL:
    INERT_EXTERNAL_EVENT: forbidden_until_MIG_004
    ACTIVITY_ORCHESTRATED: forbidden_until_MIG_004

authority_tables:
  case_intake_epoch_selection_binding:
    cardinality: exactly_one_per_v2_intake_epoch
    columns:
      epoch_id: {sql_type: varchar, length: 64, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      tenant_surrogate: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      case_id: {sql_type: varchar, length: 64, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      room_type: {sql_type: varchar, length: 32, nullable: false, default: NO_DEFAULT, checks: [constant_INTAKE]}
      room_epoch: {sql_type: bigint, length: null, nullable: false, default: NO_DEFAULT, checks: [non_negative]}
      fencing_token: {sql_type: bigint, length: null, nullable: false, default: NO_DEFAULT, checks: [positive]}
      selection_hash: {sql_type: varchar, length: 64, nullable: false, default: NO_DEFAULT, checks: [lowercase_sha256]}
      writer_mode: {sql_type: varchar, length: 16, nullable: false, default: NO_DEFAULT, checks: [constant_SHADOW]}
      case_workflow_type: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      case_workflow_build_id: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      room_workflow_type: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [constant_IntakeRoomWorkflow]}
      room_workflow_build_id: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      process_contract_version: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      graph_key: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [constant_intake_v2]}
      graph_version: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      checkpoint_schema_version: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      state_schema_version: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [constant_intake_graph_state_v2]}
      stream_protocol: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      prompt_version: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      model_profile_id: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      output_schema_version: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [constant_intake_turn_proposal_v2]}
      policy_version: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      guardrail_version: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      tool_policy_version: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      cohort_policy_version: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      agent_key: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [constant_DISPUTE_INTAKE_OFFICER]}
      agent_session_profile_version: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [constant_agent_session_profile_v1]}
      memory_policy_id: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [constant_GRAPH_PRIVATE_NO_MEMORY_FRAME_V1]}
      created_at: {sql_type: timestamptz, length: null, nullable: false, default: CURRENT_TIMESTAMP, checks: []}
    primary_key: [epoch_id]
    unique_keys:
      - [epoch_id, tenant_surrogate, case_id, room_type, room_epoch, fencing_token]
    candidate_keys:
      - [epoch_id]
      - [epoch_id, tenant_surrogate, case_id, room_type, room_epoch, fencing_token]
    foreign_keys:
      - columns: [epoch_id, tenant_surrogate, case_id, room_type, room_epoch, fencing_token]
        references:
          table: case_room_epoch
          columns: [id, tenant_surrogate, case_id, room_type, room_epoch, fencing_token]
          candidate_key_added_by_V043_1: true
    immutable: true
    required_pins:
      - selection_hash
      - writer_mode
      - case_workflow_type
      - case_workflow_build_id
      - room_workflow_type
      - room_workflow_build_id
      - process_contract_version
      - graph_key
      - graph_version
      - checkpoint_schema_version
      - state_schema_version
      - stream_protocol
      - prompt_version
      - model_profile_id
      - output_schema_version
      - policy_version
      - guardrail_version
      - tool_policy_version
      - cohort_policy_version
      - agent_key
      - agent_session_profile_version
      - memory_policy_id
    check_constraints:
      ck_r15_selection_constants:
        all:
          - room_type_EQUALS_INTAKE
          - writer_mode_EQUALS_SHADOW
          - room_workflow_type_EQUALS_IntakeRoomWorkflow
          - graph_key_EQUALS_intake.v2
          - state_schema_version_EQUALS_intake-graph-state.v2
          - output_schema_version_EQUALS_intake-turn-proposal.v2
          - agent_key_EQUALS_DISPUTE_INTAKE_OFFICER
          - agent_session_profile_version_EQUALS_agent-session-profile.v1
          - memory_policy_id_EQUALS_GRAPH_PRIVATE_NO_MEMORY_FRAME_V1
      ck_r15_selection_epoch: [room_epoch_GTE_0, fencing_token_GT_0]
      ck_r15_selection_hash: [selection_hash_MATCHES_lowercase_sha256]

  case_intake_epoch_party_authority:
    cardinality: exactly_one_initiator_and_one_respondent_per_bound_epoch
    columns:
      authority_id: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      epoch_id: {sql_type: varchar, length: 64, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      party: {sql_type: varchar, length: 16, nullable: false, default: NO_DEFAULT, checks: [enum_INITIATOR_RESPONDENT]}
      tenant_surrogate: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      case_id: {sql_type: varchar, length: 64, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      session_tenant_id: {sql_type: varchar, length: 64, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      session_case_id: {sql_type: varchar, length: 64, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      room_type: {sql_type: varchar, length: 32, nullable: false, default: NO_DEFAULT, checks: [constant_INTAKE]}
      room_epoch: {sql_type: bigint, length: null, nullable: false, default: NO_DEFAULT, checks: [non_negative]}
      fencing_token: {sql_type: bigint, length: null, nullable: false, default: NO_DEFAULT, checks: [positive]}
      registration_id: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      registration_hash: {sql_type: varchar, length: 64, nullable: false, default: NO_DEFAULT, checks: [lowercase_sha256]}
      thread_id: {sql_type: varchar, length: 64, nullable: false, default: NO_DEFAULT, checks: [graph_thread_id_v1]}
      actor_id: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      actor_role: {sql_type: varchar, length: 32, nullable: false, default: NO_DEFAULT, checks: [enum_USER_MERCHANT]}
      audience: {sql_type: varchar, length: 32, nullable: false, default: NO_DEFAULT, checks: [enum_USER_MERCHANT]}
      actor_scope_hash: {sql_type: varchar, length: 64, nullable: false, default: NO_DEFAULT, checks: [lowercase_sha256]}
      access_session_id: {sql_type: varchar, length: 64, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      permission_level: {sql_type: varchar, length: 64, nullable: false, default: NO_DEFAULT, checks: [enum_PARTY_USER_PARTY_MERCHANT]}
      agent_session_id: {sql_type: varchar, length: 64, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      agent_key: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [constant_DISPUTE_INTAKE_OFFICER]}
      prompt_version: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [identifier]}
      agent_session_profile_version: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [constant_agent_session_profile_v1]}
      prompt_profile_id: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [agent_session_profile_hash_id]}
      memory_policy_id: {sql_type: varchar, length: 128, nullable: false, default: NO_DEFAULT, checks: [constant_GRAPH_PRIVATE_NO_MEMORY_FRAME_V1]}
      created_at: {sql_type: timestamptz, length: null, nullable: false, default: CURRENT_TIMESTAMP, checks: []}
    primary_key: [authority_id]
    unique_keys:
      - [epoch_id, party]
      -
        - authority_id
        - epoch_id
        - tenant_surrogate
        - case_id
        - room_type
        - room_epoch
        - fencing_token
        - access_session_id
        - registration_id
        - thread_id
        - actor_id
        - actor_role
        - actor_scope_hash
        - agent_session_id
    candidate_keys:
      - [authority_id]
      - [epoch_id, party]
      -
        - authority_id
        - epoch_id
        - tenant_surrogate
        - case_id
        - room_type
        - room_epoch
        - fencing_token
        - access_session_id
        - registration_id
        - thread_id
        - actor_id
        - actor_role
        - actor_scope_hash
        - agent_session_id
    foreign_keys:
