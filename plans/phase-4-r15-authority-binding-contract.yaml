          table: case_intake_epoch_selection_binding
          columns: [epoch_id, tenant_surrogate, case_id, room_type, room_epoch, fencing_token]
      - columns:
          - registration_id
          - tenant_surrogate
          - case_id
          - room_type
          - room_epoch
          - fencing_token
          - thread_id
          - actor_id
          - actor_role
          - audience
          - actor_scope_hash
          - agent_session_id
          - registration_hash
