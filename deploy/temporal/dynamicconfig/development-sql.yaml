# 文件作用：部署配置文件，描述数据库、中间件、代理、对象存储或运行时初始化逻辑。
# 说明：本注释用于帮助读者先了解配置用途，再修改具体配置项。

limit.maxIDLength:
  - value: 255
    constraints: {}

# Keep enough routing history for repeated preproduction candidates. Temporal
# rejects every compatibility update once persisted data exceeds this limit.
limit.versionCompatibleSetLimitPerQueue:
  - value: 100
    constraints: {}

system.forceSearchAttributesCacheRefreshOnRead:
  - value: true
    constraints: {}

frontend.workerVersioningDataAPIs:
  - value: true
    constraints: {}

frontend.workerVersioningWorkflowAPIs:
  - value: true
    constraints: {}

frontend.enableExecuteMultiOperation:
  - value: true
    constraints: {}
