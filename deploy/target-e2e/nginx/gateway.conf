server {
    listen 8080;
    server_tokens off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://java-api-service:8080;
    }

    # The browser may observe Graph readiness, but it never gets an mTLS credential
    # or access to the Graph command surface.
    location = /agent-api/health/model {
        proxy_set_header Host graph-mtls-proxy;
        proxy_set_header X-Client-Cert "";
        proxy_set_header X-SSL-Client-Cert "";
        proxy_set_header X-Forwarded-Client-Cert "";
        proxy_set_header X-Service-Identity "";
        proxy_set_header X-Target-E2E-Mtls-Verified "";
        proxy_set_header X-Target-E2E-Mtls-Certificate "";
        proxy_pass http://graph-mtls-proxy:8080/ready/graph;
    }

    location ^~ /agent-api/ {
        return 404;
    }

    location / {
        proxy_set_header Host $host;
        proxy_pass http://frontend:5173;
    }
}
