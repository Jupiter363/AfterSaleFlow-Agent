server {
    listen 8080;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
server {
    listen 8443 ssl;
    server_name graph-mtls-proxy;

    ssl_protocols TLSv1.3;
    ssl_certificate /run/target-e2e/mtls/server.crt;
    ssl_certificate_key /run/target-e2e/mtls/server.key;
    ssl_client_certificate /run/target-e2e/mtls/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_session_tickets off;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 610s;
    proxy_read_timeout 610s;
    send_timeout 610s;

    location / {
        proxy_set_header Host python-agent-service;
        proxy_set_header Connection "";
        proxy_set_header X-Target-E2E-Mtls-Verified $ssl_client_verify;
        proxy_set_header X-Target-E2E-Mtls-Certificate $ssl_client_escaped_cert;
        proxy_pass http://python-agent-service:8000;
    }
}
