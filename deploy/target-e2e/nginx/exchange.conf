upstream target_e2e_java_graph_exchange {
    server java-api-service:8080;
    keepalive 8;
}

server {
    listen 8080;
    server_tokens off;

    client_max_body_size 1m;
    client_body_buffer_size 16k;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    send_timeout 30s;

    location = /healthz {
        if ($request_method != GET) {
            return 404;
        }
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /internal/graph/intake/v2/payload:load {
        if ($request_method != POST) {
            return 404;
        }
        proxy_set_header Host java-api-service;
        proxy_set_header Connection "";
        proxy_set_header X-Service-Secret $http_x_service_secret;
        proxy_pass_request_body on;
        proxy_pass http://target_e2e_java_graph_exchange;
    }

    location = /internal/graph/intake/v2/proposals:put {
        if ($request_method != POST) {
            return 404;
        }
        proxy_set_header Host java-api-service;
        proxy_set_header Connection "";
        proxy_set_header X-Service-Secret $http_x_service_secret;
        proxy_pass_request_body on;
        proxy_pass http://target_e2e_java_graph_exchange;
    }

    location = /internal/graph/target-e2e/rooms/object:load {
        if ($request_method != POST) {
            return 404;
        }
        proxy_set_header Host java-api-service;
        proxy_set_header Connection "";
        proxy_set_header X-Service-Secret $http_x_service_secret;
        proxy_pass_request_body on;
        proxy_pass http://target_e2e_java_graph_exchange;
    }

    location = /internal/graph/target-e2e/rooms/proposal:put {
        if ($request_method != POST) {
            return 404;
        }
        proxy_set_header Host java-api-service;
        proxy_set_header Connection "";
        proxy_set_header X-Service-Secret $http_x_service_secret;
        proxy_pass_request_body on;
        proxy_pass http://target_e2e_java_graph_exchange;
    }

    location ~ "^/internal/evidence/CASE_[A-Za-z0-9_]{1,59}/EVIDENCE_[A-Za-z0-9_-]{1,119}/content$" {
        if ($request_method != GET) {
            return 404;
        }
        proxy_set_header Host java-api-service;
        proxy_set_header Connection "";
        proxy_set_header X-Service-Secret $http_x_service_secret;
        proxy_pass_request_body off;
        proxy_pass http://target_e2e_java_graph_exchange;
    }

    location / {
        return 404;
    }
}
