apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: after-sale-java-api
  annotations: {phase8.after-sale-flow.dev/scaling-id: api-request-and-sse}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: after-sale-java-api}
  minReplicas: 3
  maxReplicas: 12
  behavior: &boundedBehavior
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{type: Percent, value: 100, periodSeconds: 60}]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 25, periodSeconds: 60}]
  metrics:
    - type: Pods
      pods:
        metric: {name: http_inflight_requests}
        target: {type: AverageValue, averageValue: "40"}
    - type: Pods
      pods:
        metric: {name: sse_active_connections}
        target: {type: AverageValue, averageValue: "625"}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: after-sale-java-control-worker
  annotations: {phase8.after-sale-flow.dev/scaling-id: temporal-control-latency}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: after-sale-java-control-worker}
  minReplicas: 3
  maxReplicas: 12
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{type: Percent, value: 100, periodSeconds: 60}]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 25, periodSeconds: 60}]
  metrics:
    - type: Pods
      pods:
        metric: {name: temporal_control_schedule_to_start_seconds}
        target: {type: AverageValue, averageValue: "500m"}
    - type: External
      external:
        metric:
          name: after_sale_control_queue_backlog
          selector: {matchLabels: {queue_class: control}}
        target: {type: AverageValue, averageValue: "20"}
---
apiVersion: autoscaling/v2
