apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: after-sale-otel-collector
  annotations: {phase8.after-sale-flow.dev/scaling-id: otel-export-health}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: after-sale-otel-collector}
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{type: Percent, value: 100, periodSeconds: 60}]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 25, periodSeconds: 60}]
  metrics:
    - type: Pods
      pods:
        metric: {name: otelcol_exporter_queue_size}
        target: {type: AverageValue, averageValue: "500"}
    - type: Pods
      pods:
        metric: {name: otelcol_exporter_send_failed_spans_rate}
        target: {type: AverageValue, averageValue: "1"}
