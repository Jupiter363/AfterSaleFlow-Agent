candidate_policy:
  accepted_candidate_count: 1
  candidate_sha_immutable_during_run: true
  source_suites_execute_once_per_candidate: true
  derived_views_reference_source_reports: true
  mixed_candidate_results_forbidden: true
  quarantined_attempts_not_reused: true
  code_change_invalidates_candidate_checkpoint: true
  evidence_commit_must_be_later_than_tested_sha: true

failure_classification:
  PRODUCT: block_candidate_and_fix_the_owning_product_path
  FIXTURE: prove_the_contract_then_fix_the_fixture_and_rerun_the_exact_scope
  INFRA: preserve_the_failed_attempt_and_rerun_the_failed_source_on_the_same_sha
  EXTERNAL_GATE: retain_engineering_evidence_and_keep_formal_traffic_blocked

model_evidence:
  IntakeGraphRecoveryTest:
    status: PARTIAL_ENGINEERING
    evidence_kind: SERVICE_FREE_CHECKPOINT_MODEL
    proves:
      - pre_model_resume_invokes_cognition_once
      - committed_model_checkpoint_avoids_second_invocation
      - projected_proposal_survives_terminal_checkpoint_interruption
      - terminal_checkpoint_survives_response_loss
    does_not_prove:
      - postgresql_checkpoint_durability
      - operating_system_process_replacement
      - stale_database_lease_fencing
  IntakeCutoverRollbackTest:
    status: PARTIAL_ENGINEERING
    evidence_kind: SERVICE_FREE_MODEL
    proves:
      - three_boundary_decision_contract
      - monotonically_higher_modeled_epoch_and_fence
      - stale_modeled_tuple_rejection
      - committed_effect_preservation
      - respondent_only_resume
      - receipt_reuse_without_intake_reopen
      - exactly_one_active_modeled_writer
    does_not_prove:
      - persisted_higher_epoch_allocation
      - database_or_authority_race_linearization
      - temporal_or_worker_recovery
      - production_external_effect_reconciliation
      - deployment_rollback_rehearsal

promotion_gates:
  MIG-003:
    status: PENDING_PROMOTION
    note: Phase 3 production promotion remains independently gated.
  MIG-004:
    status: PENDING_PROMOTION
    depends_on: [MIG-003]
    note: Phase 4 engineering PASS never implies Intake promotion PASS.

external_gates:
  - id: EXT-P4-REAL-SHADOW
    status: PENDING_EXTERNAL
    note: Authorized real-case shadow with the approved privacy controls has not run.
  - id: EXT-P4-PRIVACY-SCAN
    status: PENDING_EXTERNAL
    note: Production-equivalent private-data and unauthorized-byte scanning has not run.
  - id: EXT-P4-FORMAL-WRITER
    status: PENDING_EXTERNAL
    note: Formal Intake Finalizer reachability and TEMPORAL epoch allocation remain forbidden.
  - id: EXT-P4-CANARY
    status: PENDING_EXTERNAL
    note: The approved 1%-5%-25%-100% cohort observation sequence has not run.
  - id: EXT-P4-PERSISTED-ROLLBACK
    status: PENDING_EXTERNAL
    note: Higher-epoch and higher-fence legacy recovery has not been persisted through the real allocator and authority tables.
  - id: EXT-P4-ROLLBACK-RACE
    status: PENDING_EXTERNAL
    note: Rollback versus command, Finalizer, and Evidence-open races have not been linearized against the real database authority path.
  - id: EXT-P4-RECOVERY-TOPOLOGY
    status: PENDING_EXTERNAL
    note: Production worker kill, failover, rollback rehearsal, and reconciliation remain external.
