schema_version: phase4-engineering-evidence-policy.v1
scope: SIGNED_SYNTHETIC_SHADOW_ENGINEERING_ONLY
runtime_modes_allowed: [DISABLED, SIGNED_SYNTHETIC_SHADOW]
formal_writer_allowed: false
real_case_shadow_allowed: false
temporal_intake_allocation_allowed: false
canary_allowed: false

# These tests authenticate the complete production-shaped synthetic chain at the candidate SHA.
# Their result is engineering evidence only and has no promotion effect.
signed_synthetic_chain_evidence:
  claim_ceiling: ENGINEERING_ONLY
  evidence: java-phase4-junit.xml
  promotion_effect: NONE
  required_java_test_classes:
    - SignedSyntheticIntakeDriverTest
    - SignedSyntheticIntakeIngressServiceTest
    - SignedSyntheticIntakeBridgeReadPortDecoratorTest
    - IntakeSyntheticAdmissionTrustPropertiesTest
    - Es256IntakeSyntheticAdmissionVerifierTest
    - JdbcIntakeSignedSyntheticAdmissionPortIntegrationTest
    - JdbcIntakeSyntheticRuntimeSourceTest
    - IntakeSyntheticRuntimeAdaptersTest
    - IntakeExchangeP0Test
    - IntakeChildBridgeAuthorityAdapterTest
    - IntakeChildBridgeActivitiesTest
    - IntakeSyntheticShadowConfigurationTest
    - TemporalWorkerConfigurationTest

# Defaults define status and source-report scope. Every Phase 4 Check ID still has an explicit
# selector mapping below, and the two promotion gates remain independent of engineering results.
defaults:
  ROOM:
    status: PASS_ENGINEERING
    evidence: [python-phase4-junit.xml, java-phase4-junit.xml]
  GRAPH:
    status: PASS_ENGINEERING
    evidence: [python-phase4-junit.xml]
  TEMP:
    status: PASS_ENGINEERING
    evidence: [java-phase4-junit.xml]
  JAVA:
    status: PASS_ENGINEERING
    evidence: [java-phase4-junit.xml]
  MIG:
    status: PENDING_PROMOTION
    evidence:
      - python-phase4-junit.xml
      - java-phase4-junit.xml
      - frontend-phase4-junit.xml
      - static-phase4-junit.xml
    note: Engineering evidence cannot authorize real shadow, a formal writer, canary, or promotion.

