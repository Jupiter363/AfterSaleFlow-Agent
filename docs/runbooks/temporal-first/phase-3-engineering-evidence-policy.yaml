external_gates:
  - id: EXT-MTLS-IDENTITY
    status: PENDING_EXTERNAL
    note: Validate real client identity propagation through the deployed service mesh or trusted reverse proxy.
  - id: EXT-SYNTHETIC-DRIVER
    status: PENDING_EXTERNAL
    note: Run an independent Java-to-Python signed synthetic SHADOW driver in a deployment-equivalent environment.
  - id: EXT-LOAD-1000-ROOMS
    status: PENDING_EXTERNAL
    note: Execute the agreed 1000-room concurrency profile with SLO and resource evidence.
  - id: EXT-SOAK-24H
    status: PENDING_EXTERNAL
    note: Complete the 24-hour leak, queue-drift, and history-growth soak.
  - id: EXT-DR-FAILOVER
    status: PENDING_EXTERNAL
    note: Exercise Graph PostgreSQL failover, restore, and stale-lease rejection in the target environment.
  - id: EXT-PRODUCTION-APPROVAL
    status: PENDING_PROMOTION
    note: Independent security, operations, and change approvals are not part of engineering evidence.
