schema_version: evidence-contract-compatibility.v1
authority: JSON Schema files in this directory
root_schema_count: 6
contracts:
  evidence-batch-manifest.v1:
    file: evidence-batch-manifest.schema.json
    responsibilities:
      - evidence-thread-registration.v1
      - evidence-batch-manifest.v1
      - evidence-item-manifest.v1
      - evidence-room-command.v1
    self_hash: manifest_hash
    self_hash_omits: [manifest_hash, signature]
    signature_algorithm: ES256
    signature_covers: manifest_hash
    signature_input_encoding: ASCII_LOWERCASE_HEX_TEXT
    signature_encoding: JOSE_P1363_BASE64URL
    signing_authority: JAVA
    profile_output_pins:
      assessment: evidence-item-assessment.v1
      terminal: evidence-batch-proposal.v1
    max_serialized_bytes: 262144
    accepts: [evidence-batch-manifest.v1]
    rejects_unknown_future: true
  evidence-asset-capability.v1:
    file: evidence-asset-capability.schema.json
    responsibilities: [evidence-asset-capability.v1]
    self_hash: capability_hash
    self_hash_omits: [capability_hash, signature]
    signature_covers: capability_hash
    signature_input_encoding: ASCII_LOWERCASE_HEX_TEXT
    signature_encoding: JOSE_P1363_BASE64URL
    manifest_authorization: exact_verified_java_signed_manifest
    profile_versions_hash_covers:
      - assessment_output_schema_version
      - terminal_output_schema_version
    max_serialized_bytes: 32768
    accepts: [evidence-asset-capability.v1]
    synthetic_only: true
    rejects_unknown_future: true
  evidence-item-assessment.v1:
    file: evidence-item-proposal.schema.json
    responsibilities: [evidence-item-assessment.v1]
    self_hash: assessment_hash
    profile_output_pins:
      assessment: evidence-item-assessment.v1
      terminal: evidence-batch-proposal.v1
    max_serialized_bytes: 65536
    accepts: [evidence-item-assessment.v1]
    rejects_unknown_future: true
  evidence-batch-proposal.v1:
    file: evidence-terminal-proposal.schema.json
    responsibilities: [evidence-batch-proposal.v1]
    self_hash: proposal_hash
    profile_output_pins:
      assessment: evidence-item-assessment.v1
      terminal: evidence-batch-proposal.v1
    max_serialized_bytes: 262144
    accepts: [evidence-batch-proposal.v1]
    rejects_unknown_future: true
  evidence-finalization-receipt.v1:
    file: evidence-finalization-receipt.schema.json
    responsibilities: [evidence-finalization-receipt.v1]
    self_hash: receipt_hash
    max_serialized_bytes: 65536
    accepts: [evidence-finalization-receipt.v1]
    synthetic_ledger_only_before_promotion: true
    rejects_unknown_future: true
  evidence-process-projection.v1:
    file: evidence-process-projection.schema.json
    responsibilities: [evidence-process-projection.v1]
    self_hash: projection_hash
    profile_output_pins:
      assessment: evidence-item-assessment.v1
      terminal: evidence-batch-proposal.v1
    legacy_unavailable_compatible: true
    max_serialized_bytes: 32768
    accepts: [evidence-process-projection.v1]
    rejects_unknown_future: true
runtime_gate_scope: PHASE5_DEFAULT_AND_SIGNED_SYNTHETIC_SHADOW
runtime_gate:
  graph_runtime_default: DISABLED
  allowed_modes: [DISABLED, SIGNED_SYNTHETIC_SHADOW]
  public_submission_max: 50
  signed_synthetic_counts: [1, 8, 100]
  synthetic_100_formal_sink_eligible: false
  real_case_shadow_allowed: false
  temporal_evidence_allocation_allowed: false
  formal_graph_sink_allowed: false
  promotion_allowed: false
authorization:
  manifest:
    authority: JAVA_ES256_SIGNATURE
    signature_required: true
    self_hash_omits_exactly: [manifest_hash, signature]
    signature_covers_exactly: manifest_hash
    signature_input_encoding: ASCII_LOWERCASE_HEX_TEXT
    signature_encoding: JOSE_P1363_BASE64URL
    signature_metadata_hash_bound: true
    exact_id_hash_replay_allowed: true
    same_id_different_hash: reject
    detached_authorization_proof_ref: forbidden
    python_may_mint_or_sign: false
  asset_capability:
    signature_input_encoding: ASCII_LOWERCASE_HEX_TEXT
    signature_encoding: JOSE_P1363_BASE64URL
  room_graph_command_cross_binding:
    required_before_checkpoint_mutation: true
    source_schema_version: room-graph-command.v1
    canonical_command_fixture:
      path: contracts/agent-platform/v1/fixtures/valid/room-graph-command-evidence-valid.json
      purpose: canonical_evidence_cross_binding_contract_evidence
    transport_identity: MTLS_JAVA_API_SERVICE
    envelope_signature_algorithm: ES256
    snapshot_ref_bindings:
      domain_snapshot_ref.artifact_id: manifest_id
      domain_snapshot_ref.schema_version: evidence-batch-manifest.v1
      domain_snapshot_ref.sha256: full_canonical_signed_manifest_payload_sha256
      domain_snapshot_ref.size_bytes: full_canonical_signed_manifest_payload_size_bytes
      domain_snapshot_ref.uri: exact_immutable_allowlisted_uri_content_addressed_by_payload_sha256
    snapshot_artifact_verification:
      payload_layer:
        encoding: RFC_8785_CANONICAL_JSON_BYTES
        includes_top_level_fields: [manifest_hash, signature]
        sha256_source: verified_command.domain_snapshot_ref.sha256
        size_bytes_source: verified_command.domain_snapshot_ref.size_bytes
        uri_content_address_source: verified_command.domain_snapshot_ref.sha256
      internal_manifest_layer:
        self_hash_field: manifest_hash
        self_hash_omits_exactly: [manifest_hash, signature]
        signature_algorithm: ES256
        signature_input: ASCII_LOWERCASE_HEX_TEXT_OF_MANIFEST_HASH
        signature_encoding: JOSE_P1363_BASE64URL
      verification_order:
        - LOAD_ARTIFACT_FROM_VERIFIED_COMMAND_DOMAIN_SNAPSHOT_REF
        - VERIFY_FULL_PAYLOAD_SHA256
        - VERIFY_FULL_PAYLOAD_SIZE_BYTES
        - PARSE_EVIDENCE_BATCH_MANIFEST_V1
        - VERIFY_RFC_8785_REENCODING_EQUALS_LOADED_BYTES
        - VERIFY_INTERNAL_MANIFEST_HASH
        - VERIFY_JAVA_ES256_SIGNATURE
      internal_manifest_hash_is_payload_sha256: false
      interchangeability: forbidden
    command_bindings:
      - command_id
      - logical_run_id
      - attempt_id
      - tenant_surrogate
      - case_id
      - room_type
      - room_epoch
      - thread_id
      - graph_version
      - checkpoint_schema_version
      - deadline_at
    derived_command_bindings:
      actor_scope_hash:
        source: verified_command.actor_scope
        canonicalization: RFC_8785
        digest: SHA_256
        target: manifest.actor_scope_hash
    thread_bindings:
      - tenant_surrogate
      - case_id
      - room_type
      - room_epoch
      - thread_id
      - actor_id
      - actor_role
      - actor_scope_hash
      - agent_session_id
    registry_bindings:
      - graph_key
      - graph_version
      - checkpoint_schema_version
      - state_schema_version
      - prompt_version
      - model_profile_id
      - assessment_output_schema_version
      - policy_version
      - guardrail_version
      - tool_policy_version
      - registry_binding_hash
    signed_manifest_only_bindings:
      - room_id
      - fencing_token
      - participant_id
      - registration_id
      - submission_batch_id
      - submission_revision
      - dossier_target_version
      - terminal_output_schema_version
      - ordered_item_keys
      - items
    mismatch: reject_before_checkpoint_mutation
  hash_cycle_guard:
    manifest_must_not_embed_room_graph_request_hash: true
    reason: room_graph_request_hash_already_covers_manifest_hash
  fencing:
    manifest_fencing_token: java_room_fence
    graph_execution_fencing_token: graph_lease_fence
    tokens_are_interchangeable: false
  validity:
    initial_admission: signature_and_time_window_must_be_current
    durable_exact_recovery: use_committed_admission_binding_after_expiry
    recovery_may_create_new_authority: false
profile_versioning:
  required_fields:
    - assessment_output_schema_version
    - terminal_output_schema_version
  assessment_output_schema_version: evidence-item-assessment.v1
  terminal_output_schema_version: evidence-batch-proposal.v1
  exact_copy_required_across:
    - evidence-batch-manifest.v1
    - evidence-item-assessment.v1
    - evidence-batch-proposal.v1
  capability_profile_versions_hash: canonical_hash_of_split_manifest_profile_versions
  projection_exposes_both_pins: true
  room_graph_command_output_schema_maps_to: terminal_output_schema_version
  graph_registry_output_schema_maps_to: terminal_output_schema_version
  internal_item_lcel_parser_output_schema_maps_to: assessment_output_schema_version
  terminal_schema_maps_to: terminal_output_schema_version
projection_compatibility:
  legacy_unavailable:
    writer_mode: LEGACY
    projection_state: UNAVAILABLE
    graph_runtime_mode: DISABLED
    room_id: null
    room_epoch: 0
    fencing_token: 0
    workflow_graph_checkpoint_state_pins: null
    active_graph_run: null
    authorization_material_exposed: false
    write_behavior_changed: false
  target_e2e_temporal:
    scope: ACTIVATION_BOUND_TARGET_E2E_ONLY
    execution_lane: TARGET_E2E_CANDIDATE
    writer_mode: TEMPORAL
    graph_runtime_mode: TARGET_E2E_CANDIDATE
    activation_case_scope: persisted_target_e2e_case_reservation
    temporal_evidence_allocation_allowed: true
    formal_graph_sink_allowed: false
    real_case_shadow_allowed: false
    graph_version: target-e2e-graph.2026-08-18.1
    checkpoint_schema_version: target-e2e-checkpoint.v2
    prompt_version: all-rooms-prompt.target-e2e.v1
    model_profile_id: target-e2e.contract-blocked
    policy_version: all-rooms-policy.target-e2e.v1
    guardrail_version: all-rooms-guardrail.target-e2e.v1
    tool_policy_version: tools.none.v1
governance:
  closed_root_schema_set: true
  pre_entry_in_place_correction:
    authority: ADR_0013_PHASE_5_PRE_ENTRY_CONTRACT_CORRECTION
    predecessor_candidate: 45d7f087eafe4f50be0d491b3d612446a3e1e94e
    predecessor_status: QUARANTINED_DIAGNOSTIC_ONLY
    allowed_once_before_first_p5_acceptance: true
    requires_no_runtime_or_accepted_consumer: true
    requires_atomic_schema_matrix_fixture_hash_doc_update: true
    requires_new_clean_candidate_and_full_entry_revalidation: true
    establishes_future_in_place_precedent: false
  future_authority_changes:
    require_new_schema_version: true
    require_adr: true
rules:
  unknown_fields: reject
  missing_required_fields: reject
  self_hash_preimage: omit_contract_declared_top_level_fields
  default_self_hash_omits: [declared_self_hash_field]
  contract_specific_self_hash_omits_override: allowed_and_required_when_declared
  canonicalization: RFC_8785
  digest: SHA_256
  additive_optional_fields: require_new_schema_version
  authority_field_changes: require_new_schema_version_and_ADR
  authorization_from_unsigned_manifest_content: forbidden
  authorization_proof_ref: forbidden
  signed_manifest_command_registry_mismatch: reject_before_checkpoint_mutation
  output_pin_implicit_substitution: forbidden
  legacy_unavailable_graph_execution: forbidden
