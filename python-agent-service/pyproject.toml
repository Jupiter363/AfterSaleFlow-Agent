# 文件作用：Python Agent 服务代码文件，承载售后争议智能体的 API、配置、模型调用或业务流程。
# 说明：本注释用于帮助读者先了解配置用途，再修改具体配置项。

[project]
name = "python-agent-service"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "graph_postgres: requires an isolated PostgreSQL 16 Graph database",
]

[tool.ruff]
line-length = 100
target-version = "py311"
