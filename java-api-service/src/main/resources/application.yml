# 文件作用：Java API 服务代码文件，承载售后争议后端业务、持久化或集成逻辑。
# 说明：本注释用于帮助读者先了解配置用途，再修改具体配置项。

spring:
  application:
    name: java-api-service
  profiles:
    active: ${APP_ENV:local}
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

management:
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}
    propagation:
      type: w3c
    sampling:
      probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
      timeout: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:10s}
      export:
        enabled: ${OTEL_TRACING_ENABLED:false}
    logging:
      export:
        enabled: false
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    tenant-authority:
      surrogate: ${APP_TENANT_SURROGATE:legacy-default}
  orchestration:
    command-v1-enabled: ${APP_ORCHESTRATION_COMMAND_V1_ENABLED:false}
    command-outbox:
      enabled: ${APP_ORCHESTRATION_COMMAND_OUTBOX_ENABLED:false}
      batch-size: ${APP_ORCHESTRATION_COMMAND_OUTBOX_BATCH_SIZE:32}
      lease-duration: ${APP_ORCHESTRATION_COMMAND_OUTBOX_LEASE_DURATION:PT1M}
      max-attempts: ${APP_ORCHESTRATION_COMMAND_OUTBOX_MAX_ATTEMPTS:8}
      base-backoff: ${APP_ORCHESTRATION_COMMAND_OUTBOX_BASE_BACKOFF:PT1S}
      max-backoff: ${APP_ORCHESTRATION_COMMAND_OUTBOX_MAX_BACKOFF:PT5M}
      poll-interval: ${APP_ORCHESTRATION_COMMAND_OUTBOX_POLL_INTERVAL:PT5S}

dispute:
  evidence-window: ${EVIDENCE_WINDOW:PT2H}
  hearing-window: ${HEARING_WINDOW:PT3H}
  hearing-party-stage-window: ${HEARING_PARTY_STAGE_WINDOW:PT20M}
  sse-heartbeat: ${SSE_HEARTBEAT:PT15S}
  seed-demo-disputes: ${SEED_DEMO_DISPUTES:false}
