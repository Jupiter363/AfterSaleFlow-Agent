name: ${PRODUCTION_RUNTIME_PROJECT_NAME:?provision a host-locked production runtime run first}

x-runtime-labels: &runtime-labels
  production-runtime.after-sale-flow.dev/run-id: ${PRODUCTION_RUNTIME_RUN_ID:?}
  production-runtime.after-sale-flow.dev/build-id: ${PRODUCTION_RUNTIME_BUILD_ID:?}
  production-runtime.after-sale-flow.dev/source-commit: ${PRODUCTION_RUNTIME_SOURCE_COMMIT:?}
  production-runtime.after-sale-flow.dev/project: ${PRODUCTION_RUNTIME_PROJECT_NAME:?}
  production-runtime.after-sale-flow.dev/lock-nonce: ${PRODUCTION_RUNTIME_LOCK_NONCE:?}
  production-runtime.after-sale-flow.dev/image-lock-hash: ${PRODUCTION_RUNTIME_IMAGE_LOCK_HASH:?}
  production-runtime.after-sale-flow.dev/production-lane-runnable: "false"
  production-runtime.after-sale-flow.dev/application-contracts: blocking

x-resource-labels: &resource-labels
  production-runtime.after-sale-flow.dev/run-id: ${PRODUCTION_RUNTIME_RUN_ID:?}
  production-runtime.after-sale-flow.dev/project: ${PRODUCTION_RUNTIME_PROJECT_NAME:?}
  production-runtime.after-sale-flow.dev/lock-nonce: ${PRODUCTION_RUNTIME_LOCK_NONCE:?}
  production-runtime.after-sale-flow.dev/image-lock-hash: ${PRODUCTION_RUNTIME_IMAGE_LOCK_HASH:?}

x-java-environment: &java-environment
  APP_ENV: production-runtime
  POSTGRES_HOST: domain-db
  POSTGRES_PORT: 5432
  POSTGRES_USER: domain_app
  POSTGRES_PASSWORD: ${PRODUCTION_RUNTIME_DOMAIN_APP_PASSWORD:?}
  JAVA_DB_NAME: production_domain
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${PRODUCTION_RUNTIME_REDIS_PASSWORD:?}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${PRODUCTION_RUNTIME_MINIO_ROOT_USER:?}
  MINIO_ROOT_PASSWORD: ${PRODUCTION_RUNTIME_MINIO_ROOT_PASSWORD:?}
  ELASTICSEARCH_URL: http://elasticsearch:9200
  TEMPORAL_ADDRESS: temporal-server:7233
  TEMPORAL_NAMESPACE: ${PRODUCTION_RUNTIME_TEMPORAL_NAMESPACE:?}
  TEMPORAL_TASK_QUEUE: production-runtime-case-dispute
  TEMPORAL_SEARCH_ATTRIBUTES_ENABLED: "false"
  TEMPORAL_PAYLOAD_CODEC_MODE: DISABLED
  OTEL_TRACING_ENABLED: "false"
  SEED_DEMO_DISPUTES: "false"
  PYTHON_AGENT_SERVICE_URL: https://graph-mtls-proxy:8443
  OCR_SERVICE_URL: http://ocr-parser-service:8010
  JAVA_SERVICE_SECRET: ${PRODUCTION_RUNTIME_JAVA_SERVICE_SECRET:?}
  PYTHON_AGENT_SERVICE_SECRET: ${PRODUCTION_RUNTIME_PYTHON_SERVICE_SECRET:?}
  OCR_SERVICE_SECRET: ${PRODUCTION_RUNTIME_OCR_SERVICE_SECRET:?}
  APP_TENANT_SURROGATE: ${PRODUCTION_RUNTIME_TENANT_SURROGATE:?}
  PRODUCTION_RUNTIME_ACTIVATION_ID: ${PRODUCTION_RUNTIME_ACTIVATION_ID:?}
  PRODUCTION_RUNTIME_ACTIVATION_MANIFEST_HASH: ${PRODUCTION_RUNTIME_ACTIVATION_MANIFEST_HASH:?}
  PRODUCTION_RUNTIME_GRAPH_RUNTIME_CONTEXT_HASH: ${PRODUCTION_RUNTIME_GRAPH_RUNTIME_CONTEXT_HASH:?}
  PRODUCTION_RUNTIME_ENVIRONMENT_ID: ${PRODUCTION_RUNTIME_ENVIRONMENT_ID:?}
  PRODUCTION_RUNTIME_ENVIRONMENT_GENERATION: ${PRODUCTION_RUNTIME_ENVIRONMENT_GENERATION:?}
  PRODUCTION_RUNTIME_RUN_NONCE: ${PRODUCTION_RUNTIME_RUN_NONCE:?}
  PRODUCTION_RUNTIME_CASE_BUILD_ID: ${PRODUCTION_RUNTIME_CASE_BUILD_ID:?}
  PRODUCTION_RUNTIME_CONTROL_BUILD_ID: ${PRODUCTION_RUNTIME_CONTROL_BUILD_ID:?}
  PRODUCTION_RUNTIME_AGENT_BUILD_ID: ${PRODUCTION_RUNTIME_AGENT_BUILD_ID:?}
  PRODUCTION_RUNTIME_GRAPH_BINDING_HASH: ${PRODUCTION_RUNTIME_GRAPH_ACTIVATION_BINDING_HASH:?}
  PRODUCTION_RUNTIME_GRAPH_CODE_BUILD_ID: ${PRODUCTION_RUNTIME_GRAPH_CODE_BUILD_ID:?}
  PRODUCTION_RUNTIME_ISOLATED_DOMAIN_DB_BINDING_HASH: ${PRODUCTION_RUNTIME_ISOLATED_DOMAIN_DB_BINDING_HASH:?}
  PRODUCTION_RUNTIME_INTAKE_AGENT_PROFILE_ID: ${PRODUCTION_RUNTIME_GRAPH_AGENT_PROFILE_ID:?}
  PRODUCTION_RUNTIME_INTAKE_PROMPT_VERSION: ${PRODUCTION_RUNTIME_GRAPH_PROMPT_VERSION:?}
  PRODUCTION_RUNTIME_INTAKE_MODEL_PROFILE_ID: ${PRODUCTION_RUNTIME_GRAPH_MODEL_PROFILE_ID:?}
  PRODUCTION_RUNTIME_INTAKE_POLICY_VERSION: ${PRODUCTION_RUNTIME_GRAPH_POLICY_VERSION:?}
  PRODUCTION_RUNTIME_INTAKE_GUARDRAIL_VERSION: ${PRODUCTION_RUNTIME_GRAPH_GUARDRAIL_VERSION:?}
  PRODUCTION_RUNTIME_INTAKE_TOOL_POLICY_VERSION: ${PRODUCTION_RUNTIME_GRAPH_TOOL_POLICY_VERSION:?}
  PRODUCTION_RUNTIME_INTAKE_MEMORY_POLICY_VERSION: GRAPH_PRIVATE_NO_MEMORY_FRAME_V1
  PRODUCTION_RUNTIME_INTAKE_ENVELOPE_KEY_ID: ${PRODUCTION_RUNTIME_GRAPH_SIGNING_KEY_ID:?}
  APP_PRODUCTION_RUNTIME_CASE_ID_PREFIX: CASE_P9_SYNTHETIC_
  APP_ORCHESTRATION_COMMAND_V1_ENABLED: "true"
  APP_ORCHESTRATION_NEW_EPOCH_MODE: TEMPORAL
  APP_ORCHESTRATION_NON_LEGACY_EPOCH_ALLOCATION_ENABLED: "true"
  APP_ORCHESTRATION_TEMPORAL_WRITER_ENABLED: "true"
  APP_ORCHESTRATION_INTAKE_EPOCH_SELECTION_MODE: LEGACY
  APP_ORCHESTRATION_INTAKE_SHADOW_COHORT_BASIS_POINTS: "0"
  APP_ORCHESTRATION_INTAKE_COHORT_POLICY_VERSION: production-runtime.temporal.v1
  APP_ORCHESTRATION_COMMAND_OUTBOX_ENABLED: "true"
  APP_ORCHESTRATION_ROOM_EPOCH_BOOTSTRAP_ENABLED: "true"
  APP_ORCHESTRATION_DOMAIN_EVENT_RECOVERY_ENABLED: "true"
  APP_ORCHESTRATION_PROJECTION_RECONCILIATION_ENABLED: "true"
  APP_AGENT_RUN_V2_ENABLED: "true"
  APP_AGENT_RUN_V2_PROTOCOL_DEFAULT: V3
  APP_AGENT_RUN_V2_SCHEDULER_MODE: DETECTOR
  ENABLE_AUDIT_LOG: "true"
  ENABLE_SENSITIVE_LOG_MASKING: "true"

x-java-core-depends: &java-core-depends
  domain-db:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully
  elasticsearch-init:
    condition: service_completed_successfully
  temporal-namespace-init:
    condition: service_completed_successfully

services:
  domain-db:
    image: ${PRODUCTION_RUNTIME_POSTGRES_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: production_domain_admin
      POSTGRES_PASSWORD: ${PRODUCTION_RUNTIME_DOMAIN_ADMIN_PASSWORD:?}
      DOMAIN_DB_NAME: production_domain
      DOMAIN_DB_USER: domain_app
      DOMAIN_DB_PASSWORD: ${PRODUCTION_RUNTIME_DOMAIN_APP_PASSWORD:?}
    volumes:
      - production_domain_data:/var/lib/postgresql/data
      - type: bind
        source: ./infra/environments/production-runtime-uat/postgresql/init-domain.sh
        target: /docker-entrypoint-initdb.d/10-init-domain.sh
        read_only: true
    networks: [domain-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  graph-db:
    image: ${PRODUCTION_RUNTIME_POSTGRES_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: production_graph_admin
      POSTGRES_PASSWORD: ${PRODUCTION_RUNTIME_GRAPH_ADMIN_PASSWORD:?}
      GRAPH_DB_NAME: production_graph
      GRAPH_DB_SCHEMA: graph_runtime
      GRAPH_OWNER_USER: graph_owner
      GRAPH_MIGRATOR_USER: graph_migrator
      GRAPH_MIGRATOR_PASSWORD: ${PRODUCTION_RUNTIME_GRAPH_MIGRATOR_PASSWORD:?}
      GRAPH_RUNTIME_USER: graph_runtime
      GRAPH_RUNTIME_PASSWORD: ${PRODUCTION_RUNTIME_GRAPH_RUNTIME_PASSWORD:?}
      GRAPH_RETENTION_USER: graph_retention
      GRAPH_RETENTION_PASSWORD: ${PRODUCTION_RUNTIME_GRAPH_RETENTION_PASSWORD:?}
    volumes:
      - production_graph_data:/var/lib/postgresql/data
      - type: bind
        source: ./infra/environments/production-runtime-uat/postgresql/init-graph.sh
        target: /docker-entrypoint-initdb.d/10-init-graph.sh
        read_only: true
    networks: [graph-data, python-egress]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  temporal-db:
    image: ${PRODUCTION_RUNTIME_POSTGRES_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: production_temporal_admin
      POSTGRES_PASSWORD: ${PRODUCTION_RUNTIME_TEMPORAL_ADMIN_PASSWORD:?}
      TEMPORAL_DB_USER: temporal_app
      TEMPORAL_DB_PASSWORD: ${PRODUCTION_RUNTIME_TEMPORAL_DB_PASSWORD:?}
    volumes:
      - production_runtime_temporal_data:/var/lib/postgresql/data
      - type: bind
        source: ./infra/environments/production-runtime-uat/postgresql/init-temporal.sh
        target: /docker-entrypoint-initdb.d/10-init-temporal.sh
        read_only: true
    networks: [temporal-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis:
    image: ${PRODUCTION_RUNTIME_REDIS_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${PRODUCTION_RUNTIME_REDIS_PASSWORD:?}
    volumes:
      - production_runtime_redis_data:/data
    networks: [cache-data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: ${PRODUCTION_RUNTIME_MINIO_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${PRODUCTION_RUNTIME_MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${PRODUCTION_RUNTIME_MINIO_ROOT_PASSWORD:?}
    volumes:
      - production_runtime_minio_data:/data
    networks: [object-data, python-egress]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio-init:
    image: ${PRODUCTION_RUNTIME_MINIO_MC_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${PRODUCTION_RUNTIME_MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${PRODUCTION_RUNTIME_MINIO_ROOT_PASSWORD:?}
    volumes:
      - type: bind
        source: ./infra/environments/production-runtime-uat/minio/init.sh
        target: /opt/production-runtime/init.sh
        read_only: true
    entrypoint: ["/bin/sh", "/opt/production-runtime/init.sh"]
    networks: [object-data]

  elasticsearch:
    image: ${PRODUCTION_RUNTIME_ELASTICSEARCH_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - production_runtime_elasticsearch_data:/usr/share/elasticsearch/data
    networks: [search-data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  elasticsearch-init:
    image: ${PRODUCTION_RUNTIME_ELASTICSEARCH_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - type: bind
        source: ./infra/environments/production-runtime-uat/elasticsearch/init.sh
        target: /opt/production-runtime/init.sh
        read_only: true
    entrypoint: ["/bin/sh", "/opt/production-runtime/init.sh"]
    networks: [search-data]

  temporal-server:
    image: ${PRODUCTION_RUNTIME_TEMPORAL_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      BIND_ON_IP: 0.0.0.0
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-db
      POSTGRES_USER: temporal_app
      POSTGRES_PWD: ${PRODUCTION_RUNTIME_TEMPORAL_DB_PASSWORD:?}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      SKIP_DB_CREATE: "true"
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./infra/services/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks: [temporal-data, temporal-runtime]
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal-server:7233 cluster health | grep SERVING"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  temporal-namespace-init:
    image: ${PRODUCTION_RUNTIME_TEMPORAL_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: "no"
    depends_on:
      temporal-server:
        condition: service_healthy
    environment:
      PRODUCTION_RUNTIME_TEMPORAL_NAMESPACE: ${PRODUCTION_RUNTIME_TEMPORAL_NAMESPACE:?}
      PRODUCTION_RUNTIME_CONTROL_BUILD_ID: ${PRODUCTION_RUNTIME_CONTROL_BUILD_ID:?}
      PRODUCTION_RUNTIME_AGENT_BUILD_ID: ${PRODUCTION_RUNTIME_AGENT_BUILD_ID:?}
    volumes:
      - type: bind
        source: ./infra/environments/production-runtime-uat/temporal/create-namespace.sh
        target: /opt/production-runtime/create-namespace.sh
        read_only: true
    entrypoint: ["/bin/sh", "/opt/production-runtime/create-namespace.sh"]
    networks: [temporal-runtime]

  graph-migrate:
    image: ${PRODUCTION_RUNTIME_PYTHON_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: "no"
    command: ["python", "-m", "app.graph_runtime.migrations"]
    depends_on:
      graph-db:
        condition: service_healthy
    environment:
      GRAPH_MIGRATION_DATABASE_DSN: postgresql://graph_migrator:${PRODUCTION_RUNTIME_GRAPH_MIGRATOR_PASSWORD:?}@graph-db:5432/production_graph
      GRAPH_MIGRATION_EXPECTED_USER: graph_migrator
      GRAPH_OWNER_USER: graph_owner
      GRAPH_RUNTIME_USER: graph_runtime
      GRAPH_RETENTION_USER: graph_retention
      GRAPH_DB_SCHEMA: graph_runtime
      GRAPH_DB_ENVIRONMENT_GENERATION: ${PRODUCTION_RUNTIME_GRAPH_ENVIRONMENT_GENERATION:?}
      GRAPH_PRODUCTION_RUNTIME_BINDINGS: ${GRAPH_PRODUCTION_RUNTIME_BINDINGS:?}
    networks: [graph-data]

  graph-restore-validation:
    image: ${PRODUCTION_RUNTIME_PYTHON_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: "no"
    command: ["python", "-m", "app.graph_runtime.restore_validation"]
    depends_on:
      graph-migrate:
        condition: service_completed_successfully
    environment:
      GRAPH_MIGRATION_DATABASE_DSN: postgresql://graph_migrator:${PRODUCTION_RUNTIME_GRAPH_MIGRATOR_PASSWORD:?}@graph-db:5432/production_graph
      GRAPH_MIGRATION_EXPECTED_USER: graph_migrator
      GRAPH_OWNER_USER: graph_owner
      GRAPH_DB_SCHEMA: graph_runtime
      GRAPH_DB_ENVIRONMENT_GENERATION: ${PRODUCTION_RUNTIME_GRAPH_ENVIRONMENT_GENERATION:?}
      GRAPH_DB_RESTORE_VERIFICATION_HASH: ${PRODUCTION_RUNTIME_GRAPH_RESTORE_HASH:?}
    networks: [graph-data]

  jwks-server:
    image: ${PRODUCTION_RUNTIME_NGINX_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    volumes:
      - ./infra/environments/production-runtime-uat/nginx/jwks.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${PRODUCTION_RUNTIME_PUBLIC_DIR:?}/jwks/graph-jwks.json
        target: /srv/jwks/graph-jwks.json
        read_only: true
    networks: [python-egress]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/.well-known/graph-jwks.json | grep '\"ES256\"'"]
      interval: 5s
      timeout: 5s
      retries: 20

  python-agent-service:
    image: ${PRODUCTION_RUNTIME_PYTHON_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    command:
      - sh
      - -c
      - umask 000; rm -f /run/production-runtime/python/agent.sock; exec uvicorn production_runtime_mtls_adapter:create_app --factory --uds /run/production-runtime/python/agent.sock --no-server-header
    environment:
      APP_ENV: production-runtime
      LITELLM_BASE_URL: http://model-contract-blocker:4000
      LITELLM_MODEL: production-runtime.contract-blocked
      LITELLM_MASTER_KEY: ${PRODUCTION_RUNTIME_LOCAL_MODEL_KEY:?}
      LANGFUSE_ENABLED: "false"
      LANGFUSE_HOST: http://observability-contract-blocker:3000
      LANGFUSE_PUBLIC_KEY: production-runtime-disabled
      LANGFUSE_SECRET_KEY: ${PRODUCTION_RUNTIME_LOCAL_OBSERVABILITY_KEY:?}
      JAVA_API_SERVICE_URL: http://graph-exchange-proxy:8080
      JAVA_SERVICE_SECRET: ${PRODUCTION_RUNTIME_JAVA_SERVICE_SECRET:?}
      PYTHON_AGENT_SERVICE_SECRET: ${PRODUCTION_RUNTIME_PYTHON_SERVICE_SECRET:?}
      ENABLE_SENSITIVE_LOG_MASKING: "true"
      GRAPH_GATEWAY_MODE: PRODUCTION
      GRAPH_PRODUCTION_RUNTIME_ISOLATED: "true"
      GRAPH_PRODUCTION_RUNTIME_CHECKPOINT_BARRIER_ENABLED: "true"
      GRAPH_PRODUCTION_RUNTIME_CHECKPOINT_BARRIER_DIRECTORY: /run/production-runtime/python/recovery-barrier
      GRAPH_PRODUCTION_RUNTIME_CHECKPOINT_BARRIER_MAXIMUM_WAIT_SECONDS: "30"
      GRAPH_PRODUCTION_RUNTIME_CHECKPOINT_BARRIER_DURABILITY_TIMEOUT_SECONDS: "2"
      GRAPH_PRODUCTION_RUNTIME_CHECKPOINT_BARRIER_POLL_INTERVAL_SECONDS: "0.05"
      GRAPH_DATABASE_DSN: postgresql://graph_runtime:${PRODUCTION_RUNTIME_GRAPH_RUNTIME_PASSWORD:?}@graph-db:5432/production_graph
      GRAPH_DATABASE_NAME: production_graph
      GRAPH_DATABASE_USER: graph_runtime
      GRAPH_DATABASE_SCHEMA: graph_runtime
      GRAPH_JWKS_URL: http://jwks-server:8080/.well-known/graph-jwks.json
      GRAPH_EXPECTED_SPIFFE_ID: spiffe://after-sale-flow/java-api-service
      GRAPH_EXPECTED_ENVIRONMENT_GENERATION: ${PRODUCTION_RUNTIME_GRAPH_ENVIRONMENT_GENERATION:?}
      GRAPH_EXPECTED_RESTORE_VERIFICATION_HASH: ${PRODUCTION_RUNTIME_GRAPH_RESTORE_HASH:?}
      PRODUCTION_RUNTIME_ACTIVATION_MANIFEST_HASH: ${PRODUCTION_RUNTIME_ACTIVATION_MANIFEST_HASH:?}
      GRAPH_PRODUCTION_RUNTIME_CONTEXT: ${GRAPH_PRODUCTION_RUNTIME_CONTEXT:?}
      GRAPH_PRODUCTION_RUNTIME_BINDINGS: ${GRAPH_PRODUCTION_RUNTIME_BINDINGS:?}
      PRODUCTION_RUNTIME_MTLS_CA_CERTIFICATE_PATH: /run/production-runtime/public/ca.crt
      PRODUCTION_RUNTIME_MTLS_CA_CERT_SHA256: ${PRODUCTION_RUNTIME_MTLS_CA_CERT_SHA256:?}
      PRODUCTION_RUNTIME_MTLS_CLIENT_CERT_SHA256: ${PRODUCTION_RUNTIME_MTLS_CLIENT_CERT_SHA256:?}
    volumes:
      - ./contracts/agent-platform/v1:/contracts/agent-platform/v1:ro
      - ./infra/environments/production-runtime-uat/python/mtls_adapter.py:/app/production_runtime_mtls_adapter.py:ro
      - type: bind
        source: ${PRODUCTION_RUNTIME_SOCKET_DIR:?}
        target: /run/production-runtime/python
      - type: bind
        source: ${PRODUCTION_RUNTIME_PUBLIC_DIR:?}/mtls/ca.crt
        target: /run/production-runtime/public/ca.crt
        read_only: true
    depends_on:
      graph-restore-validation:
        condition: service_completed_successfully
      jwks-server:
        condition: service_healthy
    networks: [python-egress]
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/production-runtime/python/agent.sock && kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  graph-exchange-proxy:
    image: ${PRODUCTION_RUNTIME_NGINX_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    volumes:
      - ./infra/environments/production-runtime-uat/nginx/exchange.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      java-api-service:
        condition: service_healthy
    networks: [python-egress, graph-exchange]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  graph-mtls-proxy:
    image: ${PRODUCTION_RUNTIME_NGINX_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    depends_on:
      python-agent-service:
        condition: service_healthy
    volumes:
      - ./infra/environments/production-runtime-uat/nginx/mtls.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${PRODUCTION_RUNTIME_SECRETS_DIR:?}/mtls/server.crt
        target: /run/production-runtime/mtls/server.crt
        read_only: true
      - type: bind
        source: ${PRODUCTION_RUNTIME_SECRETS_DIR:?}/mtls/server.key
        target: /run/production-runtime/mtls/server.key
        read_only: true
      - type: bind
        source: ${PRODUCTION_RUNTIME_SECRETS_DIR:?}/mtls/ca.crt
        target: /run/production-runtime/mtls/ca.crt
        read_only: true
      - type: bind
        source: ${PRODUCTION_RUNTIME_SOCKET_DIR:?}
        target: /run/production-runtime/python
    networks: [graph-mtls-client, app-internal]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/backend-healthz | grep -q '\"status\":\"UP\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  ocr-parser-service:
    image: ${PRODUCTION_RUNTIME_OCR_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      APP_ENV: production-runtime
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${PRODUCTION_RUNTIME_MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${PRODUCTION_RUNTIME_MINIO_ROOT_PASSWORD:?}
      MINIO_BUCKET_EVIDENCE_ORIGINAL: production-runtime-evidence-original
      MINIO_BUCKET_EVIDENCE_DESENSITIZED: production-runtime-evidence-desensitized
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JAVA_API_SERVICE_URL: http://java-api-service:8080
      OCR_SERVICE_SECRET: ${PRODUCTION_RUNTIME_OCR_SERVICE_SECRET:?}
      OCR_TEMP_DIR: /var/lib/ocr-parser
      ENABLE_SENSITIVE_LOG_MASKING: "true"
    volumes:
      - production_runtime_ocr_data:/var/lib/ocr-parser
      - production_runtime_ocr_models:/home/app/.paddlex
    depends_on:
      minio-init:
        condition: service_completed_successfully
      elasticsearch-init:
        condition: service_completed_successfully
    networks: [object-data, search-data, ocr-plane]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  java-api-service:
    image: ${PRODUCTION_RUNTIME_JAVA_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    command: ["-jar", "/home/app/app-production-runtime.jar"]
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: production-runtime,api
      APP_TEMPORAL_WORKER_ENABLED: "false"
      APP_PRODUCTION_RUNTIME_ENABLED: "true"
      PRODUCTION_RUNTIME_LIFECYCLE_SERVICE_SECRET: ${PRODUCTION_RUNTIME_LIFECYCLE_SERVICE_SECRET:?}
      PRODUCTION_RUNTIME_HARNESS_KEY_ID: ${PRODUCTION_RUNTIME_HARNESS_KEY_ID:?}
      PRODUCTION_RUNTIME_HARNESS_PUBLIC_KEY_PATH: /run/production-runtime/harness/harness.public.pem
      PRODUCTION_RUNTIME_HARNESS_PUBLIC_KEY_SHA256: ${PRODUCTION_RUNTIME_HARNESS_PUBLIC_KEY_SHA256:?}
      TEMPORAL_WORKER_ROLE: API
      APP_GRAPH_JWKS_ENABLED: "false"
      APP_AGENT_RUN_V2_GRAPH_SIGNING_KEY_DIRECTORY: /run/production-runtime/graph-signing-keys
      APP_AGENT_RUN_V2_GRAPH_SIGNING_ACTIVE_KEY_ID: ${PRODUCTION_RUNTIME_GRAPH_SIGNING_KEY_ID:?}
    volumes:
      - type: bind
        source: ${PRODUCTION_RUNTIME_SECRETS_DIR:?}/graph-signing-keys
        target: /run/production-runtime/graph-signing-keys
        read_only: true
      - type: bind
        source: ${PRODUCTION_RUNTIME_PUBLIC_DIR:?}/harness/harness.public.pem
        target: /run/production-runtime/harness/harness.public.pem
        read_only: true
    depends_on:
      <<: *java-core-depends
      java-control-worker:
        condition: service_healthy
      ocr-parser-service:
        condition: service_healthy
    networks:
      - domain-data
      - cache-data
      - object-data
      - search-data
      - temporal-runtime
      - ocr-plane
      - app-internal
      - graph-exchange
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  java-control-worker:
    image: ${PRODUCTION_RUNTIME_JAVA_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    command: ["-jar", "/home/app/app-production-runtime.jar"]
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: production-runtime,control-worker
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      APP_TEMPORAL_WORKER_ENABLED: "true"
      APP_PRODUCTION_RUNTIME_ENABLED: "true"
      TEMPORAL_WORKER_ROLE: CONTROL
      TEMPORAL_WORKER_DEPLOYMENT_NAME: production-runtime-control
      TEMPORAL_WORKER_BUILD_ID: ${PRODUCTION_RUNTIME_CONTROL_BUILD_ID:?}
      TEMPORAL_WORKER_VERSIONING_MODE: BUILD_ID
      APP_ORCHESTRATION_COMMAND_OUTBOX_ENABLED: "false"
      APP_PRODUCTION_RUNTIME_ACTIVATION_MANIFEST_PATH: /run/production-runtime/java-activation/activation.jws
      APP_PRODUCTION_RUNTIME_ACTIVATION_PUBLIC_KEYS: ${PRODUCTION_RUNTIME_ACTIVATION_KEY_ID:?}=/run/production-runtime/java-activation/activation.public.pem
      APP_PRODUCTION_RUNTIME_ISOLATION_ATTESTATION_PUBLIC_KEYS: ${PRODUCTION_RUNTIME_ISOLATION_ATTESTATION_KEY_ID:?}=/run/production-runtime/java-activation/isolation-attestation.public.pem
      APP_PRODUCTION_RUNTIME_MEASUREMENT_ISOLATION_ATTESTATION_PATH: /run/production-runtime/java-activation/isolation-attestation.jws
      APP_PRODUCTION_RUNTIME_MEASUREMENT_GRAPH_DATASOURCE_URL: jdbc:postgresql://graph-db:5432/production_graph
      APP_PRODUCTION_RUNTIME_MEASUREMENT_GRAPH_DATASOURCE_USERNAME: graph_runtime
      APP_PRODUCTION_RUNTIME_MEASUREMENT_GRAPH_DATASOURCE_PASSWORD: ${PRODUCTION_RUNTIME_GRAPH_RUNTIME_PASSWORD:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_ARTIFACT_MARKER: PRODUCTION_RUNTIME_JAVA_ARTIFACT_V1
      APP_PRODUCTION_RUNTIME_MEASUREMENT_ENVIRONMENT_ID: ${PRODUCTION_RUNTIME_ENVIRONMENT_ID:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_ENVIRONMENT_GENERATION: ${PRODUCTION_RUNTIME_ENVIRONMENT_GENERATION:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_CANDIDATE_SHA: ${PRODUCTION_RUNTIME_SOURCE_COMMIT:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_TENANT_SURROGATE: ${PRODUCTION_RUNTIME_TENANT_SURROGATE:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_ALLOWED_ROOM_TYPES: INTAKE,EVIDENCE,HEARING,REVIEW
      APP_PRODUCTION_RUNTIME_MEASUREMENT_BUILD_CASE: ${PRODUCTION_RUNTIME_CASE_BUILD_ID:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_BUILD_CONTROL: ${PRODUCTION_RUNTIME_CONTROL_BUILD_ID:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_BUILD_AGENT: ${PRODUCTION_RUNTIME_AGENT_BUILD_ID:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_GRAPH_KEY: ${PRODUCTION_RUNTIME_GRAPH_KEY:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_GRAPH_VERSION: ${PRODUCTION_RUNTIME_GRAPH_VERSION:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_GRAPH_CHECKPOINT_SCHEMA_VERSION: ${PRODUCTION_RUNTIME_GRAPH_CHECKPOINT_SCHEMA_VERSION:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_GRAPH_BINDING_HASH: ${PRODUCTION_RUNTIME_GRAPH_ACTIVATION_BINDING_HASH:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_GRAPH_CODE_BUILD_ID: ${PRODUCTION_RUNTIME_GRAPH_CODE_BUILD_ID:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_IMAGES_JAVA_API: ${PRODUCTION_RUNTIME_JAVA_IMAGE_DIGEST:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_IMAGES_TEMPORAL_CONTROL_WORKER: ${PRODUCTION_RUNTIME_JAVA_IMAGE_DIGEST:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_IMAGES_TEMPORAL_AGENT_WORKER: ${PRODUCTION_RUNTIME_JAVA_IMAGE_DIGEST:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_IMAGES_PYTHON_AGENT: ${PRODUCTION_RUNTIME_PYTHON_IMAGE_DIGEST:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_IMAGES_FRONTEND: ${PRODUCTION_RUNTIME_FRONTEND_IMAGE_DIGEST:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_DATABASE_DOMAIN_CLUSTER_IDENTITY: ${PRODUCTION_RUNTIME_DOMAIN_CLUSTER_IDENTITY:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_DATABASE_DOMAIN_DATABASE_IDENTITY: ${PRODUCTION_RUNTIME_DOMAIN_DATABASE_IDENTITY:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_DATABASE_DOMAIN_RUNTIME_PRINCIPAL_IDENTITY: ${PRODUCTION_RUNTIME_DOMAIN_PRINCIPAL_IDENTITY:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_DATABASE_GRAPH_CLUSTER_IDENTITY: ${PRODUCTION_RUNTIME_GRAPH_CLUSTER_IDENTITY:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_DATABASE_GRAPH_DATABASE_IDENTITY: ${PRODUCTION_RUNTIME_GRAPH_DATABASE_IDENTITY:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_DATABASE_GRAPH_RUNTIME_PRINCIPAL_IDENTITY: ${PRODUCTION_RUNTIME_GRAPH_PRINCIPAL_IDENTITY:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_CASE_SCOPE_MODE: ISOLATED_SYNTHETIC_NEW_CASES
      APP_PRODUCTION_RUNTIME_MEASUREMENT_CASE_SCOPE_CASE_ID_PREFIX: CASE_P9_SYNTHETIC_
      APP_PRODUCTION_RUNTIME_MEASUREMENT_CASE_SCOPE_MAX_CASES: "4"
      APP_PRODUCTION_RUNTIME_MEASUREMENT_CASE_SCOPE_FIXTURE_SET_ID: p9-synthetic-all-rooms-001
      APP_PRODUCTION_RUNTIME_MEASUREMENT_CASE_SCOPE_FIXTURE_SET_HASH: ${PRODUCTION_RUNTIME_SYNTHETIC_FIXTURE_SHA256:?}
      APP_PRODUCTION_RUNTIME_MEASUREMENT_CASE_SCOPE_FIXTURE_READ_ONLY_PATH: /run/production-runtime/java-activation/synthetic-fixtures/p9-synthetic-all-rooms-001.json
      APP_PRODUCTION_RUNTIME_MEASUREMENT_ENVIRONMENT_CLASS: ISOLATED_PREPRODUCTION
      APP_PRODUCTION_RUNTIME_MEASUREMENT_GRAPH_OUTPUT_AUTHORITY: PROPOSAL_ONLY
      APP_PRODUCTION_RUNTIME_MEASUREMENT_FORMAL_WRITER: JAVA_FINALIZER_ONLY
      APP_PRODUCTION_RUNTIME_MEASUREMENT_PRODUCTION_FORMAL_SELECTOR_DEFAULT: LEGACY
      APP_PRODUCTION_RUNTIME_MEASUREMENT_ACTIVATION_DEFAULT: DISABLED
      APP_PRODUCTION_RUNTIME_MEASUREMENT_NETWORK_ISOLATION_MODE: ATTESTED_DENY_EXTERNAL_EGRESS
      APP_PRODUCTION_RUNTIME_MEASUREMENT_EXTERNAL_EFFECTS_ENABLED: "false"
      PYTHON_AGENT_SERVICE_URL: DISABLED
      OCR_SERVICE_URL: DISABLED
      OCR_CALLBACK_BASE_URL: DISABLED
    volumes:
      - type: bind
        source: ${PRODUCTION_RUNTIME_ACTIVATION_DIR:?}
        target: /run/production-runtime/java-activation
        read_only: true
    depends_on:
      <<: *java-core-depends
      graph-db:
        condition: service_healthy
    networks: [domain-data, graph-data, cache-data, object-data, search-data, temporal-runtime]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kill -0 1 && grep -Eqs '^[[:space:]]*[0-9]+:[[:space:]]+[0-9A-F]+:[0-9A-F]{4}[[:space:]]+[0-9A-F]+:1C41[[:space:]]+01[[:space:]]' /proc/net/tcp /proc/net/tcp6",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  java-agent-worker:
    image: ${PRODUCTION_RUNTIME_JAVA_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    command: ["-jar", "/home/app/app-production-runtime.jar"]
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: production-runtime,agent-worker
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      APP_TEMPORAL_WORKER_ENABLED: "true"
      APP_PRODUCTION_RUNTIME_ENABLED: "true"
      TEMPORAL_WORKER_ROLE: AGENT
      TEMPORAL_WORKER_DEPLOYMENT_NAME: production-runtime-agent
      TEMPORAL_WORKER_BUILD_ID: ${PRODUCTION_RUNTIME_AGENT_BUILD_ID:?}
      TEMPORAL_WORKER_VERSIONING_MODE: BUILD_ID
      APP_ORCHESTRATION_COMMAND_OUTBOX_ENABLED: "false"
      APP_AGENT_RUN_V2_GRAPH_CLIENT_MODE: PRODUCTION
      APP_AGENT_RUN_V2_GRAPH_CLIENT_BASE_URI: https://graph-mtls-proxy:8443
      APP_AGENT_RUN_V2_GRAPH_CLIENT_ACTIVATION_ID: ${PRODUCTION_RUNTIME_ACTIVATION_ID:?}
      APP_AGENT_RUN_V2_GRAPH_CLIENT_ALLOW_PLAINTEXT_TRANSPORT: "false"
      APP_AGENT_RUN_V2_GRAPH_SIGNING_KEY_DIRECTORY: /run/production-runtime/graph-signing-keys
      APP_AGENT_RUN_V2_GRAPH_SIGNING_ACTIVE_KEY_ID: ${PRODUCTION_RUNTIME_GRAPH_SIGNING_KEY_ID:?}
      APP_AGENT_RUN_V2_GRAPH_TLS_KEY_STORE_PATH: /run/production-runtime/mtls/client.p12
      APP_AGENT_RUN_V2_GRAPH_CLIENT_TLS_KEY_STORE_PASSWORD: ${PRODUCTION_RUNTIME_MTLS_KEYSTORE_PASSWORD:?}
      APP_AGENT_RUN_V2_GRAPH_TLS_TRUST_STORE_PATH: /run/production-runtime/mtls/trust.p12
      APP_AGENT_RUN_V2_GRAPH_CLIENT_TLS_TRUST_STORE_PASSWORD: ${PRODUCTION_RUNTIME_MTLS_TRUSTSTORE_PASSWORD:?}
      APP_AGENT_RUN_V2_GRAPH_BINDING_GRAPH_KEY: ${PRODUCTION_RUNTIME_GRAPH_KEY:?}
      APP_AGENT_RUN_V2_GRAPH_BINDING_GRAPH_VERSION: ${PRODUCTION_RUNTIME_GRAPH_VERSION:?}
      APP_AGENT_RUN_V2_GRAPH_BINDING_CHECKPOINT_SCHEMA_VERSION: ${PRODUCTION_RUNTIME_GRAPH_CHECKPOINT_SCHEMA_VERSION:?}
      APP_AGENT_RUN_V2_GRAPH_BINDING_AGENT_PROFILE_ID: ${PRODUCTION_RUNTIME_GRAPH_AGENT_PROFILE_ID:?}
      APP_AGENT_RUN_V2_GRAPH_BINDING_PROMPT_PROFILE_ID: ${PRODUCTION_RUNTIME_GRAPH_PROMPT_VERSION:?}
      APP_AGENT_RUN_V2_GRAPH_BINDING_MODEL_PROFILE_ID: ${PRODUCTION_RUNTIME_GRAPH_MODEL_PROFILE_ID:?}
      APP_AGENT_RUN_V2_GRAPH_BINDING_OUTPUT_SCHEMA_VERSION: ${PRODUCTION_RUNTIME_GRAPH_OUTPUT_SCHEMA_VERSION:?}
      APP_AGENT_RUN_V2_GRAPH_BINDING_POLICY_VERSION: ${PRODUCTION_RUNTIME_GRAPH_POLICY_VERSION:?}
      APP_AGENT_RUN_V2_GRAPH_BINDING_GUARDRAIL_VERSION: ${PRODUCTION_RUNTIME_GRAPH_GUARDRAIL_VERSION:?}
      APP_AGENT_RUN_V2_GRAPH_BINDING_AUDIENCE: SYSTEM
      APP_AGENT_RUN_V2_GRAPH_BINDING_REGISTRY_HASH: ${PRODUCTION_RUNTIME_GRAPH_REGISTRY_HASH:?}
      APP_AGENT_RUN_V2_GRAPH_BINDING_TOOL_POLICY_VERSION: ${PRODUCTION_RUNTIME_GRAPH_TOOL_POLICY_VERSION:?}
    volumes:
      - type: bind
        source: ${PRODUCTION_RUNTIME_SECRETS_DIR:?}/graph-signing-keys
        target: /run/production-runtime/graph-signing-keys
        read_only: true
      - type: bind
        source: ${PRODUCTION_RUNTIME_SECRETS_DIR:?}/mtls
        target: /run/production-runtime/mtls
        read_only: true
    depends_on:
      <<: *java-core-depends
      java-control-worker:
        condition: service_healthy
      graph-mtls-proxy:
        condition: service_healthy
    networks:
      - domain-data
      - cache-data
      - object-data
      - search-data
      - temporal-runtime
      - graph-mtls-client
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kill -0 1 && grep -Eqs '^[[:space:]]*[0-9]+:[[:space:]]+[0-9A-F]+:[0-9A-F]{4}[[:space:]]+[0-9A-F]+:1C41[[:space:]]+01[[:space:]]' /proc/net/tcp /proc/net/tcp6",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    image: ${PRODUCTION_RUNTIME_FRONTEND_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/healthz | grep ok"]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway:
    image: ${PRODUCTION_RUNTIME_NGINX_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRODUCTION_RUNTIME_GATEWAY_PORT:-25180}:8080"
    volumes:
      - ./infra/environments/production-runtime-uat/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      java-api-service:
        condition: service_healthy
    networks: [edge, app-internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mtls-proof:
    profiles: [evidence]
    image: ${PRODUCTION_RUNTIME_CURL_IMAGE:?immutable image digest required}
    labels: *runtime-labels
    restart: "no"
    command:
      - --fail
      - --silent
      - --show-error
      - --cacert
      - /run/production-runtime/mtls/ca.crt
      - --cert
      - /run/production-runtime/mtls/client.crt
      - --key
      - /run/production-runtime/mtls/client.key
      - https://graph-mtls-proxy:8443/ready/graph
    volumes:
      - type: bind
        source: ${PRODUCTION_RUNTIME_SECRETS_DIR:?}/mtls
        target: /run/production-runtime/mtls
        read_only: true
    depends_on:
      graph-mtls-proxy:
        condition: service_healthy
    networks: [graph-mtls-client]

