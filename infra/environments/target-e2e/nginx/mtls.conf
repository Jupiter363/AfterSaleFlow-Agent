upstream target_e2e_python_backend {
    server unix:/run/target-e2e/python/agent.sock;
    keepalive 8;
}

server {
    listen 8080;
    server_tokens off;

    location = /backend-healthz {
        proxy_set_header Host python-agent-service;
        proxy_set_header X-Target-E2E-Mtls-Verified "";
        proxy_set_header X-Target-E2E-Mtls-Certificate "";
        proxy_pass http://target_e2e_python_backend/health;
    }

    # This is the sole unauthenticated backend route. It reports the candidate
    # Graph runtime state and exposes neither command nor stream endpoints.
    location = /ready/graph {
        proxy_set_header Host python-agent-service;
        proxy_set_header X-Client-Cert "";
        proxy_set_header X-SSL-Client-Cert "";
        proxy_set_header X-Forwarded-Client-Cert "";
        proxy_set_header X-Service-Identity "";
        proxy_set_header X-Target-E2E-Mtls-Verified "";
        proxy_set_header X-Target-E2E-Mtls-Certificate "";
        proxy_pass http://target_e2e_python_backend/ready/graph;
    }

    location / {
        return 404;
    }
}

server {
    listen 8443 ssl;
    server_name graph-mtls-proxy;
    server_tokens off;

    ssl_protocols TLSv1.3;
    ssl_certificate /run/target-e2e/mtls/server.crt;
    ssl_certificate_key /run/target-e2e/mtls/server.key;
    ssl_client_certificate /run/target-e2e/mtls/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 1;
    ssl_session_tickets off;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 610s;
    proxy_read_timeout 610s;
    send_timeout 610s;

    location / {
        proxy_set_header Host python-agent-service;
        proxy_set_header Connection "";
        proxy_set_header X-Client-Cert "";
        proxy_set_header X-SSL-Client-Cert "";
        proxy_set_header X-Forwarded-Client-Cert "";
        proxy_set_header X-Service-Identity "";
        proxy_set_header X-Target-E2E-Mtls-Verified $ssl_client_verify;
        proxy_set_header X-Target-E2E-Mtls-Certificate $ssl_client_escaped_cert;
        proxy_pass http://target_e2e_python_backend;
    }
}
