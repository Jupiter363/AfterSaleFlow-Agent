server {
    listen 8080;
    server_tokens off;

    location = /.well-known/graph-jwks.json {
        limit_except GET { deny all; }
        default_type application/jwk-set+json;
        add_header Cache-Control "public, max-age=30, immutable" always;
        alias /srv/jwks/graph-jwks.json;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
